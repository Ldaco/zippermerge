<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippermerge · Workspace</title>
<style>
:root{
  --bg:#e9edf2; --side:#e1e6ed; --surf:#f8f9fb; --surf2:#ffffff; --hover:#eef1f6; --sel:#e3eafa;
  --bd:#d1d8e1; --bd2:#e1e5ec; --tx:#1b2430; --mu:#556171; --mu2:#76818f;
  --ac:#2c5bc9; --acbg:#e6edfb; --acbd:#bccdf3;
  --red:#c0313c; --redbg:#fdecee; --redbd:#f2bfc4;
  --amb:#935800; --ambbg:#fff3d9; --ambbd:#ecd196;
  --grn:#1b7f46; --grnbg:#e2f4ea; --grnbd:#b5dfc6;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"Courier New",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:15px}
@media (max-width:2100px){html{font-size:14px}}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100vh}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:10px;margin:12px 12px 8px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--surf2);text-align:left;width:calc(100% - 24px)}
.ws:hover{background:var(--hover)}
.ws-badge{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3a68d8,#2a4aa6);color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center;flex:none}
.ws-t{line-height:1.25;flex:1;min-width:0}.ws-t b{display:block;font-size:.93rem}.ws-t span{font-size:.78rem;color:var(--mu)}
.ws-chev{color:var(--mu2);font-size:.8rem}
.search-btn{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:6px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--surf);color:var(--mu);width:calc(100% - 24px);text-align:left}
.search-btn:hover{background:var(--surf2);border-color:#b8c1ce}
.search-btn span{flex:1}
kbd{font:600 .72rem/1 var(--mono);padding:3px 5px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;background:var(--surf2);color:var(--mu)}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px}
.nav-h{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu2);padding:12px 10px 4px}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:6px;background:none;color:#364252;text-align:left;font-size:.95rem;line-height:1.4;margin-bottom:1px}
.ni:hover{background:rgba(255,255,255,.55)}
.ni.on{background:var(--surf2);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--bd)}
.ni svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--mu)}
.ni.on svg{color:var(--ac)}
.ni .l{flex:1}
.ni kbd{opacity:0;transition:opacity .12s}.ni:hover kbd{opacity:1}
.badge{font-size:.72rem;font-weight:700;min-width:20px;text-align:center;padding:0 6px;border-radius:10px;background:#cfd6e0;color:#34404f;line-height:1.55}
.badge.red{background:var(--red);color:#fff}.badge.amber{background:#e8a317;color:#3a2600}
.ni.sub{padding-left:14px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#9aa5b3;box-shadow:0 0 0 3px rgba(154,165,179,.2)}
.dot.ok{background:#22a35a;box-shadow:0 0 0 3px rgba(34,163,90,.2)}
.dot.amber{background:#e8a317;box-shadow:0 0 0 3px rgba(232,163,23,.22)}
.dot.red{background:#d63b47;box-shadow:0 0 0 3px rgba(214,59,71,.22)}
.dot.pulse.ok{animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,163,90,.45)}100%{box-shadow:0 0 0 7px rgba(34,163,90,0)}}
@media (prefers-reduced-motion:reduce){.dot.pulse.ok{animation:none}*{transition:none!important}}
.foot{border-top:1px solid var(--bd);padding:10px 14px;font-size:.8rem;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.foot .r{display:flex;align-items:center;gap:8px}.foot b{color:var(--tx);font-weight:600}
/* main */
.main{overflow-y:auto;overflow-x:hidden;min-width:0;position:relative}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 32px;background:rgba(233,237,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.crumb{font-size:.9rem;color:var(--mu)}.crumb b{color:var(--tx);font-size:1.05rem;font-weight:650;margin-left:4px}
.top .sp{flex:1}
.tb{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--surf2);color:var(--mu);font-size:.88rem}
.tb:hover{border-color:#b8c1ce;color:var(--tx)}
.content{padding:24px 32px 64px}
/* generic */
.page{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surf2);border:1px solid var(--bd);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--bd2)}
.ph h2{margin:0;font-size:.95rem;font-weight:650;letter-spacing:.005em}
.ph .cnt{font-size:.75rem;font-weight:700;color:var(--mu);background:#e8ecf2;border-radius:10px;padding:0 8px}
.ph .sp{flex:1}.ph .hint{font-size:.82rem;color:var(--mu)}
.pb{padding:4px 0}
.empty{padding:20px 16px;color:var(--mu);font-size:.93rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--surf);font-size:.82rem;line-height:1.6;color:#2f3b4a;white-space:normal;overflow-wrap:anywhere;max-width:100%;min-width:0}
button.chip:hover{background:var(--hover);border-color:#b8c1ce}
.chip.mono{font-family:var(--mono);font-size:.78rem}
.chip.red{background:var(--redbg);border-color:var(--redbd);color:var(--red)}
.chip.amber{background:var(--ambbg);border-color:var(--ambbd);color:var(--amb)}
.chip.green{background:var(--grnbg);border-color:var(--grnbd);color:var(--grn)}
.chip.blue{background:var(--acbg);border-color:var(--acbd);color:var(--ac)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1px solid;font-size:.66rem;font-weight:700;flex:none;letter-spacing:.02em}
.av.xs{width:16px;height:16px;border-radius:4px;font-size:.54rem}
.av.lg{width:38px;height:38px;border-radius:10px;font-size:.95rem}
.tm{white-space:nowrap}
.mono,.code,.path,.sha{font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
.code{overflow-wrap:anywhere;background:#eef1f5;border:1px solid var(--bd2);border-radius:4px;padding:0 4px}
.path{background:#f0f3f7;border-radius:4px;padding:0 3px;overflow-wrap:anywhere}
.sha{color:#6b4fb3}
.pr{color:var(--ac);font-weight:600;cursor:pointer;border-radius:3px}.pr:hover{background:var(--acbg);text-decoration:underline}
.mention{color:#7a4b13;background:#fbefd9;border-radius:4px;padding:0 3px;cursor:pointer}
.arrow{color:var(--mu2)}
.rich{overflow-wrap:anywhere}
mark.hl{background:#ffe27a;color:inherit;border-radius:3px;padding:0 1px;outline:2px solid #ffe27a}
.dim{color:var(--mu2)}
/* rows */
.row{position:relative;cursor:pointer;border-bottom:1px solid var(--bd2);transition:background .1s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--ac)}
.row:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.row.focus{background:#fff6cf}
/* banners */
.banners{display:flex;flex-direction:column;gap:8px}
.banner{display:grid;grid-template-columns:auto minmax(0,auto) minmax(0,1fr) minmax(0,auto);align-items:center;gap:14px;padding:12px 16px;border:1px solid;border-radius:10px}
.banner.red{background:var(--redbg);border-color:var(--redbd);box-shadow:inset 4px 0 0 var(--red)}
.banner.amber{background:var(--ambbg);border-color:var(--ambbd);box-shadow:inset 4px 0 0 #e8a317}
.banner.ok{background:var(--grnbg);border-color:var(--grnbd);color:var(--grn);grid-template-columns:auto 1fr}
.banner .nm{font-weight:700;font-size:1.05rem;font-family:var(--mono)}
.banner.red .nm{color:var(--red)}.banner.amber .nm{color:var(--amb)}
.banner .why{color:#33404f}
.banner .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:.88rem;min-width:0}
.banner .nm,.banner .why{min-width:0;overflow-wrap:anywhere}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:12px 16px}
.stat .sl{font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.stat .sv{font-size:1.9rem;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.stat .sv small{font-size:1rem;color:var(--mu);font-weight:500}
.stat .ss{font-size:.84rem;color:var(--mu);overflow-wrap:anywhere}
.stat{min-width:0}
.stat.red{border-color:var(--redbd);background:var(--redbg)}.stat.red .sv{color:var(--red)}
.stat.amber{border-color:var(--ambbd);background:var(--ambbg)}.stat.amber .sv{color:var(--amb)}
.stat.green .sv{color:var(--grn)}
/* overview */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:24px;align-items:start}
.ov-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.ov-side{display:flex;flex-direction:column;gap:20px;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;overflow-x:hidden;min-width:0;padding-bottom:4px}
.row2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1900px){.ov{grid-template-columns:minmax(0,1fr) 380px}}
@media (max-width:1500px){.ov{grid-template-columns:minmax(0,1fr)}.ov-side{position:static;max-height:none}.row2{grid-template-columns:minmax(0,1fr)}}
/* attention */
.att{display:grid;grid-template-columns:4px 96px minmax(0,1fr) minmax(0,auto) 16px;gap:14px;align-items:start;padding:10px 16px 10px 0}
.att .bar{align-self:stretch;border-radius:0 3px 3px 0;background:#9aa5b3;margin:-10px 0}
.att.red .bar{background:#d63b47}.att.amber .bar{background:#e8a317}.att.info .bar{background:#5b8def}
.att .kind{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding-top:2px;padding-left:12px}
.att.red .kind{color:var(--red)}.att.amber .kind{color:var(--amb)}.att.info .kind{color:var(--ac)}
.att .txt{overflow-wrap:anywhere}
.att .mt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;color:var(--mu);font-size:.84rem;min-width:0;max-width:320px}
.att .go{color:var(--mu2);opacity:0;transition:opacity .1s;padding-top:1px}.att:hover .go,.att.sel .go{opacity:1}
/* up next */
.nx{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:10px 16px;align-items:start;border-bottom:1px solid var(--bd2)}
.nx:last-child{border-bottom:0}
.nx .cd{font-weight:650;font-size:1.05rem;line-height:1.4}
.nx .cd.over{color:var(--red)}.nx .cd.soon{color:var(--amb)}
.nx .tt{overflow-wrap:anywhere}
.nx .mt{display:flex;gap:8px;align-items:center;margin-top:3px;color:var(--mu);font-size:.82rem;flex-wrap:wrap}
.nowline{display:flex;align-items:center;gap:10px;padding:2px 16px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.nowline:before,.nowline:after{content:"";flex:1;height:1px;background:var(--acbd)}
.nowline:before{flex:0 0 12px}
/* session card */
.sessions{display:flex;flex-direction:column;gap:16px}
.sc{background:var(--surf2);border:1px solid var(--bd);border-radius:10px}
.sc.sel{box-shadow:0 0 0 2px var(--ac)}
.sc-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--bd2);cursor:pointer;border-radius:10px 10px 0 0}
.sc-h:hover{background:var(--hover)}
.sc-t{min-width:min(200px,100%);overflow-wrap:anywhere}.sc-t b{font-size:1.1rem;font-weight:650;display:block;line-height:1.3}
.sc-t span{color:var(--mu);font-size:.85rem}
.sc-meta{display:flex;gap:6px 14px;flex-wrap:wrap;flex:1;color:var(--mu);font-size:.86rem;align-items:center}
.sc-meta .mi b{color:var(--tx);font-weight:600}
.sc-u{display:flex;gap:6px;flex-wrap:wrap}
.state{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:0 8px;border-radius:10px;background:var(--grnbg);color:var(--grn);border:1px solid var(--grnbd);margin-left:6px}
.state.other{background:#e8ecf2;color:var(--mu);border-color:var(--bd)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,640px),1fr));gap:0 36px;padding:6px 18px 10px}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px dashed var(--bd2)}
.kv.wide{grid-column:1/-1}
.kv .k{font-size:.76rem;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding-top:2px}
.kv .v{min-width:0}
.kv.warn{background:linear-gradient(90deg,var(--ambbg),transparent 70%);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:6px}
.kv.warn .k{color:var(--amb)}
.kv.danger{background:linear-gradient(90deg,var(--redbg),transparent 70%);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:6px}
.kv.danger .k{color:var(--red)}.kv.danger .v{font-weight:600;color:var(--red)}
.items{list-style:none;margin:0;padding:0}
.items li{padding:2px 0 2px 14px;position:relative}
.items li:before{content:"";position:absolute;left:2px;top:.8em;width:5px;height:5px;border-radius:50%;background:#b2bcc9}
.v .lead{margin-bottom:4px}
/* feed */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd2)}
.fi:last-child{border-bottom:0}
.fi .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--mu)}
.fi .hd b{color:var(--tx);font-weight:650}
.fi .bd{margin-top:2px;overflow-wrap:anywhere}
.kt{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:0 6px;border-radius:4px;background:#e8ecf2;color:#45526a}
.kt.lock{background:var(--redbg);color:var(--red)}.kt.unlock{background:var(--grnbg);color:var(--grn)}
.kt.claim{background:var(--acbg);color:var(--ac)}.kt.hello{background:#efe8fb;color:#6a3fb0}.kt.status{background:#e8ecf2}
.kt.note{background:var(--ambbg);color:var(--amb)}
.ov-line{padding:10px 16px;border-bottom:1px solid var(--bd2)}
.ov-line:last-child{border-bottom:0}
.ov-line .fh{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.ov-line .sess{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
/* migrations */
.nl{display:flex;flex-wrap:wrap;gap:0;padding:26px 18px 18px;position:relative}
.nt{flex:0 0 auto;width:220px;position:relative;padding:0 8px}
.nt:before{content:"";position:absolute;top:13px;left:0;right:0;height:2px;background:#c4ccd8}
.nt .pin{position:relative;width:28px;height:28px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:.7rem;font-weight:700;border:2px solid;background:#fff}
.nt.main .pin{background:var(--grn);border-color:var(--grn);color:#fff}
.nt.claim .pin{background:var(--ambbg);border-color:#e0a21f;color:var(--amb);border-style:dashed}
.nt.gap .pin{background:#f4f6f9;border-color:#b2bcc9;color:#8693a3;border-style:dotted}
.nt.prob .pin{background:var(--red);border-color:var(--red);color:#fff}
.nt .n{text-align:center;font-size:1.35rem;font-weight:700;line-height:1.2}
.nt .nm{text-align:center;font-size:.8rem;color:var(--mu);overflow-wrap:anywhere;font-family:var(--mono);min-height:2.4em}
.nt .wh{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.nt.hl-n .n{background:#ffe27a;border-radius:6px}
.mflag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.68rem;font-weight:700;color:var(--grn);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.legend{display:flex;gap:16px;padding:8px 18px 14px;color:var(--mu);font-size:.84rem;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th{position:sticky;top:0;text-align:left;font-size:.72rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);padding:0;border-bottom:1px solid var(--bd);background:var(--surf)}
.tbl th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:8px 14px;cursor:pointer;font-size:.72rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.tbl th button:hover{background:var(--hover);color:var(--tx)}
.tbl th.on button{color:var(--ac)}
.tbl th.r button{justify-content:flex-end}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--bd2);vertical-align:top;overflow-wrap:anywhere}
.tbl td.r{text-align:right}
.tbl tr.tr:hover td{background:var(--hover)}
.tbl tr.sel td{background:var(--sel)}
.tbl tr.focus td{background:#fff6cf}
.tbl .dirty{color:var(--amb);font-weight:700}.tbl .behind{color:var(--red);font-weight:600}.tbl .ahead{color:var(--grn);font-weight:600}
.tbl .z{color:#a3adba}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd2)}
.fchip{padding:2px 10px;border:1px solid var(--bd);border-radius:14px;background:var(--surf);font-size:.84rem;display:inline-flex;gap:6px;align-items:center}
.fchip:hover{background:var(--hover)}.fchip.on{background:var(--acbg);border-color:var(--acbd);color:var(--ac);font-weight:600}
.prob{display:grid;grid-template-columns:4px 70px minmax(0,1fr);gap:14px;padding:10px 16px 10px 0;border-bottom:1px solid var(--bd2)}
.prob .bar{background:#d63b47;margin:-10px 0;border-radius:0 3px 3px 0}.prob.amber .bar{background:#e8a317}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1500px){.two{grid-template-columns:minmax(0,1fr)}}
.hist{padding:14px 18px 8px}
.hist svg{width:100%;height:76px;display:block}
.hist .ax{display:flex;justify-content:space-between;color:var(--mu2);font-size:.75rem}
.note{padding:8px 16px;color:var(--mu);font-size:.85rem}
/* overlays */
.back{position:fixed;inset:0;background:rgba(27,36,48,.38);display:none;z-index:50;align-items:flex-start;justify-content:center;padding-top:11vh}
.back.open{display:flex}
.pal{width:min(760px,92vw);max-height:72vh;display:flex;flex-direction:column;background:var(--surf2);border:1px solid var(--bd);border-radius:12px;box-shadow:0 24px 60px rgba(20,30,50,.3);overflow:hidden}
.pal input{border:0;outline:0;padding:16px 18px;font:inherit;font-size:1.1rem;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx)}
.pal-l{overflow-y:auto;overflow-x:hidden;padding:6px}
.pi{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:7px 12px;border-radius:7px;cursor:pointer;align-items:start}
.pi.on{background:var(--sel)}
.pi .ty{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);padding-top:3px}
.pi .lb{font-weight:600;overflow-wrap:anywhere}
.pi .sb{font-size:.84rem;color:var(--mu);overflow-wrap:anywhere}
.pal-f{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--bd);color:var(--mu);font-size:.8rem;background:var(--surf)}
.help{width:min(560px,92vw);background:var(--surf2);border:1px solid var(--bd);border-radius:12px;padding:18px 22px;box-shadow:0 24px 60px rgba(20,30,50,.3)}
.help h3{margin:0 0 10px;font-size:1.05rem}
.help .hr{display:flex;justify-content:space-between;gap:20px;padding:5px 0;border-bottom:1px dashed var(--bd2)}
.help .hr:last-child{border-bottom:0}
.corner{position:fixed;right:12px;bottom:10px;z-index:40;font-size:.75rem;padding:3px 10px;border-radius:12px;background:rgba(27,36,48,.85);color:#fff;text-decoration:none;font-weight:600}
.corner:hover{background:#1b2430}
.page>*,.sessions>*{min-width:0}
.sc{min-width:0}
.prr{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;padding:3px 0;min-width:0;overflow-wrap:anywhere}
.prr .ttl{flex:1 1 260px;min-width:0;overflow-wrap:anywhere}
.prr a{color:var(--ac)}
.morebtn{margin:6px 0 0;border:1px solid var(--bd);background:var(--surf2);border-radius:7px;padding:3px 12px;font-size:.88rem;color:var(--mu)}
.morebtn:hover{background:var(--hover);color:var(--tx)}
@media (max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr)}.content{padding:16px}.top{padding:10px 16px}.kv{grid-template-columns:1fr;gap:2px}}

<script>
(function () {

}

/* ---------- time ---------- */
function fmtDur(sec) {

}
function absText(t) { var d = new Date(t); return d.toLocaleString() + '  |  ' + d.toISOString().replace('.000', ''); }

/* ---------- rich text ---------- */
var RX = /(`[^`]+`)|(\s->\s)|(#\d{2,5}\b)|(@[A-Za-z][\w-]*)|((?:[A-Za-z]:)?[\w.()\[\]{}*,\-]+(?:[\\\/][\w.()\[\]{}*,\-]+)+)|(\b[0-9a-f]{7,8}\b)/g;

}

  sessions: 'M8 3a2.5 2.5 0 1 0 .001 0zM3 13c0-3 2-4.5 5-4.5s5 1.5 5 4.5',

  migrations: 'M6 2L5 14M11 2L10 14M2.5 6h11.5M2 10h11.5',
  mergequeue: 'M4 2v12M4 5a2 2 0 1 0 .001 0M12 11a2 2 0 1 0 .001 0M12 11V8c0-2-2-3-4-3H6',
  worktrees: 'M5 3v10M5 7c0 2 6 0 6-3M5 3a1 1 0 1 0 .001 0M11 4a1 1 0 1 0 .001 0M5 13a1 1 0 1 0 .001 0',
  activity: 'M2 8h3l2-5 3 10 2-5h2',
  search: 'M7 12a5 5 0 1 0 .001 0zM11 11l3 3',
  lock: 'M4 7h8v6H4zM5.5 7V5a2.5 2.5 0 0 1 5 0v2',

/* heartbeat: 'late' and 'silent' are the only bad values; 'ok', 'n/a' or missing are never bad */

/* PRs: failing CI first, then drafts, then newest update; show 8 with a Show all N toggle */
var PR_CAP = 8, PRX = {};
function prCi(p) { return str(obj(p.checks).conclusion).toLowerCase() || 'none'; }

function sortPrItems(items) {

}

}
function prLine(p) {

  if (url.indexOf('https://github.com/') === 0) { var a = h('a', '', title); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.addEventListener('click', function (ev) { ev.stopPropagation(); }); t.appendChild(a); }

}

  var prs = ownerPrs(slug); if (!prs.length) return null;
  var row = h('div', 'kv wide'); row.appendChild(h('div', 'k', 'Open PRs · ' + prs.length));
  var v = h('div', 'v'), list = h('div'); v.appendChild(list); row.appendChild(v);
  addCapped(list, v, 'prs:' + slug, prs, prLine);

}
function fieldOf(s, key) { var f = obj(obj(s.fields)[key]); return { value: str(f.value), items: arr(f.items).map(str) }; }

  var o = arr(s.order).map(str), fk = Object.keys(obj(s.fields));
  fk.forEach(function (k) { if (o.indexOf(k) < 0) o.push(k); });
  return o.filter(function (k) { return obj(s.fields)[k] !== undefined; });
}

/* ---------- derived data ---------- */
function attention() {
  var d = S.data, out = [];
  var given = arr(d.attention);
  if (given.length) {
    given.forEach(function (a) { a = obj(a); out.push({ sev: sevOf(a.sev), kind: str(a.kind) || 'item', slug: str(a.slug), text: str(a.text), since: str(a.since), ageMin: a.ageMin, ref: str(a.ref) }); });
  } else {
    arr(d.locks).forEach(function (l) { l = obj(l); out.push({ sev: str(l.lock) === 'main-freeze' ? 'red' : 'amber', kind: 'lock', slug: str(l.owner), text: str(l.lock) + ' held: ' + str(l.why), since: str(l.since), ref: str(l.lock) }); });

      var a = fieldOf(s, 'Asks');

    });

}
function timelineItems() {

    var at = tms(t.atUtc);

/* ---------- routing ---------- */
var VIEWS = ['overview', 'inbox', 'timeline', 'migrations', 'worktrees', 'activity'];

}
window.addEventListener('hashchange', function () { setView(parseHash()); });

/* ---------- sidebar / topbar ---------- */
function navItem(id, label, key, count, countCls) {

}

function renderFoot() {
