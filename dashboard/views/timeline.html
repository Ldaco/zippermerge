<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippermerge · Timeline</title>
<link rel="stylesheet" href="/dashboard.css">
<style>
[hidden]{display:none!important}
#main{padding:var(--page-inset);max-inline-size:100%}
#main h1,#main h2,#main h3{margin:0}
.masthead,.toolbar,.session-heading,.fresh,.evidence-heading{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2) var(--space-4);min-inline-size:0
}
.masthead{justify-content:space-between;margin-block-end:var(--space-4)}
.masthead>*{min-inline-size:0;overflow-wrap:anywhere}
#connection{margin:0;color:var(--text-muted)}
#poll.bad,.red{color:var(--danger)}
.amber{color:var(--warning)} .blue{color:var(--info)} .green{color:var(--success)}
.sc{font-weight:600;color:var(--text-secondary)}
#banners,.grid{display:grid;gap:var(--space-4);align-items:start}
#banners,.sessions,.panels{grid-template-columns:repeat(auto-fit,minmax(min(100%,25rem),1fr))}
#banners:empty{display:none}
.banner{border-inline-start:4px solid var(--info);overflow-wrap:anywhere}
.banner.red{border-inline-start-color:var(--danger)}
.banner.amber{border-inline-start-color:var(--warning)}
.banner .t{font-weight:650}
.banner .m{color:var(--text-secondary)}
#vitals{display:flex;gap:var(--space-3) var(--space-6);margin-block:var(--space-4);flex-wrap:wrap}
.vital .n{font-size:var(--text-metric);line-height:var(--line-metric);font-weight:650;font-variant-numeric:tabular-nums}
#board-content,.section-stack{display:grid;gap:var(--space-5)}
.evidence{display:grid;gap:var(--space-4);grid-template-columns:minmax(16rem,1fr) minmax(0,2.8fr);align-items:start}
.evidence>*{min-inline-size:0}
.evidence-heading{justify-content:space-between}
#events,#chart,#inspector{overflow-wrap:anywhere}
#inspector{border-inline-start:4px solid var(--accent)}
#inspector p{margin:var(--space-2) 0 0}
#event-body{white-space:pre-wrap}
#cluster-events{padding-inline-start:var(--space-5);margin-block-end:0}
#cluster-events li+li{margin-block-start:var(--space-2)}
.event-scroll,.tlwrap{max-block-size:39rem;margin-block-start:var(--space-2);border:1px solid var(--divider);border-radius:var(--radius-sm)}
.event-scroll .tbl{table-layout:fixed;border:0}
.event-scroll .tbl th:first-child{inline-size:6.5rem}
.event-scroll td{vertical-align:top}
.event-summary{font-weight:650}
.event-meta,.empty,.clock,.row .meta,.mqrow .blk{color:var(--text-muted)}
.event-meta{margin-block:var(--space-1) var(--space-2)}
.event-selected{display:block;font-weight:650}
.event-empty{margin:var(--space-3)}
.event-page{margin-block-start:var(--space-2)}
.plot{display:block;max-inline-size:none;background:var(--surface-subtle)}
.plot text{font-family:var(--font-ui);font-size:var(--text-xs);fill:var(--text)}
.plot .lane-name{font-size:var(--text-md);font-weight:650}
.plot .time-label{font-family:var(--font-mono)}
.plot .plate{fill:var(--surface-subtle)}
.plot .measure{visibility:hidden}
.plot .visual{pointer-events:none}
.plot .marker{cursor:pointer}
.plot .hit{fill:transparent;stroke:transparent}
.plot .marker:hover .hit{stroke:var(--control-border)}
.plot .marker[data-selected] .hit{stroke:var(--accent);stroke-width:2}
.plot .marker[data-selected] .selected-mark{display:block}
.plot .selected-mark{display:none;fill:var(--accent);stroke:var(--surface);stroke-width:1px;paint-order:stroke}
.plot .cluster-shape{fill:var(--surface);stroke:var(--control-border);stroke-width:2}
.plot .cluster-count{font-weight:650}
.plot .tick{fill:var(--surface-subtle);stroke:var(--tick-ink);stroke-width:2}
.plot .axis{stroke:var(--divider)}
.plot .now-line{stroke:var(--text);stroke-width:2}
.plot .now-plate{fill:var(--text)}
.plot .now-text{fill:var(--surface);font-weight:650}
.plot .band{stroke-width:2}
.legend{margin-block-start:var(--space-2)}
.legend summary{display:list-item;inline-size:fit-content}
#legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-block-start:var(--space-2);color:var(--text-secondary)}
#legend span{display:inline-flex;gap:var(--space-1);align-items:center}
.session-heading{margin-block-end:var(--space-2)}
.fresh{color:var(--text-secondary);border-block:1px solid var(--divider);padding-block:var(--space-2);margin-block-end:var(--space-2)}
.f{margin:0 0 var(--space-2);padding-inline-start:var(--space-2);border-inline-start:2px solid var(--divider)}
.f.locks{border-inline-start-color:var(--danger)} .f.asks{border-inline-start-color:var(--warning)}
.f.risky,.f.prs{border-inline-start-color:var(--info)}
.f.none .v{color:var(--text-muted)}
.f .v{margin:0;white-space:pre-wrap}
.f ul{margin:var(--space-1) 0 0;padding-inline-start:var(--space-4)}
.row,.mqrow{display:flex;gap:var(--space-2);padding-block:var(--space-2);border-block-end:1px solid var(--divider);align-items:baseline}
.row .g{flex:0 0 1rem;text-align:center}
.row .body{flex:1 1 0;min-inline-size:0;white-space:pre-wrap}
.row .meta{text-align:end;min-inline-size:0;max-inline-size:42%;font-size:var(--text-xs)}
.morebtn{margin-block-start:var(--space-2)}
.tag{margin-inline-end:var(--space-1)}
.hl{background:var(--surface-selected)}
tr.hl td{background:var(--surface-selected)}
#mq .mqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);align-items:start}
#mq .card,.panels .card,.sessions .card{overflow-wrap:anywhere}
#main #mq .mqgrid h3,#main .panels h3{margin-block-end:var(--space-2)}
.mqfree{color:var(--success);font-weight:650}
.mqrun{border-inline-start:4px solid var(--danger);padding-inline-start:var(--space-2)}
.mqphase{margin-block-start:var(--space-3)}
.mqrow{flex-wrap:wrap}
.mqrow .pos{flex:0 0 1.5rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.mqrow .mid{flex:1 1 10rem;min-inline-size:0}
.mqrow .blk{display:block;font-size:var(--text-xs)}
.sess{color:var(--on-identity);background:var(--owner-color);border-color:transparent;margin-inline-end:var(--space-1)}
.mqrider{margin-block:var(--space-2);padding-inline-start:var(--space-4);color:var(--text-secondary)}
:is(.mqrow,.row,.mqrider,.mqrun,#event-body) a{display:inline-block;min-inline-size:24px;min-block-size:24px;max-inline-size:100%}
.table-detail{margin-block-start:var(--space-2)}
.table-detail table{table-layout:fixed}
.table-detail--worktrees table{min-inline-size:40rem}
.table-detail--migrations table{min-inline-size:27rem}
#main .card :is(td,th){vertical-align:top}
@media (max-width:64rem){
  #mq .mqgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:48rem){
  .evidence{grid-template-columns:minmax(0,1fr)}
  .event-scroll,.tlwrap{max-block-size:25rem}
}
@media (max-width:40rem){
  .masthead>h1{flex-basis:100%}
  .event-scroll .tbl :is(td,th){padding-inline:var(--space-2)}
  .event-scroll .tbl th:first-child{inline-size:5.5rem}
}
@media (forced-colors: active){
  .banner,.sess,.event-scroll,.tlwrap,#inspector{border-color:CanvasText}
  #main :is(.card,.state,.tbl,.tbl thead th,.chip,#connection,.clock,.poll,.sc,.m,.meta,.fresh,.event-meta,.empty,.blk,.mqrider,.mqfree,.red,.amber,.blue,.green,.f.none .v){color:CanvasText}
  #main .sess{background:Canvas;color:CanvasText}
  .plot{forced-color-adjust:none;background:Canvas;--tick-ink:CanvasText}
  .plot [stroke]:not([stroke='none']){stroke:CanvasText}
  .plot [fill]:not([fill='none']):not([fill^='url(']):not([fill='context-stroke']){fill:CanvasText}
  .plot text,.plot .selected-mark{fill:CanvasText}
  .plot .plate,.plot .tick,.plot .cluster-shape{fill:Canvas}
  .plot .now-plate{fill:CanvasText}
  .plot .now-text{fill:Canvas}
  .plot .axis,.plot .now-line,.plot .cluster-shape,.plot .tick{stroke:CanvasText}
  .plot .selected-mark{fill:Highlight;stroke:Canvas}
  .plot .marker[data-selected] .hit,.plot .marker:hover .hit{stroke:Highlight}
  #main .event-button[aria-pressed="true"]{forced-color-adjust:none;background:Highlight;color:HighlightText;border-color:Highlight}
}
@media print{
  .evidence{display:block}
  .event-scroll,.tlwrap{max-block-size:none}
  #chart{display:none}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<main id="main" aria-labelledby="view-title" tabindex="-1">
  <header class="masthead">
    <h1 id="view-title" tabindex="-1">Live Timeline</h1>
    <span class="clock mono" id="clock"></span>
    <p id="connection"><span id="poll">Connecting to the board…</span> <time id="snapshot"></time></p>
    <div class="toolbar no-print">
      <button class="btn" id="pause-updates" type="button" aria-pressed="false" hidden>Pause live updates</button>
      <button class="btn" id="retry" type="button" hidden>Retry now</button>
    </div>
    <p class="sr-only" id="announcement" role="status" aria-atomic="true"></p>
  </header>
  <p class="state" id="board-state" data-state="loading">Loading Timeline…</p>
  <div id="board-content" hidden>
    <div id="banners"></div>
    <div id="vitals"></div>
    <section class="card" id="inspector" aria-labelledby="inspector-title" hidden>
      <div class="evidence-heading">
        <h2 id="inspector-title" tabindex="-1">Event details</h2>
        <button class="btn no-print" id="close-event" type="button">Close</button>
      </div>
      <h3 id="event-title"></h3>
      <p id="event-body"></p>
      <ul id="cluster-events" hidden></ul>
    </section>
    <div class="evidence">
      <section class="card" id="events" aria-labelledby="events-title">
        <h2 id="events-title" tabindex="-1">Events</h2>
        <p id="no-events" class="empty event-empty" hidden>No events in this Timeline window.</p>
        <div class="event-scroll tbl-scroll focus-inset print-scroll" id="event-scroll" role="region" aria-label="Events table" tabindex="0" hidden>
          <table class="tbl">
            <caption class="sr-only">Timeline events by UTC time</caption>
            <thead><tr><th scope="col">Time (UTC)</th><th scope="col">Event</th></tr></thead>
            <tbody id="event-rows"></tbody>
          </table>
        </div>
        <div id="event-pages" class="toolbar event-page no-print" hidden>
          <button type="button" class="btn" id="prev-events" aria-disabled="true">Previous</button>
          <span id="event-count"></span>
          <button type="button" class="btn" id="next-events" aria-disabled="false">Next</button>
        </div>
      </section>
      <section class="card" id="chart" aria-labelledby="chart-title">
        <h2 id="chart-title">Chart</h2>
        <details class="legend">
          <summary class="btn">Chart legend</summary>
          <div id="legend"></div>
        </details>
        <div class="tlwrap tbl-scroll focus-inset" id="tlwrap" role="region" aria-label="Timeline plot" tabindex="0"></div>
      </section>
    </div>
    <section class="section-stack" aria-labelledby="merge-queue-title">
      <h2 id="merge-queue-title" tabindex="-1">Merge queue</h2>
      <div id="mq"></div>
    </section>
    <section class="section-stack" aria-labelledby="sessions-title">
      <h2 id="sessions-title" tabindex="-1">Sessions</h2>
      <div class="grid sessions" id="sessions"></div>
    </section>
    <section class="section-stack" aria-labelledby="board-details-title">
      <h2 id="board-details-title" tabindex="-1">Board details</h2>
      <div class="grid panels" id="panels"></div>
    </section>
  </div>
</main>

<script>
'use strict';
var NS = 'http://www.w3.org/2000/svg';
var MIN = 60000, HOUR = 3600000;
var data = null, offset = 0, lastSig = '', pinned = null, hover = null;
var paused = false, frozenAt = null;
var boardPoll = { value: null, error: '', pending: false };
var historyPoll = { value: null, error: '', pending: false };
var observedReplies = new Map();

function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, String(attrs[k]));
  add(e, kids);
  return e;
}
function add(e, kids) {
  if (kids === undefined || kids === null) return;
  if (!Array.isArray(kids)) kids = [kids];
  kids.forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { add(e, c); return; } /* nested child lists (e.g. from .map) flatten */
    e.appendChild(c && typeof c === 'object' && typeof c.nodeType === 'number' ? c : document.createTextNode(String(c)));
  });
}
function sv(tag, attrs, text) {
  var e = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, String(attrs[k]));
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function byId(id) { return document.getElementById(id); }
function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

/* Keep controls and links mounted while their sibling data changes. */
function patchChildren(parent, next) {
  if (!parent.firstChild) {
    parent.replaceChildren(...(next.childNodes || next.children));
    return;
  }
  if (parent.nodeType === 1 && next.nodeType === 1 && parent.isEqualNode(next)) return;
  const old = [...parent.childNodes];
  const keyOf = node => node.nodeType === 1 ? node.getAttribute('data-row') : null;
  const keyed = new Map(old.filter(node => keyOf(node) !== null).map(node => [keyOf(node), node]));
  const unkeyed = old.filter(node => keyOf(node) === null);
  const retained = new Set();
  let cursor = parent.firstChild;
  let index = 0;
  for (const fresh of [...next.childNodes]) {
    const key = keyOf(fresh);
    const earlier = key === null ? unkeyed[index++] : keyed.get(key);
    let child = fresh;
    if (earlier && earlier.nodeName === fresh.nodeName && earlier.namespaceURI === fresh.namespaceURI) {
      child = earlier;
      retained.add(child);
      if (child.nodeType === 3) {
        if (child.data !== fresh.data) child.data = fresh.data;
      } else if (!child.isEqualNode(fresh)) {
        for (const attr of [...child.attributes]) {
          if (!fresh.hasAttribute(attr.name)) child.removeAttribute(attr.name);
        }
        for (const attr of fresh.attributes) {
          if (child.getAttribute(attr.name) !== attr.value) child.setAttribute(attr.name, attr.value);
        }
        patchChildren(child, fresh);
      }
    }
    if (child !== cursor) {
      if (child.parentNode === parent && parent.moveBefore) parent.moveBefore(child, cursor);
      else parent.insertBefore(child, cursor);
    }
    cursor = child.nextSibling;
  }
  for (const child of old) {
    if (!retained.has(child)) child.remove();
  }
}

function returnFocus(active, fallback) {
  if (!active || active === document.activeElement && !active.closest('[hidden]')) return;
  if (active.isConnected && !active.closest('[hidden]')) active.focus({ preventScroll: true });
  else byId(fallback).focus({ preventScroll: true });
}

function updateTile(id, rows, fallback) {
  const target = byId(id);
  const active = target.contains?.(document.activeElement) ? document.activeElement : null;
  patchChildren(target, h('div', null, rows));
  returnFocus(active, fallback);
}

function arr(v) { return Array.isArray(v) ? v : []; }
function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
function str(v) { return v === null || v === undefined ? '' : String(v); }
function now() { return frozenAt ?? Date.now() + offset; }
function ts(v) { var t = Date.parse(str(v)); return isNaN(t) ? null : t; }
function hhmm(t) { var d = new Date(t); return ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
function dur(min) {
  if (min === null || min === undefined || isNaN(min)) return '?';
  var m = Math.round(Math.abs(min));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + ('0' + (m % 60)).slice(-2) + 'm';
}
function isNone(s) { return /^\s*none\b/i.test(str(s)); }
/* heartbeat: only 'late' and 'silent' are bad; 'ok', 'n/a' or missing are not */
function badHealth(hb) { var v = str(obj(hb).health).toLowerCase(); return v === 'late' || v === 'silent'; }
function hbExpected(hb) { return obj(hb).expected !== false; }
function countOpenAsks(d, n) {
  var open = new Set();
  visibleAsks(d, n).forEach(function (a) {
    if (a.answered === false) open.add(a.key);
  });
  return open.size;
}
/* attention rows of kind 'ask' come once per target: keep one per source post + text */
function dedupeAttention(list) {
  var seen = {};
  return list.filter(function (a) {
    if (str(obj(a).kind) !== 'ask') return true;
    var k = str(a.ref) + '|' + str(a.text).replace(/^@\S+\s+unanswered\s+/, '');
    if (seen[k]) return false; seen[k] = true; return true;
  });
}
/* PRs: failing CI first, then drafts, then newest update */
var PR_CAP = 8, expanded = new Set();
function createDisclosure(key, label, open) {
  return h('button', {
    type: 'button', class: 'btn morebtn', 'data-disclosure': key, 'data-row': 'toggle:' + key,
    'aria-controls': 'more-' + encodeURIComponent(key), 'aria-expanded': open
  }, label);
}
function addCapped(list, parent, key, items, build, wrapper = 'div') {
  for (const item of items.slice(0, PR_CAP)) list.appendChild(build(item));
  if (items.length <= PR_CAP) return;
  const open = expanded.has(key);
  parent.appendChild(createDisclosure(key, open ? 'Show fewer' : 'Show all ' + items.length, open));
  parent.appendChild(h(wrapper, { id: 'more-' + encodeURIComponent(key), 'data-row': 'more:' + key, hidden: open ? null : '' },
    open ? items.slice(PR_CAP).map(build) : []));
}

function prCi(p) { return str(obj(p.checks).conclusion).toLowerCase() || 'none'; }
function prFailing(p) { return prCi(p) === 'failure' || Number(obj(p.checks).failure) > 0; }
function prRank(p) { return prFailing(p) ? 0 : (p.draft === true ? 1 : 2); }
function sortPrs(items) {
  return items.slice().sort(function (x, y) { var r = prRank(x) - prRank(y); return r !== 0 ? r : (ts(y.updatedAt) || 0) - (ts(x.updatedAt) || 0); });
}
function ownerPrs(d, slug) { return sortPrs(arr(obj(d.prs).items).map(obj).filter(function (p) { return str(p.owner) === slug; })); }
function prByNumber(d) { var m = {}; arr(obj(d.prs).items).map(obj).forEach(function (p) { m[str(p.number)] = p; }); return m; }
function prRow(p) {
  var ci = prCi(p), url = mqSafeUrl(p.url);
  var title = '#' + str(p.number) + ' ' + str(p.title);
  var ttl = url ? h('a', { href: url, target: '_blank', rel: 'noopener' }, title) : h('span', null, title);
  var tags = [];
  if (p.draft === true) tags.push(h('span', { 'class': 'chip tag' }, 'draft'));
  tags.push(h('span', { 'class': 'chip tag' }, ci === 'none' ? 'No CI results' : 'CI ' + ci));
  var t = ts(p.updatedAt);
  return h('div', { class: 'row', 'data-row': 'pr:' + str(p.number) }, [
    h('span', { class: 'g ' + (prFailing(p) ? 'red' : ci === 'success' ? 'green' : 'blue'), 'aria-hidden': 'true' }, prFailing(p) ? '×' : ci === 'success' ? '●' : '○'),
    h('div', { 'class': 'body' }, [ttl, str(p.headRef) ? h('div', { 'class': 'mono' }, str(p.headRef)) : null]),
    h('div', { 'class': 'meta' }, [tags, t !== null ? h('div', null, 'updated ' + dur((now() - t) / MIN) + ' ago') : null])]);
}
function prBlock(slug, prs) {
  var box = h('div', { 'class': 'f prs' }), list = h('div');
  box.appendChild(h('div', { 'class': 'sc' }, 'Open PRs · ' + prs.length));
  box.appendChild(list);
  addCapped(list, box, 'prs:' + slug, prs, prRow);
  return box;
}

/* ---------- merge queue (board.mergeQueue, rendered only) ---------- */
// D-13 identity allocation. Hash UTF-16 code units from zero with
// (hash * 31 + codeUnit) >>> 0, then reduce modulo eight.
// Take the first six unique slugs in board order, then sort them. Keep the
// previous slots of sessions still in those six before probing for new ones.
// Advance by one modulo eight on collision. Other known slugs use their
// base hash. Map zero-based indices to --identity-1 through --identity-8,
// and use --identity-fallback for a missing or unknown session.
const IDENTITY_SLOT_COUNT = 8;
const ATC_SECTOR_LIMIT = 6;

function sessionColorIndex(slug) {
  let hash = 0;
  for (let i = 0; i < slug.length; i++) hash = (hash * 31 + slug.charCodeAt(i)) >>> 0;
  return hash % IDENTITY_SLOT_COUNT;
}

function identityIndices(sessions, previous = new Map()) {
  // Match ATC's six visible sectors and reserve colors for sessions that stayed visible.
  const slugs = [...new Set(sessions.map(session => str(session.slug)).filter(Boolean))].slice(0, ATC_SECTOR_LIMIT).sort();
  const indices = new Map();
  const used = new Set();
  for (const slug of slugs) {
    if (!previous.has(slug)) continue;
    const index = previous.get(slug);
    indices.set(slug, index);
    used.add(index);
  }
  for (const slug of slugs) {
    if (indices.has(slug)) continue;
    let index = sessionColorIndex(slug);
    while (used.has(index)) index = (index + 1) % IDENTITY_SLOT_COUNT;
    indices.set(slug, index);
    used.add(index);
  }
  return indices;
}

function slugColor(slug, indices) {
  if (!slug) return 'var(--identity-fallback)';
  const index = indices?.get(slug) ?? sessionColorIndex(slug);
  return 'var(--identity-' + (index + 1) + ')';
}

var identity = new Map(), knownSessions = new Set();
var MQ_STATUS = new Map([
  ['landing', { label: 'Landing', role: 'danger', icon: 'locked' }],
  ['ready', { label: 'Ready', role: 'success', icon: 'success' }],
  ['ci', { label: 'CI running', role: 'info', icon: 'clock' }],
  ['needs-work', { label: 'Needs work', role: 'warning', icon: 'warning' }],
  ['stacked', { label: 'Stacked', role: 'neutral', icon: 'layers' }],
  ['held', { label: 'On hold', role: 'neutral', icon: 'locked' }],
]);
function queueStatus(value) {
  return MQ_STATUS.get(value) || { label: 'Unknown status', role: 'neutral', icon: 'info' };
}
function chip(role, label, icon) {
  return h('span', { class: 'chip', 'data-role': role }, [

/* ---------- derived data ---------- */
function laneList(d, asks, replies) {
  var lanes = [], seen = new Set();
  function addLane(slug, session, askOnly) {
    if (!slug || seen.has(slug)) return;
    seen.add(slug);
    lanes.push({ slug: slug, s: session, askOnly: askOnly });
  }
  arr(d.sessions).forEach(function (s) { if (s) addLane(s.slug, s, false); });
  arr(d.log).forEach(function (l) { if (l) addLane(l.slug, null, false); });
  asks.forEach(function (a) { addLane(a.from, null, true); addLane(a.to, null, true); });
  arr(replies).forEach(function (r) { addLane(r.slug, null, true); });
  arr(obj(d.activity).events).forEach(event => addLane(event.slug, null, false));
  arr(d.reservations).forEach(reservation => addLane(reservation.owner, null, false));
  arr(d.locks).forEach(lock => addLane(lock.owner, null, false));
  lanes.push({ slug: 'repo', repo: true });
  return lanes;
}
function buildAsks(d) {
  return arr(d.timelineAsks).map(function (a) {
    var logName = a.source === 'log' ? a.ref : null;
    return { from: a.from, to: a.to, t: ts(a.at), body: a.text, answered: a.answered, viaReply: a.answeredVia === 'reply',
      kind: logName ? 'ask post' : 'ask in status', key: logName ? 'a:' + logName : 'a:status:' + a.from, logName: logName };
  });
}
function visibleAsks(d, n) {
  return buildAsks(d).filter(function (a) { return a.t !== null && a.t >= n - 3 * HOUR && a.t <= n + 2 * HOUR; });
}
function lockEnd(d, lock) {
  var best = null;
  arr(d.timeline).forEach(function (e) {
    if (e.source === 'lock' && e.slug === lock.owner && str(e.text).indexOf(lock.lock) >= 0 && ts(e.atUtc)) best = ts(e.atUtc);
  });
  return best;
}
function lockStart(l) {
  var e = Number(l.since_epoch); if (e > 0) return e * 1000;
  return ts(l.since);
}

/* ---------- v5: activity strip, reservations, replies (server facts, drawn only) ---------- */
function subIntervals(evs, nowCount, t0, n) {
  var ss = evs.filter(function (o) { return o.e.event === 'subagent-start' || o.e.event === 'subagent-stop'; });
  var delta = 0;
  ss.forEach(function (o) { delta += o.e.event === 'subagent-start' ? 1 : -1; });
  var c = Math.max(0, (Number(nowCount) || 0) - delta), out = [], start = c > 0 ? t0 : null;
  ss.forEach(function (o) {
    var prev = c;
    c = Math.max(0, c + (o.e.event === 'subagent-start' ? 1 : -1));
    if (prev === 0 && c > 0) start = o.t;
    else if (prev > 0 && c === 0 && start !== null) { out.push([start, o.t]); start = null; }
  });
  if (c > 0 && start !== null) out.push([start, n]);
  return out;
}
function buildReplies(d) {
  var out = [], seen = new Set(), posts = new Map();
  arr(d.log).forEach(function (l) {
    posts.set(l.name, l);
    var t = ts(l.timestamp);
    if (str(l.re) && t !== null) { seen.add(l.name); out.push({ re: str(l.re), name: str(l.name), slug: str(l.slug), t: t, body: str(l.body) }); }
  });
  arr(d.timelineAsks).forEach(function (a) {
    if (a.answeredVia !== 'reply' || !a.replyRef || !a.ref || seen.has(a.replyRef)) return;
    var post = posts.get(a.replyRef);
    var t = ts(post ? post.timestamp : a.answeredAt);
    var slug = str(post ? post.slug : a.answeredBy);
    if (t === null || !slug) return;
    seen.add(a.replyRef);
    out.push({ re: a.ref, name: a.replyRef, slug: slug, t: t, body: str(post ? post.body : a.replyText) });
  });
  return out;
}

/* ---------- events shared by the table and chart ---------- */
function eventKey(type, ...parts) {
  return type + ':' + encodeURIComponent(JSON.stringify(parts));
}
function countdownKey(entry) {
  return eventKey('countdown', entry.slug, entry.source, entry.text, entry.atUtc);
}
function utcStamp(t) {
  return new Date(t).toISOString().replace('T', ' ').replace(/(?:\.000)?Z$/, ' UTC');
}
function utcTime(t) { return t === null ? 'Time unknown' : hhmm(t) + ' UTC'; }
const HOOK_TYPES = new Map([
  ['edit', 'Edit'], ['prompt', 'Prompt'], ['stop', 'Idle'],
  ['subagent-start', 'Subagent started'], ['subagent-stop', 'Subagent stopped']
]);
function activityType(entry) {
  if (entry.event === 'bash') {
    if (entry.category === 'test') return 'Test';
    if (['build', 'compile', 'lint', 'type'].includes(entry.category)) return 'Build';
    return 'Bash';
  }
  return HOOK_TYPES.get(entry.event) || 'Unknown activity';
}
function reservationMode(mode) {
  if (mode === 'exclusive') return 'Exclusive';
  if (mode === 'shared') return 'Shared';
  return 'Unknown reservation mode';
}
function timelineEntries(d, n) {
  const start = n - 3 * HOUR, end = n + 2 * HOUR;
  const inWindow = time => time !== null && time >= start && time <= end;
  const records = new Map();
  function addRecord(record) { records.set(record.key, record); }
  const posts = new Map(arr(d.log).map(post => [post.name, post]));
  const asks = buildAsks(d);
  const asksByRef = new Map(asks.map(ask => [ask.logName, ask]));
  const replies = buildReplies(d);
  const repliesByName = new Map(replies.map(reply => [reply.name, reply]));
  const activity = obj(d.activity);
  for (const post of posts.values()) {
    const time = ts(post.timestamp);
    if (!inWindow(time) || repliesByName.has(post.name)) continue;
    const relation = asksByRef.get(post.name);
    const kind = relation ? 'Ask post' : (Object.hasOwn(KIND_LABEL, post.kind) ? KIND_LABEL[post.kind] : str(post.kind) || 'Post');
    addRecord({
      key: 'l:' + str(post.name), related: 'l:' + str(post.name), category: 'post', kind: post.kind,
      time, lane: post.slug, session: post.slug, type: kind, title: post.slug + ' · ' + kind,
      body: str(post.body), status: '', logName: post.name
    });
  }
  for (const ask of asks) {
    if (!inWindow(ask.t)) continue;
    const status = ask.viaReply ? 'Answered via reply' : ask.answered === true ? 'Answered' : ask.answered === false ? 'Unanswered' : 'Answer status unknown';
    const session = ask.from + ' → ' + ask.to;
    addRecord({
      key: eventKey('ask', ask.key, ask.to), related: ask.key, category: 'ask', kind: 'ask',
      time: ask.t, lane: ask.from, to: ask.to, session, type: 'Ask', status,
      title: session + ' · ' + ask.kind, body: str(ask.body), logName: ask.logName,
      answered: ask.answered === true, caption: ask.answered === false ? 'Waiting ' + dur((n - ask.t) / MIN) : status
    });
  }
  for (const reply of replies) {
    if (!inWindow(reply.t)) continue;
    const to = posts.get(reply.re)?.slug || asksByRef.get(reply.re)?.from || '';
    const session = reply.slug + (to ? ' → ' + to : '');
    addRecord({
      key: 'l:' + reply.name, related: 'a:' + reply.re + ' l:' + reply.name, category: 'reply', kind: 'reply',
      time: reply.t, lane: reply.slug, to, session, type: 'Reply', status: '', title: session + ' · Reply',
      body: 'Reply to ' + reply.re + (reply.body ? '\n' + reply.body : ''), logName: reply.name, replyTo: reply.re
    });
  }
  for (const claim of arr(d.claims)) {
    const time = ts(claim.claimed);
    if (!inWindow(time)) continue;
    addRecord({
      key: 'c:' + str(claim.number), category: 'post', kind: 'claim', time, lane: 'repo', session: claim.owner,
      type: 'Migration claim', status: '', title: '#' + str(claim.number) + ' ' + str(claim.name),
      body: str(claim.ref)
    });
  }
  for (const lock of arr(d.locks)) {
    const time = lockStart(lock), expectedEnd = lockEnd(d, lock);
    addRecord({
      key: 'k:' + str(lock.lock), category: 'lock', kind: 'lock', time, lane: lock.owner, session: lock.owner,
      type: 'Lock', status: 'Held', title: str(lock.lock), allLanes: lock.lock === 'main-freeze', expectedEnd,
      body: [str(lock.why), time === null ? 'Start time unknown' : 'Held for ' + dur((n - time) / MIN),
        expectedEnd === null ? 'No expected end' : 'Expected end ' + utcStamp(expectedEnd)].filter(Boolean).join('\n')
    });
  }
  for (const entry of arr(d.timeline)) {
    const time = ts(entry.atUtc);
    const status = time === null ? 'Unscheduled' : time <= n ? 'Overdue' : 'Upcoming';
    addRecord({
      key: countdownKey(entry), category: entry.source === 'lock' ? 'lock-end' : 'action',
      time, lane: entry.slug, session: entry.slug, type: entry.source === 'lock' ? 'Expected lock end' : 'Risky action',
      status, title: entry.source === 'lock' ? 'Expected lock end' : 'Risky action', body: str(entry.text),
      caption: time === null ? '' : (time <= n ? 'Overdue ' : 'In ') + dur((time - n) / MIN)
    });
  }
  for (const reservation of arr(d.reservations)) {
    const time = ts(reservation.since), until = ts(reservation.expiresAt);
    if (until !== null && until < start || time !== null && time > end) continue;
    const mode = reservationMode(reservation.mode);
    const expired = reservation.expired === true || (until !== null && until < n);
    const status = mode + ' · ' + (expired ? 'Expired' : until === null ? 'Expiry unknown' : 'Active');
    addRecord({
      key: 'v:' + str(reservation.id), category: 'reservation', time, until, expired, mode,
      lane: reservation.owner, session: reservation.owner, type: 'Reservation', status, title: str(reservation.pattern),
      body: [str(reservation.why), 'Expires ' + (until === null ? 'at an unknown time' : utcStamp(until))].filter(Boolean).join('\n')
    });
  }
  const occurrences = new Map();
  for (const entry of arr(activity.events)) {
    const time = ts(entry.ts);
    if (!inWindow(time)) continue;
    const type = activityType(entry), detail = str(entry.file || entry.cmd || entry.agentType);
    const identity = eventKey('activity', entry.slug, entry.ts, entry.event, entry.category, detail);
    const occurrence = occurrences.get(identity) || 0;
    occurrences.set(identity, occurrence + 1);
    addRecord({
      key: identity + ':' + occurrence, category: 'activity', kind: entry.event, type, time,
      lane: entry.slug, session: entry.slug, title: type,
      status: type === 'Bash' ? str(entry.category) : '',
      body: detail
    });
  }
  const lanes = laneList(d, asks.filter(ask => inWindow(ask.t)), replies.filter(reply => inWindow(reply.t)));
  const relevantActivity = new Map();
  for (const record of records.values()) {
    if (record.category !== 'activity') continue;
    if (!relevantActivity.has(record.lane)) relevantActivity.set(record.lane, []);
    relevantActivity.get(record.lane).push(record);
  }
  for (const lane of lanes) {
    if (lane.repo) {
      const migrations = obj(d.migrations);
      const freeze = arr(d.locks).find(lock => lock.lock === 'main-freeze');
      const body = [
        'Migration ' + str(migrations.mainMax ?? 'unknown') + ' on main',
        freeze ? 'Main-freeze held by ' + str(freeze.owner) : 'Main open (no freeze)',
        arr(migrations.files).filter(file => file.onMain === false).length + ' migration(s) off main · ' + arr(d.claims).length + ' claim(s)'
      ].join('\n');
      addRecord({ key: 's:repo', category: 'lane', time: null, lane: 'repo', session: 'Repo', type: 'Repo lane', title: 'Main and migrations', status: '', body });
      continue;
    }
    const slug = lane.slug, session = lane.s, hb = obj(session?.hb);
    const activitySummary = obj(obj(activity.sessions)[slug]);
    const events = (relevantActivity.get(slug) || []).sort((a, b) => a.time - b.time);
    const subCount = Number(activitySummary.subagentsRunning) || 0;
    const intervals = subIntervals(events.map(event => ({ e: { event: event.kind }, t: event.time })), subCount, start, Math.min(n, end));
    for (const [from, until] of intervals) {
      addRecord({
        key: eventKey('subagents', slug, from === start ? 'prior' : from), category: 'activity-band', time: from, until,
        lane: slug, session: slug, type: 'Subagents running', title: 'Subagents running', status: '',
        body: 'Until ' + utcStamp(until)
      });
    }
    events.forEach((event, index) => {
      if (event.kind !== 'stop') return;
      const until = events.slice(index + 1).find(next => next.kind !== 'stop')?.time ?? n;
      if (until > event.time) {
        event.until = until;
        event.body = 'Idle for ' + dur((until - event.time) / MIN) + ' · until ' + utcStamp(until);
      }
    });
    const sessionLines = [];
    if (session) {
      sessionLines.push([str(session.state || 'State unknown'), str(session.title)].filter(Boolean).join(' · '));
      sessionLines.push('Status ' + (typeof hb.statusAgeMin === 'number' ? dur(hb.statusAgeMin) + ' old' : 'unknown') +
        ' · last post ' + (typeof hb.lastPostAgeMin === 'number' ? dur(hb.lastPostAgeMin) + ' ago' : 'unknown'));
      sessionLines.push(hbExpected(hb) ? 'Next check ' + utcTime(ts(hb.nextAt)) + ' · heartbeat ' + str(hb.health || 'unknown') : 'No heartbeat expected');
      const untimed = arr(d.timeline).filter(entry => entry.slug === slug && entry.source !== 'lock' && ts(entry.atUtc) === null).length;
      if (untimed) sessionLines.push(untimed + ' risky action(s) without a time');
    } else {
      sessionLines.push((lane.askOnly ? 'Asks only' : 'Posts only') + ' · no status file');
    }
    if (Object.keys(activitySummary).length || events.length) {
      sessionLines.push('Now: ' + str(activitySummary.nowDoing || (activitySummary.idle === true ? 'idle' : 'activity unknown')));
      sessionLines.push(str(activitySummary.edits1h ?? 0) + ' edits / ' + str(activitySummary.bash1h ?? 0) + ' bash in the last hour · ' + subCount + ' subagents running');
    }
    addRecord({ key: 's:' + slug, category: 'lane', time: null, lane: slug, session: slug, type: 'Session lane', title: slug, status: '', body: sessionLines.join('\n') });
    const next = ts(hb.nextAt);
    const minutes = new Set(arr(hb.minutes).filter(minute => Number.isInteger(minute) && minute >= 0 && minute < 60));
    for (let hour = Math.floor(start / HOUR) * HOUR; hour <= end; hour += HOUR) {
      for (const minute of minutes) {
        const time = hour + minute * MIN;
        if (!inWindow(time)) continue;
        addRecord({
          key: eventKey('heartbeat', slug, time), category: 'heartbeat', time, lane: slug, session: slug,
          type: 'Heartbeat', title: 'Scheduled heartbeat check', status: time === next ? 'Next check' : 'Scheduled', body: ''
        });
      }
    }
  }
  for (const merged of arr(obj(d.mergeQueue).merged)) {
    const time = ts(merged.mergedAt);
    if (!inWindow(time)) continue;
    addRecord({
      key: 'm:' + str(merged.number), category: 'merge', time, lane: 'repo', session: merged.owner,
      type: 'Merged PR', status: 'Merged', title: '#' + str(merged.number) + ' ' + str(merged.title),
      body: ['Base ' + str(merged.base || 'unknown'), merged.mergedBy ? 'Merged by ' + str(merged.mergedBy) : ''].filter(Boolean).join(' · '),
      url: mqSafeUrl(merged.url)
    });
  }
  return [...records.values()].sort((a, b) => (a.time ?? Infinity) - (b.time ?? Infinity) || a.key.localeCompare(b.key));
}

const KIND_LABEL = Object.freeze({ status: 'Status post', note: 'Note', lock: 'Lock taken', unlock: 'Lock released', claim: 'Migration claim', hello: 'Hello', ask: 'Ask', reply: 'Reply', alert: 'Alert', done: 'Done' });

  var g = sv('g', null), c = 'var(--text)';

  else if (k === 'note') g.appendChild(sv('rect', { x: x - 3.5, y: y - 3.5, width: 7, height: 7, fill: 'none', stroke: c, 'stroke-width': 1.3, transform: 'rotate(45 ' + x + ' ' + y + ')' }));
  else if (k === 'lock') g.appendChild(sv('path', { d: 'M' + x + ' ' + (y - 5.5) + 'L' + (x + 5) + ' ' + (y + 4) + 'L' + (x - 5) + ' ' + (y + 4) + 'Z', fill: 'var(--danger)' }));
  else if (k === 'unlock') g.appendChild(sv('path', { d: 'M' + x + ' ' + (y - 5.5) + 'L' + (x + 5) + ' ' + (y + 4) + 'L' + (x - 5) + ' ' + (y + 4) + 'Z', fill: 'none', stroke: 'var(--success)', 'stroke-width': 1.5 }));
  else if (k === 'claim') { g.appendChild(sv('rect', { x: x - 4, y: y - 4, width: 8, height: 8, fill: 'var(--info)' })); }
  else if (k === 'hello') g.appendChild(sv('circle', { cx: x, cy: y, r: 4, fill: 'none', stroke: c, 'stroke-width': 1.3 }));
  else if (k === 'ask') g.appendChild(sv('path', { d: 'M' + (x - 4) + ' ' + (y - 5) + 'L' + (x + 6) + ' ' + y + 'L' + (x - 4) + ' ' + (y + 5) + 'Z', fill: 'var(--warning)' }));
  else if (k === 'reply') g.appendChild(sv('path', { d: 'M' + (x + 4) + ' ' + (y - 5) + 'L' + (x - 6) + ' ' + y + 'L' + (x + 4) + ' ' + (y + 5) + 'Z', fill: 'var(--success)' }));
  else { g.appendChild(sv('path', { d: 'M' + (x - 4) + ' ' + (y - 4) + 'L' + (x + 4) + ' ' + (y + 4) + 'M' + (x + 4) + ' ' + (y - 4) + 'L' + (x - 4) + ' ' + (y + 4), stroke: c, 'stroke-width': 1.4 })); }

const TARGET_SIZE = 24, TARGET_SPACING = 28;

  const clusters = [], cells = new Map();
  const cellKey = (x, y) => x + ':' + y;
  for (const { key, x, y } of targets) {
    const col = Math.floor(x / TARGET_SPACING), row = Math.floor(y / TARGET_SPACING);
    let closest = null, distance = Infinity;
    for (let rowOffset = -1; rowOffset <= 1; rowOffset++) {
      for (let colOffset = -1; colOffset <= 1; colOffset++) {
        const nearby = cells.get(cellKey(col + colOffset, row + rowOffset));
        if (!nearby || Math.abs(nearby.x - x) >= TARGET_SPACING || Math.abs(nearby.y - y) >= TARGET_SPACING) continue;
        const delta = Math.hypot(nearby.x - x, nearby.y - y);
        if (delta < distance) { closest = nearby; distance = delta; }

    if (closest) closest.keys.push(key);

      cells.set(cellKey(col, row), cluster);

  state.hidden = !empty && status !== 'stale' && status !== 'error';
  state.setAttribute('data-state', status === 'live' ? 'empty' : status);
  setText(state, status === 'error' ? 'Showing the last available board. ' + boardPoll.error :
    status === 'stale' ? 'Showing a saved board snapshot. New updates may be missing.' : 'No Timeline activity yet.');
  byId('board-content').hidden = false;
  const signature = sigOf(data) + '|' + countOpenAsks(data, n);
  if (signature !== lastSig || first) {
    lastSig = signature;
    knownSessions = new Set(arr(data.sessions).map(session => session.slug));
    identity = identityIndices(arr(data.sessions), identity);
    renderDetail();
  }
  const minute = Math.floor(n / MIN);
  const modelInputs = JSON.stringify([minute, data.sessions, data.timelineAsks, data.log, data.locks, data.reservations,
    data.timeline, data.activity, data.claims, obj(data.mergeQueue).merged, obj(data.migrations).mainMax, obj(data.migrations).files]);
  if (first || modelInputs !== plotSig) {
    plotSig = modelInputs;
    plotAt = n;
    refreshEvents(n);
    renderTimeline(n);
  }
  tick();
}
function pollEndpoint(url, state) {
  if (state.pending) return;
  state.pending = true;
  fetchJson(url, AbortSignal.timeout(8000)).then(value => {
    const valid = state === boardPoll ? Array.isArray(value?.sessions) : Array.isArray(value?.log) && Array.isArray(value?.asks);
    if (!valid) throw new Error('Unexpected server response');
    state.value = value;
    state.error = '';
  }).catch(error => {
    state.error = error?.message || 'Request failed';
  }).finally(() => {
    state.pending = false;
    renderPoll();
  });
}
function poll() {
  syncPaused();
  if (paused) return;
  pollEndpoint('/api/board', boardPoll);
  pollEndpoint('/api/timeline', historyPoll);
}
function tick() {
  if (!paused) setText(document.getElementById('clock'), utcStamp(now()).replace(/\.\d{3} UTC$/, ' UTC'));
}
legendRow();
tick();
byId('pause-updates').hidden = !standalone;
syncPaused();
if (paused) connection(null);
poll();
setInterval(poll, 5000);
setInterval(tick, 1000);

window.addEventListener('storage', event => {
  if (event.key !== PAUSE_KEY && event.key !== null) return;
  syncPaused();
  renderPoll();
  if (!paused) poll();
});
window.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.getAttribute('aria-disabled') === 'true') return;
  if (button.id === 'pause-updates') {
    if (!paused) tick();
    syncPaused(!paused);
    try { window.localStorage.setItem(PAUSE_KEY, paused ? '1' : '0'); } catch { /* Keep the local preference. */ }
    renderPoll();
    if (!paused) poll();
  } else if (button.id === 'retry') {
    poll();
  } else if (button.id === 'close-event') {
    clearEvent();
  } else if (button.id === 'prev-events' || button.id === 'next-events') {
    changeEventPage(button.id === 'prev-events' ? -1 : 1);
  } else if (button.dataset.event) {
    openEvent(button.dataset.event, button);
  } else if (button.dataset.disclosure) {
    const key = button.dataset.disclosure;
    if (expanded.has(key)) expanded.delete(key);
    else expanded.add(key);
    renderDetail();
  }
});
window.addEventListener('keydown', event => {
  if (!event.defaultPrevented && event.key === 'Escape' && (pinned || clusterKeys.length)) {
    event.preventDefault();
    clearEvent();
  }
});
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderTimeline, 120);
});
</script>
