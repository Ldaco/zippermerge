<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippermerge · Timeline</title>
<style>
:root{
  --bg:#e8ecf0; --panel:#f4f6f8; --ink:#1c2631; --ink2:#4a5866; --ink3:#7a8794;
  --hair:#c2cad3; --hair2:#d6dce2;
  --red:#b83227; --amber:#a86a0a; --blue:#2d6a99; --green:#2c7a57;
  --red-t:rgba(184,50,39,.13); --amber-t:rgba(168,106,10,.14); --blue-t:rgba(45,106,153,.10);
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",Calibri,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
body{padding:28px 44px 90px}
.sc{font-variant:small-caps;letter-spacing:.09em;text-transform:lowercase;color:var(--ink3);font-weight:600}
h1{font-size:26px;font-weight:300;letter-spacing:.01em;margin:0}
h2{margin:0 0 10px;font-size:13px}
header{display:flex;align-items:baseline;gap:28px;border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:18px}
header .clock{font-family:var(--mono);font-size:15px;color:var(--ink2)}
header .poll{margin-left:auto;font-size:13px;color:var(--ink3)}
header .poll.bad{color:var(--red);font-weight:600}
#banners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px;margin-bottom:14px}
#banners>*,.grid>*{min-width:0}
.banner{border:1px solid var(--hair);border-left:5px solid var(--blue);background:var(--panel);padding:10px 16px}
.banner.red{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-t),var(--panel) 60%)}
.banner.amber{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-t),var(--panel) 60%)}
.banner .t{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.banner .m{color:var(--ink2);font-size:14px;overflow-wrap:anywhere}
#vitals{display:flex;gap:56px;margin:6px 0 18px;flex-wrap:wrap}
.vital .n{font-size:38px;font-weight:200;line-height:1.1;font-variant-numeric:tabular-nums}
.vital .n.red{color:var(--red)} .vital .n.amber{color:var(--amber)}
.tlwrap{background:var(--panel);border:1px solid var(--hair);padding:6px 0 4px;overflow:hidden}
#legend{display:flex;gap:22px;flex-wrap:wrap;padding:6px 20px 2px;font-size:12.5px;color:var(--ink2);align-items:center}
#legend span{display:inline-flex;gap:6px;align-items:center}
svg text{font-family:var(--sans)}
.mk{cursor:pointer}
.mk:hover .hit,.mk.hl .hit{fill:rgba(45,106,153,.18);stroke:var(--blue)}
.hit{fill:transparent;stroke:transparent}
#inspector{margin:10px 0 26px;border:1px solid var(--hair);background:var(--panel);padding:10px 18px;min-height:64px}
#inspector .k{font-size:12px}
#inspector{overflow-wrap:anywhere;min-width:0}
#inspector .b{white-space:pre-wrap;overflow-wrap:anywhere}
#inspector.pinned{border-color:var(--blue)}
.grid{display:grid;gap:18px;align-items:start}
.sessions{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.panels{grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));margin-top:18px}
.card{background:var(--panel);border:1px solid var(--hair);padding:16px 20px;min-width:0;overflow-wrap:anywhere}
.card.hl,.hl{outline:2px solid var(--blue);outline-offset:-2px;background-color:#e9f1f8}
.card header{border:0;padding:0;margin:0 0 8px;gap:14px;flex-wrap:wrap}
.card .slug{font-size:22px;font-weight:600}
.pill{font-size:12px;padding:0 8px;border:1px solid var(--hair);border-radius:10px;color:var(--ink2);background:#fff}
.pill.red{border-color:var(--red);color:var(--red)} .pill.amber{border-color:var(--amber);color:var(--amber)} .pill.green{border-color:var(--green);color:var(--green)}
.fresh{font-size:13px;color:var(--ink2);border-top:1px solid var(--hair2);border-bottom:1px solid var(--hair2);padding:6px 0;margin-bottom:10px;display:flex;gap:22px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.f{margin:0 0 10px;padding-left:10px;border-left:2px solid var(--hair2)}
.f.locks{border-left-color:var(--red)} .f.asks{border-left-color:var(--amber)} .f.risky{border-left-color:var(--blue)}
.f.none{opacity:.55}
.f .v{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.f ul{margin:2px 0 0;padding-left:18px}
.f li{margin:1px 0;overflow-wrap:anywhere;font-size:14px}
.mono{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--hair);font-variant:small-caps;letter-spacing:.08em;color:var(--ink3);font-weight:600}
td{padding:5px 10px 5px 0;border-bottom:1px solid var(--hair2);vertical-align:top;overflow-wrap:anywhere}
tr.hl td{background:#e9f1f8}
.row{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--hair2);align-items:baseline}
.row .g{flex:0 0 18px;text-align:center}
.row .body{flex:1 1 0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.row .meta{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;flex:0 1 auto;max-width:42%;min-width:0;overflow-wrap:anywhere;text-align:right}
.row a{color:var(--blue);overflow-wrap:anywhere}
.morebtn{margin:6px 0 0;border:1px solid var(--hair);background:#fff;padding:3px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.morebtn:hover{background:#e9f1f8}
.f.prs{border-left-color:var(--blue)}
.tag{font-size:11.5px;padding:0 6px;border:1px solid var(--hair);border-radius:8px;background:#fff;margin-right:4px;color:var(--ink2)}
.red{color:var(--red)} .amber{color:var(--amber)} .blue{color:var(--blue)} .green{color:var(--green)}
.empty{color:var(--ink3);font-style:italic}
.corner{position:fixed;right:14px;bottom:12px;z-index:9;background:rgba(244,246,248,.94);border:1px solid var(--hair);padding:4px 12px;font-size:12px;font-variant:small-caps;letter-spacing:.08em}
.corner a{color:var(--blue);text-decoration:none;margin-left:8px}
#mq{margin:0 0 18px}
#mq .mqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1100px){#mq .mqgrid{grid-template-columns:minmax(0,1fr)}}
#mq .card{padding:12px 16px}
.mqfree{color:var(--green);font-weight:600}
.mqrun{border-left:4px solid var(--red);padding-left:10px}
.mqphase{margin:8px 0 2px;font-size:12px}
.mqrow{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--hair2);align-items:baseline;flex-wrap:wrap}
.mqrow .pos{flex:0 0 22px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.mqrow .mid{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.mqrow a{color:var(--blue)}
.mqrow .blk{display:block;font-size:12.5px;color:var(--ink3);overflow-wrap:anywhere}
.sess{font-size:11.5px;padding:0 6px;border-radius:8px;color:#fff;margin-right:4px}
.spill{font-size:11.5px;padding:0 8px;border:1px solid var(--hair);border-radius:10px;background:#fff;color:var(--ink2)}
.spill.landing{border-color:var(--red);color:var(--red);font-weight:700}
.spill.ready{border-color:var(--green);color:var(--green)}
.spill.ci{border-color:var(--blue);color:var(--blue)}
.spill.needs-work{border-color:var(--amber);color:var(--amber)}
.spill.stacked,.spill.held{color:var(--ink3)}
.mqrider{margin:2px 0 0 30px;font-size:12.5px;color:var(--ink2);width:100%}
@media (max-width:2100px){ body{padding:22px 28px 90px} .sessions{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))} .panels{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))} }
</style>
</head>
<body>
<header>
  <h1>Live Timeline</h1>
  <span class="sc">zippermerge</span>
  <span class="clock" id="clock"></span>
  <span class="poll" id="poll">connecting</span>
</header>
<div id="banners"></div>
<div id="vitals"></div>
<div id="mq"></div>
<div id="legend"></div>
<div class="tlwrap" id="tlwrap"></div>
<div id="inspector"><span class="sc k">inspector</span><div class="b">Hover or click any marker, band, bar or arrow. The matching detail below is highlighted and its full text appears here.</div></div>
<div class="grid sessions" id="sessions"></div>
<div class="grid panels" id="panels"></div>

<script>
'use strict';
var NS = 'http://www.w3.org/2000/svg';
var MIN = 60000, HOUR = 3600000;
var data = null, offset = 0, lastSig = '', pinned = null, hover = null, pollOk = true;

function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, String(attrs[k]));
  add(e, kids);
  return e;
}
function add(e, kids) {
  if (kids === undefined || kids === null) return;
  if (!Array.isArray(kids)) kids = [kids];
  kids.forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { add(e, c); return; } /* nested child lists (e.g. from .map) flatten */
    e.appendChild(c && typeof c === 'object' && typeof c.nodeType === 'number' ? c : document.createTextNode(String(c)));
  });
}
function sv(tag, attrs, text) {
  var e = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, String(attrs[k]));
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function arr(v) { return Array.isArray(v) ? v : []; }
function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
function str(v) { return v === null || v === undefined ? '' : String(v); }
function now() { return Date.now() + offset; }
function ts(v) { var t = Date.parse(str(v)); return isNaN(t) ? null : t; }
function hhmm(t) { var d = new Date(t); return ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
function dur(min) {
  if (min === null || min === undefined || isNaN(min)) return '?';
  var m = Math.round(Math.abs(min));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + ('0' + (m % 60)).slice(-2) + 'm';
}
function isNone(s) { return /^\s*none\b/i.test(str(s)); }
/* heartbeat: only 'late' and 'silent' are bad; 'ok', 'n/a' or missing are not */
function badHealth(hb) { var v = str(obj(hb).health).toLowerCase(); return v === 'late' || v === 'silent'; }
function hbExpected(hb) { return obj(hb).expected !== false; }
/* open asks: answered !== true, deduplicated by from + text (the server keeps one ask object per target) */
function distinctOpenAsks(d) {
  var out = [], seen = {};
  if (Array.isArray(d.asks)) {
    d.asks.map(obj).forEach(function (a) {
      if (a.answered === true || !str(a.from)) return;
      var k = str(a.from) + '|' + str(a.text);
      if (seen[k]) return; seen[k] = true; out.push(a);
    });
    return out;
  }
  buildAsks(d).forEach(function (a) {
    if (a.answered) return;
    var k = str(a.from) + '|' + str(a.body);
    if (seen[k]) return; seen[k] = true; out.push({ from: a.from, to: a.to, text: a.body });
  });
  return out;
}
/* attention rows of kind 'ask' come once per target: keep one per source post + text */
function dedupeAttention(list) {
  var seen = {};
  return list.filter(function (a) {
    if (str(obj(a).kind) !== 'ask') return true;
    var k = str(a.ref) + '|' + str(a.text).replace(/^@\S+\s+unanswered\s+/, '');
    if (seen[k]) return false; seen[k] = true; return true;
  });
}
/* PRs: failing CI first, then drafts, then newest update */
var PR_CAP = 8, expanded = {};
function prCi(p) { return str(obj(p.checks).conclusion).toLowerCase() || 'none'; }
function prFailing(p) { return prCi(p) === 'failure' || Number(obj(p.checks).failure) > 0; }
function prRank(p) { return prFailing(p) ? 0 : (p.draft === true ? 1 : 2); }
function sortPrs(items) {
  return items.slice().sort(function (x, y) { var r = prRank(x) - prRank(y); return r !== 0 ? r : (ts(y.updatedAt) || 0) - (ts(x.updatedAt) || 0); });
}
function ownerPrs(d, slug) { return sortPrs(arr(obj(d.prs).items).map(obj).filter(function (p) { return str(p.owner) === slug; })); }
function prByNumber(d) { var m = {}; arr(obj(d.prs).items).map(obj).forEach(function (p) { m[str(p.number)] = p; }); return m; }
/* show the first PR_CAP items, with a Show all N toggle; expanded state survives re-render */
function addCapped(listEl, toggleParent, key, items, build) {
  var all = !!expanded[key], shown = all ? items : items.slice(0, PR_CAP);
  shown.forEach(function (it) { listEl.appendChild(build(it)); });
  if (items.length > PR_CAP) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'morebtn';
    b.textContent = all ? 'Show fewer' : 'Show all ' + items.length;
    b.addEventListener('click', function () { expanded[key] = !all; renderDetail(); });
    toggleParent.appendChild(b);
  }
}
function prRow(p) {
  var ci = prCi(p), url = str(p.url), safe = url.indexOf('https://github.com/') === 0;
  var title = '#' + str(p.number) + ' ' + str(p.title);
  var ttl = safe ? h('a', { href: url, target: '_blank', rel: 'noopener' }, title) : h('span', null, title);
  var tags = [];
  if (p.draft === true) tags.push(h('span', { 'class': 'tag' }, 'draft'));
  tags.push(h('span', { 'class': 'tag' }, 'CI ' + ci));
  var t = ts(p.updatedAt);
  return h('div', { 'class': 'row' }, [
    h('span', { 'class': 'g ' + (prFailing(p) ? 'red' : p.draft === true ? 'amber' : 'green') }, p.draft === true && !prFailing(p) ? '○' : '●'),
    h('span', { 'class': 'body' }, [ttl, str(p.headRef) ? h('div', { 'class': 'mono' }, str(p.headRef)) : null]),
    h('span', { 'class': 'meta' }, [tags, t !== null ? h('div', null, 'updated ' + dur((now() - t) / MIN) + ' ago') : null])]);
}
function prBlock(slug, prs) {
  var box = h('div', { 'class': 'f prs' }), list = h('div');
  box.appendChild(h('div', { 'class': 'sc' }, 'Open PRs · ' + prs.length));
  box.appendChild(list);
  addCapped(list, box, 'prs:' + slug, prs, prRow);
  return box;
}

/* ---------- merge queue (board.mergeQueue, rendered only) ---------- */
var MQ_SHOWN = 8, mqOpen = {}, MQ_COLORS = ['#2d6a99', '#2c7a57', '#a86a0a', '#6a3fd6', '#b83227', '#12807f', '#8a4b8f', '#5b6b2a'];
function mqSafeUrl(u) { u = str(u); return u.indexOf('https://github.com/') === 0 ? u : ''; }
function mqColor(slug) {
  var s = str(slug), x = 0;
  for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 9973;
  return s ? MQ_COLORS[x % MQ_COLORS.length] : '#7a8794';
}
function mqValid(mq) { return mq && typeof mq === 'object' && !Array.isArray(mq) && (Array.isArray(mq.queue) || Array.isArray(mq.merged)); }
/* [{phase, items}] keeping queue order; null phase becomes '' */
function mqGroups(queue) {
  var out = [], idx = {};
  arr(queue).map(obj).forEach(function (p) {
    var k = str(p.phase);
    if (idx[k] === undefined) { idx[k] = out.length; out.push({ phase: k, items: [] }); }
    out[idx[k]].items.push(p);
  });
  return out;
}
function mqRiders(mq, number) {
  return arr(mq.riding).map(obj).filter(function (r) { return str(r.with) === str(number); });
}
function mqPrLink(p) {
  var u = mqSafeUrl(p.url), t = '#' + str(p.number);
  return u ? h('a', { href: u, target: '_blank', rel: 'noopener' }, t) : h('span', null, t);
}
function mqSess(slug) {
  return h('span', { 'class': 'sess', 'style': 'background:' + mqColor(slug) }, str(slug) || 'unowned');
}
function mqBase(p) { return str(p.base) && str(p.base) !== 'main' ? h('span', { 'class': 'tag' }, 'base ' + str(p.base)) : null; }
function mqRunway(mq, n) {
  var r = obj(mq.runway), box = h('div');
  if (r.held !== true) { box.appendChild(h('div', { 'class': 'mqfree' }, 'main is free')); return box; }
  var t = ts(r.since), run = h('div', { 'class': 'mqrun' });
  run.appendChild(h('div', { 'style': 'font-weight:600' }, [mqSess(r.owner), 'holds main-freeze' + (t !== null ? ' for ' + dur((n - t) / MIN) : '')]));
  var prs = arr(r.prs);
  if (prs.length) {
    var byNum = {}; arr(mq.queue).map(obj).forEach(function (p) { byNum[str(p.number)] = p; });
    var kids = [];
    prs.forEach(function (num) { kids.push(byNum[str(num)] ? mqPrLink(byNum[str(num)]) : h('span', null, '#' + str(num)), ' '); });
    run.appendChild(h('div', { 'class': 'mono' }, kids));
  }
  if (str(r.why)) run.appendChild(h('div', { 'style': 'color:var(--ink2);font-size:14px' }, str(r.why)));
  box.appendChild(run);
  return box;
}
function mqQueueRow(mq, p) {
  var st = str(p.status) || 'held', bl = arr(p.blockers), rid = mqRiders(mq, p.number), open = !!mqOpen['r' + str(p.number)];
  var wrap = h('div');
  var mid = h('span', { 'class': 'mid' }, [mqSess(p.owner), mqPrLink(p), ' ' + str(p.title), ' ', mqBase(p),
    bl.length ? h('span', { 'class': 'blk' }, str(bl[0])) : null]);
  var row = h('div', { 'class': 'mqrow' }, [h('span', { 'class': 'pos' }, str(p.position)), mid, h('span', { 'class': 'spill ' + st }, st)]);
  if (rid.length) {
    var b = h('button', { 'type': 'button', 'class': 'morebtn', 'style': 'margin:0' }, '+' + rid.length + ' riding');
    b.addEventListener('click', function () { mqOpen['r' + str(p.number)] = !open; renderDetail(); });
    mid.appendChild(h('div', null, b));
  }
  wrap.appendChild(row);
  if (rid.length && open) rid.forEach(function (r) {
    wrap.appendChild(h('div', { 'class': 'mqrider' }, ['rides with #' + str(p.number) + ': #' + str(r.number) + ' ' + str(r.title) + ' ', mqSess(r.owner)]));
  });
  return wrap;
}
function mqLandedRow(m) {
  var t = ts(m.mergedAt);
  return h('div', { 'class': 'mqrow' }, [h('span', { 'class': 'mono', 'style': 'flex:0 0 52px' }, t !== null ? hhmm(t) + 'Z' : '--:--'),
    h('span', { 'class': 'mid' }, [mqPrLink(m), ' ' + str(m.title), ' ', mqSess(m.owner), mqBase(m),
      str(m.mergedBy) ? h('span', { 'class': 'blk' }, 'merged by ' + str(m.mergedBy)) : null])]);
}
function mqPanel(mq) {
  var n = now(), box = h('div', { 'class': 'mqgrid' });
  if (!mqValid(mq)) {
    box.appendChild(h('section', { 'class': 'card' }, [h('h2', { 'class': 'sc' }, 'Merge queue'), h('div', { 'class': 'empty' }, 'merge queue loading…')]));
    return box;
  }
  box.appendChild(h('section', { 'class': 'card' }, [h('h2', { 'class': 'sc' }, 'On the runway'), mqRunway(mq, n)]));
  var q = h('section', { 'class': 'card' }, h('h2', { 'class': 'sc' }, 'Landing order · ' + arr(mq.queue).length));
  if (!arr(mq.queue).length) q.appendChild(h('div', { 'class': 'empty' }, 'Nothing queued.'));
  mqGroups(mq.queue).forEach(function (g) {
    if (g.phase) q.appendChild(h('div', { 'class': 'sc mqphase' }, g.phase));
    g.items.forEach(function (p) { q.appendChild(mqQueueRow(mq, p)); });
  });
  box.appendChild(q);
  var merged = arr(mq.merged).map(obj), all = !!mqOpen.all, shown = all ? merged : merged.slice(0, MQ_SHOWN);
  var l = h('section', { 'class': 'card' }, h('h2', { 'class': 'sc' }, 'Landed today (UTC) · ' + merged.length));
  if (!merged.length) l.appendChild(h('div', { 'class': 'empty' }, 'Nothing merged yet today.'));
  shown.forEach(function (m) { l.appendChild(mqLandedRow(m)); });
  if (merged.length > MQ_SHOWN) {
    var b = h('button', { 'type': 'button', 'class': 'morebtn' }, all ? 'Show fewer' : 'Show all ' + merged.length);
    b.addEventListener('click', function () { mqOpen.all = !all; renderDetail(); });
    l.appendChild(b);
  }
  box.appendChild(l);
  return box;
}

/* ---------- derived data ---------- */
function laneList(d) {
  var lanes = [], seen = {};
  arr(d.sessions).forEach(function (s) { if (s && s.slug && !seen[s.slug]) { seen[s.slug] = 1; lanes.push({ slug: s.slug, s: s }); } });
  arr(d.log).forEach(function (l) { if (l && l.slug && !seen[l.slug]) { seen[l.slug] = 1; lanes.push({ slug: l.slug, s: null }); } });
  lanes.push({ slug: 'repo', repo: true });
  return lanes;
}
function mentions(text) {
  var out = [], m, re = /@([a-z0-9_-]+)/gi;
  while ((m = re.exec(str(text)))) { var s = m[1].toLowerCase(); if (out.indexOf(s) < 0) out.push(s); }
  return out;
}
function buildAsks(d) {
  var out = [], seen = {}, logs = arr(d.log), slugs = {};

    arr(hb.minutes).length ? h('span', null, 'check minutes :' + arr(hb.minutes).map(function (m) { return ('0' + m).slice(-2); }).join(' :')) : null,
    (function () { var ls = obj(obj(obj(d.logStats).perSession)[s.slug]); return ls.h24 !== undefined ? h('span', null, 'posts ' + str(ls.h1) + '/1h · ' + str(ls.h24) + '/24h · last kind ' + str(ls.lastKind)) : null; })()
  ]);
  card.appendChild(fr);
  var order = arr(s.order).length ? arr(s.order) : Object.keys(obj(s.fields));
  order.forEach(function (k) { if (obj(s.fields)[k]) card.appendChild(fieldBlock(s, k, d)); });
  Object.keys(obj(s.fields)).forEach(function (k) { if (order.indexOf(k) < 0) card.appendChild(fieldBlock(s, k, d)); });
  var opr = ownerPrs(d, str(s.slug));
  if (opr.length) card.appendChild(prBlock(str(s.slug), opr));
  return card;
}
function panel(title, body, extra) {
  var p = h('section', { 'class': 'card' });
  p.appendChild(h('h2', { 'class': 'sc' }, title));
  add(p, body);
  return p;
}
function renderDetail() {
  var d = data, n = now();
  /* vitals + banners */
  var banners = document.getElementById('banners'); banners.replaceChildren();
  var att = dedupeAttention(arr(d.attention)).slice().sort(function (a, b) { var o = { red: 0, amber: 1, info: 2 }; return (o[a.sev] === undefined ? 3 : o[a.sev]) - (o[b.sev] === undefined ? 3 : o[b.sev]); });
  arr(d.locks).forEach(function (l) {
    var a = lockStart(l), o = lockEnd(d, l);
    var key = 'k:' + str(l.lock);
    banners.appendChild(h('div', { 'class': 'banner ' + (l.lock === 'main-freeze' ? 'red' : 'amber'), 'data-k': key }, [
      h('div', { 'class': 't' }, 'LOCK ' + str(l.lock) + ' held by ' + str(l.owner) + (a ? ' for ' + dur((n - a) / MIN) : '')),
      h('div', { 'class': 'm' }, str(l.why) + (o ? ' · expected end ' + hhmm(o) + 'Z' : ''))]));
  });
  att.forEach(function (a) {
    if (a.kind === 'freeze') return;
    if (a.sev === 'info' && a.kind !== 'ask') return;
    banners.appendChild(h('div', { 'class': 'banner ' + (a.sev === 'info' ? '' : sevCls(a.sev)), 'data-k': a.kind === 'ask' ? 'a:' + str(a.ref) : null }, [
      h('div', { 'class': 't' }, (a.kind === 'ask' ? 'UNANSWERED ASK for ' + str(a.slug) : str(a.kind).toUpperCase() + ' · ' + str(a.slug)) + ' · ' + dur(a.ageMin) + ' ago'),
      h('div', { 'class': 'm' }, str(a.text))]));
  });
  var open = distinctOpenAsks(d).length;
  var stale = arr(d.sessions).filter(function (s) { var hb = obj(s.hb); return badHealth(hb) || (hbExpected(hb) && typeof hb.statusAgeMin === 'number' && hb.statusAgeMin > 30); }).length;
  var upc = arr(d.timeline).filter(function (e) { return e.source !== 'lock' && ts(e.atUtc) && ts(e.atUtc) > n; }).map(function (e) { return ts(e.atUtc) - n; }).sort(function (a, b) { return a - b; })[0];
  var overdue = arr(d.timeline).filter(function (e) { return e.source !== 'lock' && ts(e.atUtc) && ts(e.atUtc) <= n; }).length;
  var vit = document.getElementById('vitals'); vit.replaceChildren();
  function vital(num, label, cls) { vit.appendChild(h('div', { 'class': 'vital' }, [h('div', { 'class': 'n ' + (cls || '') }, num), h('div', { 'class': 'sc' }, label)])); }
  vital(arr(d.locks).length, 'locks held', arr(d.locks).length ? 'red' : '');
  vital(open, 'open asks', open ? 'amber' : '');
  vital(stale, 'stale sessions', stale ? 'red' : '');
  vital(overdue, 'overdue risky actions', overdue ? 'red' : '');
  vital(upc === undefined ? '—' : dur(upc / MIN), 'to next risky action', '');
  vital(typeof d.logTotal === 'number' ? d.logTotal : arr(d.log).length, 'posts on board', '');
  var mq = d.mergeQueue;
  vital(mqValid(mq) ? arr(mq.merged).length : '…', 'landed today (UTC)', mqValid(mq) && arr(mq.merged).length ? 'green' : '');
  try { document.getElementById('mq').replaceChildren(mqPanel(mq)); }
  catch (e) { document.getElementById('mq').replaceChildren(h('div', { 'class': 'empty' }, 'merge queue loading…')); }

  /* sessions */
  var ss = document.getElementById('sessions'); ss.replaceChildren();
  arr(d.sessions).forEach(function (s) { ss.appendChild(sessionCard(s, d)); });

  /* panels */
  var pn = document.getElementById('panels'); pn.replaceChildren();
  /* attention */
  var ab = h('div');
  if (!att.length) ab.appendChild(h('div', { 'class': 'empty' }, 'Nothing needs attention.'));
  att.forEach(function (a) {
    ab.appendChild(h('div', { 'class': 'row', 'data-k': (a.ref ? 'a:' + str(a.ref) + ' ' : '') + (a.kind === 'freeze' ? 'k:' + str(a.ref).replace(/\.md$/, '') : '') }, [
      h('span', { 'class': 'g ' + sevCls(a.sev) }, a.sev === 'red' ? '●' : a.sev === 'amber' ? '▲' : '○'),
      h('span', { 'class': 'body' }, str(a.kind).toUpperCase() + ' · ' + str(a.slug) + ' — ' + str(a.text)),
      h('span', { 'class': 'meta' }, dur(a.ageMin) + ' · ' + str(a.ref))]));
  });
  pn.appendChild(panel('attention', ab));
  /* locks */
  var lb = h('div'); if (!arr(d.locks).length) lb.appendChild(h('div', { 'class': 'empty' }, 'No locks held.'));
  arr(d.locks).forEach(function (l) {
    var a = lockStart(l), o = lockEnd(d, l);
    lb.appendChild(h('div', { 'class': 'row', 'data-k': 'k:' + str(l.lock) }, [h('span', { 'class': 'g red' }, '▲'),
      h('span', { 'class': 'body' }, str(l.lock) + ' · ' + str(l.owner) + ' — ' + str(l.why)),
      h('span', { 'class': 'meta' }, 'since ' + (a ? hhmm(a) + 'Z' : '?') + (o ? ' · ends ' + hhmm(o) + 'Z' : ''))]));
  });
  var tl = arr(d.timeline);
  if (tl.length) {
    lb.appendChild(h('div', { 'class': 'sc', 'style': 'margin-top:12px' }, 'upcoming and unscheduled'));
    tl.forEach(function (e, i) {
      var t = ts(e.atUtc), over = t !== null && t <= n;
      lb.appendChild(h('div', { 'class': 'row', 'data-k': 'r:' + i }, [h('span', { 'class': 'g ' + (over ? 'red' : 'blue') }, over ? '■' : '□'),
        h('span', { 'class': 'body' }, str(e.slug) + ' — ' + str(e.text)),
        h('span', { 'class': 'meta ' + (over ? 'red' : '') }, t === null ? 'no time' : (over ? 'overdue ' + dur((n - t) / MIN) : 'in ' + dur((t - n) / MIN)) + ' · ' + hhmm(t) + 'Z')]));
    });
  }
  pn.appendChild(panel('locks and countdowns', lb));
  /* migrations */
  var mg = obj(d.migrations), mb = h('div');
  mb.appendChild(h('div', { 'class': 'mono' }, 'main max: ' + str(mg.mainMax)));
  if (arr(mg.problems).length) arr(mg.problems).forEach(function (p) { mb.appendChild(h('div', { 'class': 'row' }, [h('span', { 'class': 'g ' + sevCls(p.sev) }, '●'), h('span', { 'class': 'body' }, '#' + str(p.n) + ' ' + str(p.text))])); });
  else mb.appendChild(h('div', { 'class': 'empty' }, 'No migration problems.'));
  if (mg.error) mb.appendChild(h('div', { 'class': 'red' }, 'error: ' + str(mg.error)));
  var mt = h('table', { 'style': 'margin-top:10px' });
  mt.appendChild(h('tr', null, ['n', 'file', 'where', 'on main', 'claim'].map(function (x) { return h('th', null, x); })));
  arr(mg.files).forEach(function (f) {
    mt.appendChild(h('tr', { 'data-k': 'c:' + str(f.n) }, [h('td', { 'class': 'mono' }, str(f.n)), h('td', { 'class': 'mono' }, str(f.name)), h('td', null, arr(f.where).join(', ')), h('td', { 'class': f.onMain ? 'green' : 'amber' }, f.onMain ? 'yes' : 'no'), h('td', null, f.claimOwner ? str(f.claimOwner) : '')]));
  });
  mb.appendChild(mt);
  var cl = arr(d.claims);
  if (cl.length) {
    mb.appendChild(h('div', { 'class': 'sc', 'style': 'margin-top:12px' }, 'claims'));
    cl.forEach(function (c) { mb.appendChild(h('div', { 'class': 'row', 'data-k': 'c:' + str(c.number) }, [h('span', { 'class': 'g blue' }, '■'), h('span', { 'class': 'body' }, '#' + str(c.number) + ' ' + str(c.name) + ' · ' + str(c.owner) + ' — ' + str(c.ref)), h('span', { 'class': 'meta' }, str(c.claimed))])); });
  }
  pn.appendChild(panel('migrations', mb));
  /* hot files */
  var hb2 = h('div'); var ov = arr(d.hotFileOverlaps);
  if (!ov.length) hb2.appendChild(h('div', { 'class': 'empty' }, 'No hot-file overlaps.'));
  ov.forEach(function (o) {
    var blk = h('div', { 'style': 'margin-bottom:12px' }, h('div', { 'class': 'mono amber', 'style': 'font-weight:600' }, str(o.file)));
    arr(o.sessions).forEach(function (s) {
      blk.appendChild(h('div', { 'class': 'row', 'data-k': 's:' + str(s.slug) }, [h('span', { 'class': 'g' }, '·'), h('span', { 'class': 'body' }, str(s.slug) + ': ' + arr(s.lines).join('\n'))]));
    });
    hb2.appendChild(blk);
  });
  pn.appendChild(panel('hot-file overlaps', hb2));
  /* worktrees */
  var wt = obj(d.worktrees), wb = h('div'), items = arr(wt.items);
  if (wt.error) wb.appendChild(h('div', { 'class': 'red' }, 'error: ' + str(wt.error)));
  if (!items.length) wb.appendChild(h('div', { 'class': 'empty' }, 'No worktree data.'));
  else {
    var tb = h('table'); tb.appendChild(h('tr', null, ['worktree', 'branch', 'ahead / behind', 'dirty', 'last commit', 'owner', 'op'].map(function (x) { return h('th', null, x); })));
    items.forEach(function (w) {
      tb.appendChild(h('tr', { 'data-k': w.owner ? 's:' + str(w.owner) : null }, [
        h('td', { 'class': 'mono' }, str(w.name)), h('td', { 'class': 'mono' }, str(w.branch)),
        h('td', null, '+' + str(w.ahead) + ' / −' + str(w.behind)),
        h('td', { 'class': w.dirty ? 'amber' : '' }, w.dirty ? str(w.dirty) + ' files' : 'clean'),

    });

  }
  pn.appendChild(panel('worktrees', wb));
  /* log */
  var gb = h('div'); var lg = arr(d.log);
  if (!lg.length) gb.appendChild(h('div', { 'class': 'empty' }, 'Log is empty.'));
  lg.forEach(function (l) {
    var svgi = sv('svg', { width: 14, height: 14, viewBox: '0 0 14 14' }); svgi.appendChild(glyph(l.kind, 7, 7));
    gb.appendChild(h('div', { 'class': 'row', 'data-k': 'l:' + str(l.name) + (l.kind === 'ask' ? ' a:' + str(l.name) : '') + ' a:' + str(l.name) }, [h('span', { 'class': 'g' }, svgi),
      h('span', { 'class': 'body' }, str(l.slug) + ' · ' + str(l.kind) + (str(l.re) ? ' (reply to ' + str(l.re) + ')' : '') + ' — ' + str(l.body)), h('span', { 'class': 'meta' }, str(l.timestamp))]));
  });
  pn.appendChild(panel('log (newest first)', gb));
  applyHL();
}

/* ---------- loop ---------- */
function sigOf(d) {
  var c = JSON.parse(JSON.stringify(d));
  delete c.now; delete c.caches;
  if (c.migrations) { delete c.migrations.ranAt; delete c.migrations.ageSec; delete c.migrations.mainFetchedAt; }
  if (c.worktrees) { delete c.worktrees.ranAt; delete c.worktrees.ageSec; delete c.worktrees.mainFetchedAt; }
  return JSON.stringify(c);
}
function setPoll(ok, msg) {
  var p = document.getElementById('poll'); p.textContent = msg; p.className = 'poll' + (ok ? '' : ' bad');
}
function poll() {
  fetch('/api/board', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (j) {
    var t = ts(j && j.now); if (t !== null) offset = t - Date.now();
    var first = !data;
    data = obj(j);
    var sig = sigOf(data);
    if (sig !== lastSig || first) {
      lastSig = sig;
      var y = window.scrollY;
      renderDetail(); renderTimeline();
      window.scrollTo(window.scrollX, y);
    }
    setPoll(true, 'live · updated ' + hhmm(now()) + 'Z · polling every 5 s');
  }).catch(function (e) {
    setPoll(false, 'offline: ' + (e && e.message ? e.message : 'fetch failed') + ' · showing last data');
  });
}
function tick() {
  document.getElementById('clock').textContent = new Date(now()).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  if (data) renderTimeline();
}
legendRow();
poll();
setInterval(poll, 5000);
setInterval(tick, 1000);
tick();
var rzT = null;
window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(renderTimeline, 120); });
