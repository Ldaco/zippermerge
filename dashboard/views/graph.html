<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippermerge · Graph</title>
<link rel="stylesheet" href="/dashboard.css">
<style>
/* Graph layout and SVG geometry. Shared dashboard styles provide the controls. */
#main { overflow-wrap: anywhere; }
#main [hidden] { display: none; }
#top { background: var(--surface); border-block-end: 1px solid var(--divider); }
#top, .graph-layout { padding: var(--page-inset); }
#view-title, #inspectorTitle { margin: 0; }
#top .toolbar { justify-content: space-between; }
.toolbar, .actions, .row, .badges, .chips, .spark {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}
#pollstat, #gstat, .meta, .quiet, .empty { color: var(--text-muted); }
#pollstat { margin: 0; }
#chips { margin-block-end: 0; max-block-size: min(42dvh, 24rem); overflow: auto; padding-inline: var(--space-2); }
.feed, .network-rows { list-style: none; padding: 0; }
.feed li, .network-rows > li { border-block-start: 1px solid var(--divider); padding-block: var(--space-2); }
.feed li { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); }
.graph-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); align-items: start; }
#graphPane, #inspector { min-inline-size: 0; }
#graphPane > .toolbar { margin-block-end: var(--space-3); }
#browse, #mapPanel, #inspector { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius-card); }
#browse, #inspector, #mapPanel { padding: var(--space-3); }
#browse h2, #mapPanel h2 { margin-block-start: 0; }
.graph-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: var(--space-2); }
.graph-filters .field { inline-size: 100%; min-inline-size: 0; }
.graph-filters .field-label { margin-block-end: var(--space-1); }
.network-rows .actions { margin-block-start: var(--space-1); }
.network-rows .selected { border-inline-start: 3px solid var(--accent); padding-inline-start: var(--space-2); }
.relation-reason { margin-block: var(--space-1); }
#svg {
  display: block;
  inline-size: 100%;
  block-size: clamp(16rem, 53vh, 47rem);
  background: var(--surface-subtle);
  border: 1px solid var(--divider);
  touch-action: pan-y pinch-zoom;
  cursor: grab;
  user-select: none;
}
#svg.panning { cursor: grabbing; }
#ctrl { margin-block-end: var(--space-2); }
#legend { margin-block-start: var(--space-2); }
#legend h3 { margin-block-end: var(--space-1); }
#legend .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: var(--space-2); }
#legend .it { display: flex; align-items: center; gap: var(--space-2); }
#legend svg { flex: none; overflow: visible; }
.e { fill: none; stroke: var(--control-border); vector-effect: non-scaling-stroke; }
.e.hl { stroke: var(--accent); }
.edge-marker { fill: var(--control-border); }
.node { cursor: pointer; }
.node .body { fill: var(--surface); stroke: var(--text); stroke-width: 2; vector-effect: non-scaling-stroke; }
.node .fold { fill: none; stroke: var(--text); stroke-width: 2; }
.node.t-session .body, .node.t-worktree .body, .node.t-prs .body, .node.t-reservation .body { fill: var(--c); }
.node.t-main .body { fill: var(--surface-selected); }
.node.t-migration .body { fill: var(--info-tint); }
.node.t-ask .body { fill: var(--ask-tint); }
.node.t-lock .body { fill: var(--warning-tint); }
.node.c-red .body, .node.h-red .body, .node.ci-failure .body { stroke: var(--danger); stroke-dasharray: 7 3; }
.node.c-warn .body, .node.h-warn .body, .node.ci-pending .body { stroke: var(--warning); stroke-dasharray: 2 3; }
.node.ci-success .body, .node.merged .body { stroke: var(--success); }
.node.sel .body, .node:hover .body { stroke-width: 4; }
.node.sel .body { stroke: var(--accent); }
.node-ci { transform: scale(calc(1 / var(--map-scale, 1))); pointer-events: none; }
.node-ci circle { fill: var(--surface); stroke: var(--text); }
.node-ci path { fill: none; stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.node-label { pointer-events: none; }
.node-label rect { fill: var(--surface); }
.node-label text {
  fill: var(--text);
  font-family: var(--font-ui);
  font-size: calc(var(--text-xs) / var(--map-scale, 1));
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
#svg.dense .node:not(.sel):not(.c-red):not(.map-anchor) .node-label { display: none; }
.ihead { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-block-end: var(--space-3); }
.sec { margin-block: var(--space-4); min-inline-size: 0; }
.sec :is(h3, h4, h5, h6) { margin: 0 0 var(--space-2); }
.queue h6 { font-size: var(--text-sm); line-height: var(--line-sm); }
.pr-link { text-decoration: underline; }
.sec h3 .n, .sec h3 .note { color: var(--text-muted); font-size: var(--text-xs); font-weight: 400; margin-inline-start: var(--space-2); }
.sec .card { margin-block-end: var(--space-2); }
.card.red, .bad, .late, .mono.red { color: var(--danger); }
.card.amber, .amberText, .warnline, .subh { color: var(--warning); }
.card .txt, .fld .v, .log .lb, .reply, .evx { white-space: pre-wrap; }
button.sess { border-inline-start: 4px solid var(--c); }
.sess-card { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius-card); margin-block-end: var(--space-2); }
.sess-card > .hd { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); border-inline-start: 4px solid var(--c); }
.sess-card > .hd .nm { font-weight: 650; }
.sess-card > .hd, .sess-card .hb, .fld { padding: var(--space-2) var(--space-3); }
.sess-card .hb, .fld { border-block-start: 1px solid var(--divider); }
.fld .k, .fld.none .v { color: var(--text-muted); }
.fld ul, .queue { padding-inline-start: var(--space-5); }
.kv { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: var(--space-1) var(--space-2); margin-block: 0 var(--space-2); }
.kv dt, .conn .kind, .evt { color: var(--text-muted); }
.kv dd { margin: 0; white-space: pre-wrap; }
.conn, .cffiles, .prlist { display: grid; gap: var(--space-2); }
.conn { padding-inline-start: var(--space-5); }
.log, .ev { padding: var(--space-2); border-block-end: 1px solid var(--divider); }
.lh, .ev, .cfpair { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.logbox, .sugg, .reply { background: var(--surface-subtle); padding: var(--space-2); }
.ev .evx { flex: 1 1 12rem; }
.spark svg { max-inline-size: 100%; background: var(--surface-subtle); }
.graph-disclosure { margin-block: var(--space-2); }
.graph-disclosure > summary { min-block-size: var(--control-size); padding: var(--space-2); cursor: pointer; }
.wt { inline-size: 100%; table-layout: fixed; }
#inspector .tbl :is(th, td) { overflow-wrap: anywhere; padding-inline: var(--space-1); }
.queue li::marker { color: var(--text-secondary); font-weight: 650; }
#queueSummary, #mapSummary { margin-block: var(--space-2); }
@media (max-width: 40rem) {
  #svg { margin-inline: calc(-1 * var(--space-3)); inline-size: calc(100% + 2 * var(--space-3)); }
}
@media (min-width: 64rem) {
  .graph-layout { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  #inspector { max-block-size: max(25rem, calc(100dvh - 10rem)); overflow: auto; }
}
@media (forced-colors: active) {
  #browse, #mapPanel, #inspector, #svg { border-color: CanvasText; }
  #svg, .spark svg { background-color: Canvas; forced-color-adjust: none; }
  #main .graph-mode[aria-pressed="true"] {
    forced-color-adjust: none;
    background-color: Highlight;
    color: HighlightText;
    border-color: Highlight;
  }
  .e, #main .node .body, .node .fold { stroke: CanvasText; }
  .edge-marker, .node-label text { fill: CanvasText; }
  #main .node .body, .node-label rect { fill: Canvas; }
  .e.hl, #main .node.sel .body { stroke: Highlight; }
  .network-rows .selected, button.sess, .sess-card > .hd { border-inline-start-color: Highlight; }
  .node-ci circle { fill: Canvas; stroke: CanvasText; }
  .node-ci path { stroke: CanvasText; }
  .spark svg rect { fill: CanvasText; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<main id="main" aria-labelledby="view-title" tabindex="-1">
  <header id="top">
    <div class="toolbar">
      <h1 id="view-title" tabindex="-1">Agent network</h1>
      <p id="pollstat">Connecting to the board…</p>
      <div class="actions">
        <button class="btn" id="pauseUpdates" type="button" aria-pressed="false" hidden>Pause live updates</button>
        <button class="btn" id="retry" type="button" hidden>Retry now</button>
        <button class="btn" id="chipTog" type="button" aria-expanded="false" aria-controls="chips">Alerts</button>
        <button class="btn" id="queueJump" type="button">Merge queue</button>
      </div>
    </div>
    <ul class="feed focus-inset" id="chips" role="list" aria-label="Alerts" tabindex="0" hidden></ul>
    <div class="actions" id="alertPages" hidden>
      <button class="btn" type="button" id="alertPrev">Previous alerts</button>
      <button class="btn" type="button" id="alertNext">Next alerts</button>
    </div>
    <p class="sr-only" id="graphAnnouncements" role="status" aria-atomic="true"></p>
    <p class="sr-only" id="graphErrors" role="alert" aria-atomic="true"></p>
  </header>
  <div class="graph-layout">
    <div id="graphPane">
      <div class="toolbar" role="group" aria-label="Graph view">
        <button class="btn graph-mode" id="modeMap" type="button" aria-pressed="true" aria-controls="mapPanel">Map</button>
        <button class="btn graph-mode" id="modeList" type="button" aria-pressed="false" aria-controls="browse">List</button>
      </div>
      <p class="state" id="graphEmpty" data-state="empty" hidden>No agent sessions yet. Sessions appear after they post a status.</p>
      <section id="browse" aria-labelledby="browseTitle" hidden>
        <h2 id="browseTitle" tabindex="-1">Browse graph</h2>
        <div class="graph-filters">
          <div>
            <label for="networkSearch" class="field-label">Find a node</label>
            <input id="networkSearch" class="field" type="search">
          </div>
          <div>
            <label for="networkType" class="field-label">Node type</label>
            <select id="networkType" class="field"><option value="">All types</option></select>
          </div>
        </div>
        <p id="networkCount"></p>
        <button class="btn" id="clearFilters" type="button" hidden>Clear filters</button>
        <ul class="network-rows" id="networkRows" role="list" aria-label="Graph nodes"></ul>
        <div class="actions" id="networkPages">
          <button class="btn" id="networkPrev" type="button">Previous nodes</button>
          <button class="btn" id="networkNext" type="button">Next nodes</button>
        </div>
        <details class="graph-disclosure">
          <summary>Relationships</summary>
          <p id="relationCount"></p>
          <ul class="network-rows" id="relationRows" role="list" aria-label="Graph relationships"></ul>
          <div class="actions" id="relationPages">
            <button class="btn" id="relationPrev" type="button">Previous relationships</button>
            <button class="btn" id="relationNext" type="button">Next relationships</button>
          </div>
        </details>
      </section>
      <section id="mapPanel" aria-labelledby="mapTitle">
        <h2 id="mapTitle">Dependency map</h2>
        <div id="ctrl" class="toolbar" role="group" aria-label="Map controls">
          <button class="btn" id="bZoomOut" type="button">Zoom out</button>
          <button class="btn" id="bZoomIn" type="button">Zoom in</button>
          <button class="btn" id="bFit" type="button">Fit graph</button>
          <button class="btn" id="bHeat" type="button">Re-layout</button>
          <button class="btn" type="button" data-pan="-80,0">Pan left</button>
          <button class="btn" type="button" data-pan="80,0">Pan right</button>
          <button class="btn" type="button" data-pan="0,-80">Pan up</button>
          <button class="btn" type="button" data-pan="0,80">Pan down</button>
        </div>
        <p id="mapSummary">Use List to browse nodes and their relationships.</p>
        <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapImageTitle" aria-describedby="mapSummary">
          <title id="mapImageTitle">Dependencies between agents and their work</title>
        </svg>
        <p id="gstat"></p>
        <div id="legend">
          <button class="btn" id="legendToggle" type="button" aria-expanded="false" aria-controls="legendBody">Legend</button>
          <div id="legendBody" hidden></div>
        </div>
      </section>
    </div>
    <aside id="inspector" class="print-scroll" aria-labelledby="inspectorTitle">
      <div class="ihead">
        <h2 id="inspectorTitle" tabindex="-1">Overview</h2>
        <button class="btn" id="backToGraph" type="button" hidden>Back to graph</button>
        <button class="btn" id="overview" type="button" hidden>Clear selection</button>
      </div>
      <div id="inspectorBody"></div>
    </aside>
  </div>
</main>

<script>
'use strict';
(function () {
  var SVGNS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (tag === 'button') { e.type = 'button'; e.classList.add('btn'); }
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function sv(tag, attrs, cls) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (cls) e.setAttribute('class', cls);
    return e;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return (x === null || x === undefined) ? '' : String(x); }
  function obj(x) { return (x && typeof x === 'object' && !Array.isArray(x)) ? x : {}; }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  function isNone(t) { return /^none\b/i.test(str(t).trim()) || !str(t).trim(); }
  function askId(a, i) { return 'a:' + (str(a.id) || (str(a.from) + ':' + i)); }
  function safeUrl(value) {
    try {
      const url = new URL(value);
      if (url.origin === 'https://github.com' && !url.username && !url.password) return url.href;
    } catch { /* Ignore malformed or missing links. */ }
    return '';
  }
  function baseName(full) { return str(full).split(/[\/\\]/).filter(Boolean).pop() || ''; }
  function clip(s, n) { s = str(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  /* display-only glob matching: * stays inside a path segment, ** crosses segments */
  function globToRe(pat) {
    var p = str(pat).replace(/\\/g, '/'), out = '', i = 0;
    while (i < p.length) {
      var c = p.charAt(i);
      if (c === '*') {
        if (p.charAt(i + 1) === '*') {
          if (p.charAt(i + 2) === '/') { out += '(?:.*/)?'; i += 3; } else { out += '.*'; i += 2; }
        } else { out += '[^/]*'; i += 1; }
      } else if (c === '?') { out += '[^/]'; i += 1; }
      else { out += c.replace(/[.+^${}()|[\]\\]/g, '\\$&'); i += 1; }
    }
    try { return new RegExp('(?:^|/)' + out + '$', 'i'); } catch (e) { return null; }
  }

  /* ---------- colours and time ---------- */
  /* GRAPH-IDENTITY-BEGIN */
  // D-13 identity allocation. Hash UTF-16 code units from zero with
  // (hash * 31 + codeUnit) >>> 0, then reduce modulo eight.
  // Take the first six unique slugs in board order, then sort them. Keep the
  // previous slots of sessions still in those six before probing for new ones.
  // Advance by one modulo eight on collision. Other known slugs use their
  // base hash. Map zero-based indices to --identity-1 through --identity-8,
  // and use --identity-fallback for a missing or unknown session.
  const IDENTITY_SLOT_COUNT = 8;
  const ATC_SECTOR_LIMIT = 6;

  function sessionColorIndex(slug) {
    let hash = 0;
    for (let i = 0; i < slug.length; i++) hash = (hash * 31 + slug.charCodeAt(i)) >>> 0;
    return hash % IDENTITY_SLOT_COUNT;
  }

  function identityIndices(sessions, previous = new Map()) {
    // Match ATC's six visible sectors and reserve colors for sessions that stayed visible.
    const slugs = [...new Set(sessions.map(session => str(session.slug)).filter(Boolean))].slice(0, ATC_SECTOR_LIMIT).sort();
    const indices = new Map();
    const used = new Set();
    for (const slug of slugs) {
      if (!previous.has(slug)) continue;
      const index = previous.get(slug);
      indices.set(slug, index);
      used.add(index);
    }
    for (const slug of slugs) {
      if (indices.has(slug)) continue;
      let index = sessionColorIndex(slug);
      while (used.has(index)) index = (index + 1) % IDENTITY_SLOT_COUNT;
      indices.set(slug, index);
      used.add(index);
    }
    return indices;
  }

  function slugColor(slug, indices) {
    if (!slug) return 'var(--identity-fallback)';
    const index = indices?.get(slug) ?? sessionColorIndex(slug);
    return 'var(--identity-' + (index + 1) + ')';
  }

  /* GRAPH-IDENTITY-END */

  function displayColor(slug) {
    const model = G.model;
    return model?.nodes.has('s:' + slug) ? slugColor(slug, model.identity) : 'var(--identity-fallback)';
  }

  var skew = 0;
  function nowMs() { return Date.now() + skew; }
  function fmtDur(min) {
    min = Math.round(Number(min));
    if (!isFinite(min)) return '?';
    if (min < 60) return min + 'm';
    return Math.floor(min / 60) + 'h ' + String(min % 60).padStart(2, '0') + 'm';
  }
  function fmtSec(ms) {
    var sec = Math.floor(Math.abs(ms) / 1000);
    var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
    var out = '';
    if (hh) out += hh + 'h ';
    if (hh || mm) out += (hh ? String(mm).padStart(2, '0') : mm) + 'm ';
    return out + String(ss).padStart(2, '0') + 's';
  }
  function parseT(x) {
    if (x === null || x === undefined || x === '') return null;
    if (/^\d{9,11}$/.test(str(x))) return Number(x) * 1000;
    var t = Date.parse(str(x));
    return isFinite(t) ? t : null;
  }

  const clocks = new WeakMap();
  function liveSpan(cls, t, mode) {
    var el = h('span', cls, '');
    const clock = { el, t, mode };
    el.dataset.graphClock = '';
    clocks.set(el, clock);
    updLive(clock);
    return el;
  }
  function updLive(o) {
    var d = o.t - nowMs();
    if (o.mode === 'chk') {
      o.el.textContent = d >= 0 ? 'next check in ' + fmtSec(d) : 'check overdue ' + fmtSec(d);
      if (d < 0) o.el.classList.add('late'); else o.el.classList.remove('late');
    } else if (o.mode === 'until') {
      o.el.textContent = d >= 0 ? 'in ' + fmtSec(d) : 'overdue ' + fmtSec(d);
      if (d < 0) o.el.classList.add('late'); else o.el.classList.remove('late');
    } else {
      o.el.textContent = 'held ' + fmtSec(-d);
    }
  }

  /* ---------- model ---------- */
  var NEG = /\b(not touch|will not|won't|never|avoid|stay out|do not|don't)\b/i;
  var PRRE = /#(\d{3,5})\b/g;

  function fieldList(ss) {
    var f = obj(ss.fields);
    var keys = arr(ss.order).map(str);
    Object.keys(f).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    return keys.map(function (k) {
      var fv = obj(f[k]);
      var items = arr(fv.items).map(str).filter(function (x) { return x.trim(); });
      return { key: k, value: str(fv.value).trim(), items: items };
    });
  }
  function fieldTexts(fl) {
    var t = [];
    if (fl.value) t.push(fl.value);
    fl.items.forEach(function (i) { t.push(i.trim()); });
    return t;
  }
  function fileTokens(text) {
    var out = [];
    text.split(/\s+/).forEach(function (raw) {
      var tok = raw.replace(/^[(\[`'"]+/, '').replace(/[)\],;:`'".]+$/, '');
      if (!tok || tok.indexOf('->') >= 0 || /^https?:/i.test(tok) || tok.indexOf('=') >= 0) return;
      if (!(/[\/\\]/.test(tok) || /\.[A-Za-z]{1,5}$/.test(tok))) return;
      var segs = tok.split(/[\/\\]/).filter(Boolean);
      var base = segs.pop() || '';
      if (/^\*+$/.test(base) && segs.length) base = segs.pop() + '/**';
      if (base.length < 2 || !/[A-Za-z0-9]/.test(base)) return;
      if (out.indexOf(base) < 0) out.push(base);
    });
    return out;
  }

  function buildModel(b, previousIdentity) {
    var nodes = new Map(), pending = [];
    var sessions = arr(b.sessions).map(obj).filter(function (x) { return str(x.slug); });
    var slugs = sessions.map(function (x) { return str(x.slug); });
    const knownSlugs = new Set(slugs);
    const identity = identityIndices(sessions, previousIdentity);
    const colorFor = slug => slugColor(knownSlugs.has(slug) ? slug : '', identity);
    var prByNum = Object.create(null);
    arr(obj(b.prs).items).map(obj).forEach(function (p) { prByNum[str(p.number)] = p; });
    var useAsks = Array.isArray(b.asks);
    var ACT = obj(b.activity), actS = obj(ACT.sessions);

    function node(id, type, label, extra) {
      var n = nodes.get(id);
      if (!n) {
        n = { id: id, type: type, label: label, sub: '', conflict: '', why: [], data: {}, color: null, merged: false, mentions: [], flavor: '' };
        nodes.set(id, n);
      }
      if (extra) Object.keys(extra).forEach(function (k) { n[k] = extra[k]; });
      return n;
    }
    function edge(a, c, kind, note) { pending.push({ a: a, b: c, kind: kind, note: note || '' }); }
    function flag(n, level, why) {
      if (level === 'red') n.conflict = 'red'; else if (!n.conflict) n.conflict = 'warn';
      if (why) n.why.push(why);
    }

    node('main', 'main', 'main', { sub: '', color: 'var(--neutral)' });

    /* sessions */
    sessions.forEach(function (ss) {
      var sl = str(ss.slug), hb = obj(ss.hb);

    conflict: { label: 'Conflicts with', width: 3, marker: 'cross' },
    editing: { label: 'Editing', dash: '6 2', width: 2, marker: 'square' },
    liveEditing: { label: 'Editing concurrently', dash: '6 2', width: 3, marker: 'cross' },
    covers: { label: 'Covers', dash: '4 2 1 2', marker: 'square' },
  };
  function edgeType(edge) {
    return EDGE_TYPES[edge.kind === 'editing' && edge.hot ? 'liveEditing' : edge.kind];
  }
  const PAGE_SIZE = 50;
  const MAP_LIMIT = 48;
  const MAP_EDGE_LIMIT = 120;
  function pageItems(items, page) {
    return items.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
  }
  function mapModel(model, selected) {
    const nodes = new Map();
    function include(id) {
      if (nodes.size < MAP_LIMIT && model.nodes.has(id)) nodes.set(id, model.nodes.get(id));
    }
    include('main');
    include(selected);
    for (const edge of model.edges.values()) {
      if (edge.a === selected) include(edge.b);
      if (edge.b === selected) include(edge.a);
    }
    for (const node of model.nodes.values()) if (node.conflict === 'red') include(node.id);
    for (const node of model.nodes.values()) {
      if (nodes.size >= MAP_LIMIT) break;
      include(node.id);
    }
    const edges = new Map();
    for (const [key, edge] of model.edges) {
      if (edges.size >= MAP_EDGE_LIMIT) break;
      if (nodes.has(edge.a) && nodes.has(edge.b)) edges.set(key, edge);
    }
    return { nodes, edges };
  }

  let nodePage = 0;
  let relationPage = 0;
  const modePreferences = obj(lsGet('ac04.mode'));
  const narrow = matchMedia('(max-width: 56rem)');
  function preferredMode() {
    return narrow.matches ? (modePreferences.narrow || 'list') : (modePreferences.wide || 'map');
  }
  function setMode(next, explicit = false) {
    const list = next === 'list';
    if (explicit) {
      modePreferences[narrow.matches ? 'narrow' : 'wide'] = next;
      lsSet('ac04.mode', modePreferences);
    }
    $('browse').hidden = !list;
    $('mapPanel').hidden = list;
    $('modeList').setAttribute('aria-pressed', String(list));
    $('modeMap').setAttribute('aria-pressed', String(!list));
    if (list) renderNetworkList();
    else if (G.model) {
      reconcile(mapModel(G.model, G.selected));
      if (G.autoFit) fitView();
    }
  }

  function nodeLabel(node) {
    if (node.type === 'reservation') return str(obj(node.data).pattern) || node.label;
    if (node.type === 'ask') return 'Ask by ' + (str(obj(node.data).slug) || node.label);
    return node.label;
  }

  function inspectButton(id, text, key = id) {
    const button = h('button', null, text);
    button.dataset.key = 'inspect:' + key;
    button.onclick = event => select(id, event.currentTarget);
    return button;
  }

  function relationRow(edge, model) {
    const source = nodeLabel(model.nodes.get(edge.a));
    const target = nodeLabel(model.nodes.get(edge.b));
    const row = h('li');
    row.dataset.key = edge.key;
    row.append(h('strong', null, source + ' → ' + edgeType(edge).label.toLowerCase() + ' → ' + target));
    if (edge.note) row.append(h('p', 'relation-reason', edge.note));
    const actions = h('div', 'actions');
    actions.append(inspectButton(edge.a, 'Open source ' + source, 'source:' + edge.a),
      inspectButton(edge.b, 'Open target ' + target, 'target:' + edge.b));
    row.append(actions);
    return row;
  }

  function updatePages(prefix, items, page, label) {
    const total = items.length;
    const start = page * PAGE_SIZE;
    const count = total ? (start + 1) + '–' + Math.min(start + PAGE_SIZE, total) + ' of ' + total + ' ' + label
      : 'No ' + label + ' match.';
    setText($(prefix + 'Count'), count);
    const active = document.activeElement;
    const controls = $(prefix + 'Pages');
    controls.hidden = total <= PAGE_SIZE && !controls.contains(active);
    $(prefix + 'Prev').setAttribute('aria-disabled', String(page === 0));
    $(prefix + 'Next').setAttribute('aria-disabled', String(start + PAGE_SIZE >= total));
  }

  function renderNetworkList(announceResults = false) {
    if (!G.model || $('browse').hidden) return;
    const model = G.model;
    const query = $('networkSearch').value.trim().toLowerCase();
    const type = $('networkType').value;
    const nodes = [...model.nodes.values()].filter(node => {
      if (type && type !== node.type) return false;
      return [nodeLabel(node), node.type, node.sub, node.prTitle, node.state].some(value => str(value).toLowerCase().includes(query));
    });
    const matches = new Set(nodes.map(node => node.id));
    const edges = [...model.edges.values()].filter(edge => matches.has(edge.a) || matches.has(edge.b));
    nodePage = Math.min(nodePage, Math.max(0, Math.ceil(nodes.length / PAGE_SIZE) - 1));
    relationPage = Math.min(relationPage, Math.max(0, Math.ceil(edges.length / PAGE_SIZE) - 1));
    const rows = document.createDocumentFragment();
    for (const node of pageItems(nodes, nodePage)) {
      const label = nodeLabel(node);
      const row = h('li', G.selected === node.id ? 'selected' : '');
      row.dataset.key = node.id;
      row.append(h('strong', null, label), h('div', 'meta', NODE_TYPES[node.type]));
      const state = h('div', 'badges');
      if (node.type === 'pr') state.append(ciBadge(node.ci, obj(node.pr).checks));
      if (node.state) state.append(sessionStateChip(node.state));
      if (node.health) state.append(statusChip(node.health === 'red' ? 'danger' : 'warning', node.healthText));
      if (node.conflict) state.append(statusChip(node.conflict === 'red' ? 'danger' : 'warning',
        node.conflict === 'red' ? 'Urgent' : 'Warning'));
      if (state.childNodes.length) row.append(state);
      const actions = h('div', 'actions');
      const open = inspectButton(node.id, 'Open ' + label);
      if (G.selected === node.id) open.setAttribute('aria-current', 'true');
      actions.append(open);
      const center = h('button', null, 'Center ' + label + ' on map');
      center.dataset.key = 'center:' + node.id;
      center.onclick = event => {
        select(node.id, event.currentTarget, false);
        setMode('map', true);
        centerNode(node.id);
        $('bFit').focus();
      };
      actions.append(center);
      row.append(actions);
      rows.append(row);
    }
    patchChildren($('networkRows'), rows, $('browseTitle'));
    const relations = document.createDocumentFragment();
    for (const edge of pageItems(edges, relationPage)) relations.append(relationRow(edge, model));
    patchChildren($('relationRows'), relations, $('relationRows').closest('details').querySelector('summary'));
    $('clearFilters').hidden = !query && !type;
    updatePages('network', nodes, nodePage, 'nodes');
    updatePages('relation', edges, relationPage, 'relationships');
    if (announceResults) announce($('networkCount').textContent + '. ' + $('relationCount').textContent);
  }

  function initBrowse() {
    Object.entries(NODE_TYPES).forEach(([type, label]) => {
      const option = h('option', null, label);
      option.value = type;
      $('networkType').append(option);
    });
    function filter() {
      nodePage = relationPage = 0;
      renderNetworkList(true);
    }
    $('networkSearch').addEventListener('input', filter);
    $('networkType').addEventListener('change', filter);
    $('clearFilters').onclick = () => {
      $('networkSearch').value = '';
      $('networkType').value = '';
      $('networkSearch').focus();
      filter();
    };
    for (const [prefix, change] of [
      ['network', step => { nodePage += step; }],
      ['relation', step => { relationPage += step; }],
    ]) {
      for (const [suffix, step] of [['Prev', -1], ['Next', 1]]) {
        const button = $(prefix + suffix);
        button.onclick = () => {
          if (button.getAttribute('aria-disabled') === 'true') return;
          change(step);
          renderNetworkList(true);
        };
      }
    }
    $('modeMap').onclick = () => setMode('map', true);
    $('modeList').onclick = () => setMode('list', true);
    narrow.addEventListener('change', () => {
      const next = preferredMode();
      const active = document.activeElement;
      const oldPanel = next === 'list' ? $('mapPanel') : $('browse');
      setMode(next);
      if (oldPanel.contains(active)) $(next === 'list' ? 'modeList' : 'modeMap').focus();
    });
    setMode(preferredMode());
  }

  function browseType(type) {
    $('networkType').value = type;
    $('networkSearch').value = '';
    nodePage = relationPage = 0;
    setMode('list', true);
    $('browseTitle').focus();
  }

  /* ---------- graph state ---------- */
  const svg = $('svg');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const G = {
    model: null, selected: null, nodes: new Map(), edges: new Map(),
    nArr: [], eArr: [], alpha: 0, frame: 0,
    view: lsGet('ac04.view'), pos: lsGet('ac04.pos') || Object.create(null),
    autoFit: true, saveT: 0, centerAfterLayout: null,
  };
  const MARKERS = {
    arrow: 'M1 1 L9 5 L1 9 Z',
    dot: 'M5 2 a3 3 0 1 0 0 6 a3 3 0 1 0 0 -6',
    cross: 'M1 2 L2 1 L5 4 L8 1 L9 2 L6 5 L9 8 L8 9 L5 6 L2 9 L1 8 L4 5 Z',
    diamond: 'M5 0 L10 5 L5 10 L0 5 Z',
    lock: 'M1 4 H2 V3 A3 3 0 0 1 8 3 V4 H9 V9 H1 Z M4 4 H6 V3 A1 1 0 0 0 4 3 Z',
    bubble: 'M0 1 H10 V7 H5 L2 10 V7 H0 Z',
    square: 'M1 1 H9 V9 H1 Z',
  };
  let viewport, edgeLayer, nodeLayer;

  function initSvg() {
    const defs = sv('defs');
    for (const [name, path] of Object.entries(MARKERS)) {
      const marker = sv('marker', {
        id: 'edge-' + name, viewBox: '0 0 10 10', refX: '9', refY: '5',
        markerWidth: '10', markerHeight: '10', orient: 'auto', markerUnits: 'userSpaceOnUse',
      });
      marker.append(sv('path', { d: path, 'fill-rule': 'evenodd' }, 'edge-marker'));
      defs.append(marker);
    }
    viewport = sv('g');
    edgeLayer = sv('g');
    nodeLayer = sv('g');
    viewport.append(edgeLayer, nodeLayer);
    svg.append(defs, viewport);
    const v = G.view;
    if (!v || !Number.isFinite(v.k) || v.k <= 0 || !Number.isFinite(v.x) || !Number.isFinite(v.y)) G.view = null;
    G.autoFit = !G.view;
    applyView();
  }

  function paneSize() {
    const { width, height } = svg.getBoundingClientRect();
    return { width, height };
  }

  function updateLabelPlates() {
    if ($('mapPanel').hidden) return;
    const bounds = G.nArr.map(node => node.label.getBBox());
    for (const [index, node] of G.nArr.entries()) {
      const box = bounds[index];
      node.plate.setAttribute('x', box.x - 3);
      node.plate.setAttribute('y', box.y - 1);
      node.plate.setAttribute('width', box.width + 6);
      node.plate.setAttribute('height', box.height + 2);
    }
  }

  function applyView() {
    const v = G.view || { x: 0, y: 0, k: 1 };
    viewport.setAttribute('transform', 'translate(' + v.x + ',' + v.y + ') scale(' + v.k + ')');
    svg.classList.toggle('dense', v.k < 0.58 || G.nArr.length > 26);
    svg.style.setProperty('--map-scale', v.k);
    updateLabelPlates();
  }

  var DIM = {
    session: { r: 50, b: 60 }, main: { r: 58, b: 56 }, worktree: { r: 24, b: 13 }, file: { r: 18, b: 16 },
    migration: { r: 22, b: 22 }, lock: { r: 22, b: 22 }, pr: { r: 27, b: 11 }, prs: { r: 36, b: 14 }, ask: { r: 22, b: 18 }, reservation: { r: 36, b: 14 }
  };
  var CHARGE = { session: 3.2, main: 3, worktree: 1, file: 1, migration: 1, lock: 1.2, pr: 0.9, prs: 1.4, ask: 0.9, reservation: 1 };
  var REST = { editing: [120, 0.18], covers: [120, 0.08], owns: [118, 0.2], touches: [150, 0.14], avoids: [280, 0.008], claims: [125, 0.2], holds: [105, 0.2], freezes: [150, 0.2], refs: [135, 0.1], mentions: [360, 0.004], asks: [300, 0.006], asksDone: [260, 0.006], conflict: [240, 0.012] };
  function shapeEl(type) {
    switch (type) {
      case 'session': return sv('circle', { r: 50 });
      case 'main': return sv('rect', { x: -58, y: -50, width: 116, height: 100, rx: 26 });
      case 'worktree': return sv('rect', { x: -24, y: -13, width: 48, height: 26, rx: 8 });
      case 'file': return sv('path', { d: 'M-13,-17 L4,-17 L13,-8 L13,17 L-13,17 Z' });
      case 'migration': return sv('polygon', { points: '0,-23 23,0 0,23 -23,0' });
      case 'lock': return sv('polygon', { points: '-9,-22 9,-22 22,-9 22,9 9,22 -9,22 -22,9 -22,-9' });
      case 'pr': return sv('rect', { x: -27, y: -11, width: 54, height: 22, rx: 11 });
      case 'prs': return sv('rect', { x: -34, y: -12, width: 68, height: 24, rx: 12 });
      case 'ask': return sv('polygon', { points: '-20,-14 20,-14 20,10 -2,10 -12,19 -12,10 -20,10' });
      case 'reservation': return sv('rect', { x: -36, y: -14, width: 72, height: 28, rx: 10 });
      default: return sv('circle', { r: 16 });
    }
  }



  function createNode(spec) {
    const g = sv('g', { 'data-id': spec.id }, 'node');
    const d = DIM[spec.type] || DIM.file;
    const body = shapeEl(spec.type);
    body.setAttribute('class', 'body');
    const group = sv('g', null, 'node-label');
    const plate = sv('rect', { rx: '2' });
    const label = sv('text', { y: d.b + 18 });
    const title = sv('title');
    const ci = spec.type === 'pr' ? makeCiMark() : null;
    group.append(plate, label);
    g.append(title, body);
    if (ci) g.append(ci.group);
    g.append(group);
    if (spec.type === 'file') g.append(sv('path', { d: 'M4,-17 L4,-8 L13,-8' }, 'fold'));
    nodeLayer.append(g);
    return { id: spec.id, g, d, plate, label, title, ci, x: 0, y: 0, vx: 0, vy: 0, soft: 1 };
  }

  function updateNode(node) {
    const sp = node.spec;
    const classes = ['node', 't-' + sp.type];
    if ((G.nArr.length <= 26 && sp.type === 'session') || sp.type === 'main') classes.push('map-anchor');
    if (sp.conflict) classes.push('c-' + sp.conflict);
    if (sp.health) classes.push('h-' + sp.health);
    if (sp.ci) classes.push('ci-' + sp.ci);
    if (sp.merged) classes.push('merged');
    if (G.selected === sp.id) classes.push('sel');
    node.g.setAttribute('class', classes.join(' '));
    node.g.style.setProperty('--c', sp.color || 'var(--identity-fallback)');
    const name = nodeLabel(sp);
    if (node.ci) node.ci.path.setAttribute('d', ciStatus(sp.ci).mark);
    const state = sp.type === 'pr' ? ciStatus(sp.ci).label
      : sp.conflict === 'red' ? 'Urgent' : sp.conflict ? 'Warning' : '';
    setText(node.title, [name, sp.sub, sp.prTitle, state].filter(Boolean).join(' · '));
    const label = clip(name, 23) + (state ? ' · ' + state : '');
    setText(node.label, label);
    node.rr = Math.max(node.d.r, label.length * 3.4) + 9;
  }

  function styleEdge(line, type) {
    line.setAttribute('stroke-width', type.width || 1.6);
    if (type.dash) line.setAttribute('stroke-dasharray', type.dash);
    else line.removeAttribute('stroke-dasharray');
    line.setAttribute('marker-end', 'url(#edge-' + type.marker + ')');
  }

  function reconcile(model) {
    let topologyChanged = false;
    const fresh = new Set();
    for (const [id, node] of G.nodes) {
      if (!model.nodes.has(id)) {
        node.g.remove();
        G.nodes.delete(id);
        topologyChanged = true;
      }
    }
    for (const [id, spec] of model.nodes) {
      let node = G.nodes.get(id);
      if (!node) {
        node = createNode(spec);
        G.nodes.set(id, node);
        fresh.add(node);
        topologyChanged = true;
      }
      node.spec = spec;
    }
    G.nArr = [...G.nodes.values()];
    for (const node of G.nArr) updateNode(node);

    for (const [key, edge] of G.edges) {
      if (!model.edges.has(key)) {
        edge.el.remove();
        G.edges.delete(key);
        topologyChanged = true;
      }
    }
    for (const [key, spec] of model.edges) {
      const a = G.nodes.get(spec.a), b = G.nodes.get(spec.b);
      let edge = G.edges.get(key);
      if (!edge) {
        const el = sv(a === b ? 'path' : 'line', null, 'e');
        edgeLayer.append(el);
        edge = { el, a, b };
        G.edges.set(key, edge);
        topologyChanged = true;
      }
      if (!edge.spec || edgeType(edge.spec) !== edgeType(spec)) styleEdge(edge.el, edgeType(spec));
      edge.spec = spec;
      edge.el.classList.toggle('hl', spec.a === G.selected || spec.b === G.selected);
    }
    G.eArr = [...G.edges.values()];

    if (topologyChanged) {
      svg.classList.toggle('dense', G.nArr.length > 26 || (G.view?.k || 1) < 0.58);
      let index = 0;
      for (const node of G.nArr) {
        node.soft = fresh.has(node) ? 1 : 0.08;
        if (!fresh.has(node)) continue;
        const saved = G.pos[node.id];
        const angle = index++ * Math.PI * (3 - Math.sqrt(5));
        const radius = 110 + 55 * Math.sqrt(index);
        node.x = Number.isFinite(saved?.[0]) ? saved[0] : Math.cos(angle) * radius;
        node.y = Number.isFinite(saved?.[1]) ? saved[1] : Math.sin(angle) * radius;
        if (node.id === 'main' && !saved) node.x = node.y = 0;
      }
      kick(fresh.size === G.nArr.length ? 1 : 0.45);
    }
    updateLabelPlates();
    setText($('gstat'), G.nArr.length + ' nodes · ' + G.eArr.length + ' relationships');
    const capped = model.nodes.size < G.model.nodes.size || model.edges.size < G.model.edges.size;
    setText($('mapSummary'), capped
      ? 'Showing ' + model.nodes.size + ' of ' + G.model.nodes.size + ' nodes and ' + model.edges.size + ' of ' +
        G.model.edges.size + ' relationships. Use List to browse all nodes and relationships.'
      : 'Use List to browse nodes and their relationships.');
  }

  function tick() {
    var ns = G.nArr, n = ns.length, a = G.alpha, i, j;
    for (i = 0; i < n; i++) { ns[i].fx = 0; ns[i].fy = 0; }
    for (i = 0; i < n; i++) {
      var A = ns[i];
      for (j = i + 1; j < n; j++) {
        var B = ns[j];
        var dx = B.x - A.x, dy = B.y - A.y, d2 = dx * dx + dy * dy;
        if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = dx * dx + dy * dy + 0.01; }
        var d = Math.sqrt(d2);
        if (d < 900) {
          var f = 520 * (CHARGE[A.spec.type] || 1) * (CHARGE[B.spec.type] || 1) * a / d;
          var fx = dx / d * f, fy = dy / d * f;
          A.fx -= fx; A.fy -= fy; B.fx += fx; B.fy += fy;
        }
        var md = A.rr + B.rr;
        if (d < md) {
          var push = (md - d) * 0.14 / d;
          var sa = A.soft, sb = B.soft;
          { A.x -= dx * push * sa; A.y -= dy * push * sa; }
          { B.x += dx * push * sb; B.y += dy * push * sb; }
        }
      }
    }
    G.eArr.forEach(function (ge) {
      var A = ge.a, B = ge.b; if (!A || !B) return;
      var rs = REST[ge.spec.kind] || [140, 0.08];
      var dx = B.x - A.x, dy = B.y - A.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var L = rs[0] + (A.spec.type === 'session' || B.spec.type === 'session' ? 40 : 0);
      var f = (d - L) * rs[1] * a, fx = dx / d * f, fy = dy / d * f;
      A.fx += fx; A.fy += fy; B.fx -= fx; B.fy -= fy;
    });
    for (i = 0; i < n; i++) {
      var N = ns[i];
      var g = N.spec.type === 'main' ? 0.05 : (N.spec.type === 'session' ? 0.018 : 0.012);
      N.fx -= N.x * g * a; N.fy -= N.y * g * a * 1.25;
      N.vx = (N.vx + N.fx * N.soft) * 0.55; N.vy = (N.vy + N.fy * N.soft) * 0.55;
      var sp = Math.sqrt(N.vx * N.vx + N.vy * N.vy);
      if (sp > 45) { N.vx *= 45 / sp; N.vy *= 45 / sp; }
      N.x += N.vx; N.y += N.vy;
    }
    G.alpha *= 0.985;
  }


  function draw() {
    for (const node of G.nArr) node.g.setAttribute('transform', 'translate(' + node.x.toFixed(1) + ',' + node.y.toFixed(1) + ')');
    for (const { el, a, b } of G.eArr) {
      if (a === b) {
        const x = a.x, y = a.y - a.d.r;
        el.setAttribute('d', 'M ' + (x - 8) + ' ' + y + ' C ' + (x - 55) + ' ' + (y - 62) + ' ' +
          (x + 55) + ' ' + (y - 62) + ' ' + (x + 8) + ' ' + y);
        continue;
      }
      const dx = b.x - a.x, dy = b.y - a.y, distance = Math.hypot(dx, dy) || 1;
      const ux = dx / distance, uy = dy / distance;
      const start = a.d.r * 0.9, end = b.d.r * 0.9 + 5;
      el.setAttribute('x1', a.x + ux * start);
      el.setAttribute('y1', a.y + uy * start);
      el.setAttribute('x2', b.x - ux * end);
      el.setAttribute('y2', b.y - uy * end);
    }
  }

  function kick(alpha, requested = false) {
    cancelAnimationFrame(G.frame);
    function settle() {
      G.frame = 0;
      G.alpha = alpha;
      for (let i = 0; i < 120; i++) tick();
      G.alpha = 0;
      draw();
      const center = G.centerAfterLayout;
      G.centerAfterLayout = null;
      if (center && G.nodes.has(center)) centerNode(center);
      else if (G.autoFit || !G.view) fitView();
      else updateLabelPlates();
      saveSoon();
      if (requested) announce('Graph layout updated.');
    }
    // Settle offscreen and draw once, even with the default motion preference.
    if (motion.matches || isPaused()) settle();
    else G.frame = requestAnimationFrame(settle);
  }

  function saveSoon() {
    clearTimeout(G.saveT);
    G.saveT = setTimeout(() => {
      for (const node of G.nArr) G.pos[node.id] = [Math.round(node.x), Math.round(node.y)];
      const keys = Object.keys(G.pos);
      for (const key of keys.slice(0, Math.max(0, keys.length - 500))) delete G.pos[key];
      lsSet('ac04.pos', G.pos);
      if (G.view) lsSet('ac04.view', G.view);
    }, 600);
  }

  function fitView() {
    const { width, height } = paneSize();
    if (!G.nArr.length || !width || !height) return;
    let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;
    for (const node of G.nArr) {
      left = Math.min(left, node.x - node.rr);
      right = Math.max(right, node.x + node.rr);
      top = Math.min(top, node.y - node.d.r);

    else if (isFinite(ml)) row.appendChild(h('span', 'cd2', fmtDur(ml) + ' left'));
    card.appendChild(row);
    if (str(r.why)) card.appendChild(h('div', 'txt', str(r.why)));
    if (G.model.nodes.has(id)) card.append(inspectButton(id, 'Inspect details'));
    return card;
  }
  function reservationSection(b) {
    if (!Array.isArray(b.reservations)) return null;
    var list = b.reservations.map(obj);
    var s = sec('Reservations', list.length);
    if (!list.length) s.appendChild(h('p', 'empty', 'No active reservations.'));
    list.forEach(function (r) { s.appendChild(reservationRow(r)); });
    return s;
  }
  function replyBlock(a) {
    var via = str(a.answeredVia);
    if (via === 'reply') {
      var w = h('div');
      w.appendChild(h('div', 'meta', 'answered via reply' + (str(a.replyRef) ? ' · ' + str(a.replyRef) : '')));
      if (str(a.replyText)) w.appendChild(h('blockquote', 'reply', str(a.replyText)));

  }
  function asksSection(b) {
    if (!Array.isArray(b.asks)) return null;
    var list = b.asks.map(obj).filter(function (a) { return str(a.from); });
    if (!list.length) return null;
    var open = list.filter(function (a) { return a.answered !== true; }).length;
    var s = sec('Asks', list.length, open + ' open');
    list.slice(0, 12).forEach(function (a) {

      row.appendChild(statusChip(answered ? 'success' : 'ask', answered ? 'Answered' : 'Open'));
      card.appendChild(row);

  const QUEUE_STATES = {
    landing: ['info', 'Landing now'],
    ready: ['success', 'Ready to merge'],
    ci: ['neutral', 'CI running', 'clock'],
    'needs-work': ['warning', 'Needs work'],
    stacked: ['neutral', 'Stacked', 'layers'],
    held: ['neutral', 'On hold', 'pause'],
  };

  function mqLink(number, url) {
    const label = '#' + str(number);
    return prLink(url, label) || h('strong', null, label);
  }

  function mergeQueueSection(board) {
    const queue = obj(board.mergeQueue);
    const section = sec('Merge queue');
    const heading = section.querySelector('h3');
    heading.id = 'mqTitle';
    heading.tabIndex = -1;
    if (!Object.keys(queue).length || queue.error) {
      const waiting = connection === 'loading';
      section.append(h('p', 'meta', waiting ? 'Loading merge queue…' : 'Merge queue unavailable.'));
      if (!waiting) {
        const retry = h('button', null, 'Retry now');
        retry.onclick = () => poll(true);
        section.append(retry);
      }
      return section;
    }
    const counts = obj(queue.counts);
    const ready = counts.ready ?? arr(queue.queue).filter(entry => obj(entry).status === 'ready').length;
    const queued = counts.queue ?? arr(queue.queue).length;
    const landed = counts.mergedToday ?? arr(queue.merged).length;
    const summary = h('p', 'meta', queued + ' queued · ' + ready + ' ready · ' + landed + ' merged today');
    summary.id = 'queueSummary';
    section.append(summary);
    if (connection === 'stale' || connection === 'offline') {
      section.append(h('p', 'meta', 'Showing the last available queue.'));
    }
    const runway = obj(queue.runway);
    section.append(h('h4', null, 'Main branch'));
    if (runway.held) {
      const held = h('p');
      held.append(statusChip('neutral', 'On hold', 'locked'), document.createTextNode(
        ' ' + [str(runway.owner), arr(runway.prs).map(number => '#' + number).join(', ')].filter(Boolean).join(' · ')));
      if (runway.why) held.append(document.createTextNode(' · ' + str(runway.why)));
      section.append(held);
    } else section.append(h('p', null, 'Main branch is free.'));

    const entries = arr(queue.queue).map(obj);
    section.append(h('h4', null, 'Landing order'));
    if (!entries.length) section.append(h('p', 'empty', 'No pull requests in the queue.'));
    const dependents = new Map(arr(queue.riding).map(entry => [str(obj(entry).number), obj(entry)]));
    const pullRequests = new Map(arr(obj(board.prs).items).map(entry => [str(obj(entry).number), obj(entry)]));
    const phases = new Map();
    for (const entry of entries) {
      const phase = str(entry.phase);
      if (!phases.has(phase)) phases.set(phase, []);
      phases.get(phase).push(entry);
    }
    for (const [phase, items] of phases) {
      const group = h('div');
      group.dataset.key = 'phase:' + phase;
      group.append(h('h5', null, phase || 'Queued pull requests'));
      const ordered = h('ol', 'queue');
      for (const entry of items) {
        const card = h('li', 'card queue-entry');
        card.dataset.key = 'queue:' + str(entry.number);
        if (Number.isInteger(Number(entry.position)) && Number(entry.position) > 0) card.value = Number(entry.position);
        const title = h('h6');
        title.append(mqLink(entry.number, entry.url), document.createTextNode(' ' + str(entry.title)));
        card.append(title);
        const row = h('div', 'row');
        if (entry.owner) row.append(tagSess(str(entry.owner)));
        if (entry.base && entry.base !== 'main') row.append(h('span', 'meta', 'Target branch ' + str(entry.base)));
        let state = Object.hasOwn(QUEUE_STATES, entry.status) ? QUEUE_STATES[entry.status] : ['neutral', 'Status unknown'];
        if (entry.status === 'stacked' && entry.stackedOn) state = ['neutral', 'Waiting on #' + entry.stackedOn, 'layers'];
        if (entry.status === 'needs-work') {
          const pull = obj(pullRequests.get(str(entry.number)));
          const ci = obj(pull.checks).conclusion || pull.ci;
          if (ci === 'failure') state = ['danger', 'CI failed'];
          else if (pull.reviewDecision === 'CHANGES_REQUESTED') state = ['warning', 'Changes requested'];
        }
        row.append(statusChip(...state));
        card.append(row);
        const blockers = arr(entry.blockers).map(str).filter(Boolean);
        if (blockers.length) card.append(h('p', 'meta', blockers[0]));
        if (blockers.length > 1) {
          const details = h('details', 'graph-disclosure');
          details.dataset.key = 'blockers';
          details.append(h('summary', null, 'Show all ' + blockers.length + ' blockers for #' + entry.number));
          const list = h('ul');
          for (const blocker of blockers) list.append(h('li', null, blocker));
          details.append(list);
          card.append(details);
        }
        const riders = arr(entry.riders);
        if (riders.length) {
          const details = h('details', 'graph-disclosure');
          details.dataset.key = 'dependents';
          details.append(h('summary', null, riders.length + ' dependent pull request' + (riders.length === 1 ? '' : 's') + ' for #' + entry.number));
          const list = h('ul');
          for (const number of riders) {
            const info = obj(dependents.get(str(number)));
            const item = h('li');
            item.dataset.key = str(number);
            item.append(mqLink(number, info.url || obj(pullRequests.get(str(number))).url));
            if (info.title) item.append(document.createTextNode(' ' + str(info.title)));
            if (info.owner) item.append(document.createTextNode(' · ' + str(info.owner)));
            list.append(item);
          }
          details.append(list);
          card.append(details);
        }
        ordered.append(card);
      }
      group.append(ordered);
      section.append(group);
    }
    const merged = arr(queue.merged).map(obj);
    section.append(h('h4', null, 'Landed today'));
    if (!merged.length) section.append(h('p', 'empty', 'No pull requests merged today.'));
    else {
      const details = h('details', 'graph-disclosure');
      details.dataset.key = 'landed';
      details.append(h('summary', null, merged.length + ' merged pull requests'));
      const list = h('ol', 'queue');
      for (const entry of merged) {
        const card = h('li', 'card');
        card.dataset.key = str(entry.number);
        const row = h('div', 'row');
        const at = parseT(entry.mergedAt);
        if (at !== null) row.append(h('time', 'meta', hhmm(at)));
        row.append(mqLink(entry.number, entry.url), h('span', null, str(entry.title)));
        if (entry.owner) row.append(tagSess(str(entry.owner)));
        if (entry.base && entry.base !== 'main') row.append(h('span', 'meta', 'Target branch ' + str(entry.base)));
        if (entry.mergedBy) row.append(h('span', 'meta', 'Merged by ' + str(entry.mergedBy)));
        card.append(row);
        list.append(card);
      }
      details.append(list);
      section.append(details);
    }
    return section;
  }

  function renderNode(sp, b, frag) {
    const summary = sec('Summary');
    summary.append(h('p', 'meta', NODE_TYPES[sp.type]));
    if (sp.sub && sp.type !== 'ask') summary.append(h('p', null, sp.sub));
    frag.append(summary);
    if (sp.conflict || (sp.why.length && sp.type !== 'ask')) {
      var s1 = sec(sp.conflict === 'red' ? 'Conflict' : (sp.conflict === 'warn' ? 'Coordinate' : 'Notes'));
      sp.why.forEach(function (w) { var c = h('div', 'card ' + (sp.conflict === 'red' ? 'red' : (sp.conflict ? 'amber' : 'info'))); c.appendChild(h('div', 'txt', w)); s1.appendChild(c); });
      frag.appendChild(s1);
    }
    var d = obj(sp.data);
    if (sp.type === 'session') {
      var s2 = sec('Status'); s2.appendChild(sessionCard(d, b)); frag.appendChild(s2);
      sessionExtras(sp.label, b, frag);

    } else if (sp.type === 'worktree') {
      var s4 = sec('Worktree');
      s4.appendChild(kv([['owner', d.owner || sp.owner], ['branch', d.branch], ['path', d.path, 'mono'], ['ahead of main', d.ahead], ['behind main', d.behind], ['dirty files', d.dirty],
        ['last commit', d.lastCommitAgeMin !== undefined && d.lastCommitAgeMin !== null ? fmtDur(d.lastCommitAgeMin) + ' ago' : ''], ['last subject', d.lastSubject], ['operation', d.op], ['status note', d.note]]));
      frag.appendChild(s4);
    } else if (sp.type === 'file') {
      var s5 = sec('Who mentions this file');
      if (d.full) s5.appendChild(kv([['path', d.full, 'mono']]));
      Object.keys(obj(d.lines)).forEach(function (sl) {
        var card = h('div', 'card ' + (arr(d.touch).indexOf(sl) >= 0 ? 'amber' : 'info')), row = h('div', 'row');
        row.appendChild(tagSess(sl)); row.appendChild(h('span', 'meta', arr(d.avoid).indexOf(sl) >= 0 ? 'Says it will avoid' : 'Touches'));
        card.appendChild(row); arr(d.lines[sl]).forEach(function (l) { card.appendChild(h('div', 'txt', l)); });
        s5.appendChild(card);
      });
      frag.appendChild(s5);
    } else if (sp.type === 'migration') {
      var s6 = sec('Migration');
      var f = obj(d.file), c = obj(d.claim);
      s6.appendChild(kv([['file', f.name, 'mono'], ['present in', arr(f.where).join(', ')], ['on main', f.onMain === undefined ? '' : String(f.onMain)], ['claim owner', f.claimOwner || c.owner],
        ['claim name', c.name || f.claimName], ['claimed at', c.claimed], ['claim note', c.ref], ['main max at claim', c.main_max_at_claim]]));
      frag.appendChild(s6);
    } else if (sp.type === 'lock') {
      var s7 = sec('Lock');
      s7.appendChild(kv([['owner', d.owner], ['since', d.since], ['why', d.why]]));
      if (sp.since) { var r = h('div', 'card ' + (sp.flavor === 'freeze' ? 'red' : 'amber')); r.appendChild(liveSpan('cd', sp.since, 'since')); s7.appendChild(r); }
      frag.appendChild(s7);
    } else if (sp.type === 'pr') {
      if (sp.pr) frag.appendChild(prDetail(sp.pr));
      var s8 = sec('Mentioned in', sp.mentions.length);
      sp.mentions.forEach(function (m) {
        var card = h('div', 'card info'), row = h('div', 'row'); if (m.slug) row.appendChild(tagSess(m.slug));
        card.appendChild(row); card.appendChild(h('div', 'txt', m.text)); s8.appendChild(card);
      });
      if (sp.merged) s8.appendChild(statusChip('success', 'Reported merged'));
      frag.appendChild(s8);
    } else if (sp.type === 'prs') {
      var list = arr(d.prs);
      var s12 = sec('PRs in this stack', list.length, 'newest first');
      var box12 = h('div', 'prlist');
      list.forEach(function (pn) {
        if (pn.pr) { box12.appendChild(prRow(pn.pr)); return; }
        var card = h('div', 'card info'), row = h('div', 'row');
        row.appendChild(h('strong', null, pn.label));
        if (pn.merged) row.appendChild(statusChip('success', 'Reported merged'));
        else row.appendChild(statusChip('neutral', 'Absent from open pull requests'));
        card.appendChild(row);
        if (pn.mentions.length) card.appendChild(h('div', 'txt meta', clip(pn.mentions[0].text, 160)));
        box12.appendChild(card);
      });
      s12.appendChild(box12);
      frag.appendChild(s12);
    } else if (sp.type === 'ask') {
      var s9 = sec('Ask');
      var card = h('div', 'card violet'), row = h('div', 'row'); row.appendChild(tagSess(str(d.slug)));
      (sp.targets || []).forEach(function (x) { row.appendChild(h('span', 'meta', '→')); row.appendChild(tagSess(x)); });
      card.appendChild(row); card.appendChild(h('div', 'txt', str(d.text)));
      if (d.answered === true) card.appendChild(h('div', 'meta', 'answered' + (d.answeredBy ? ' by ' + str(d.answeredBy) : '') + (d.answeredAt ? ' at ' + str(d.answeredAt) : '')));
      else if (d.answered === false) card.appendChild(h('div', 'meta', 'unanswered' + (d.ageMin !== undefined && d.ageMin !== null ? ' for ' + fmtDur(d.ageMin) : '')));
      if (d.ref) card.appendChild(h('div', 'meta mono', str(d.ref)));
      var rb9 = replyBlock(d); if (rb9) card.appendChild(rb9);
      s9.appendChild(card);
      frag.appendChild(s9);
    } else if (sp.type === 'reservation') {
      var s11 = sec('Reservation');
      s11.appendChild(reservationRow(d));
      s11.appendChild(kv([['pattern', d.pattern, 'mono'], ['owner', d.owner], ['mode', d.mode], ['why', d.why], ['since', d.since], ['expires at', d.expiresAt], ['id', d.id, 'mono']]));
      frag.appendChild(s11);
    } else if (sp.type === 'main') {
      var mig = obj(b.migrations);
      var s10 = sec('Main');
      s10.appendChild(kv([['highest migration', mig.mainMax], ['migrations fetched', mig.mainFetchedAt], ['frozen', arr(b.locks).some(function (l) { return str(obj(l).lock) === 'main-freeze'; }) ? 'yes (main-freeze held)' : 'no']]));
      frag.appendChild(s10);
    }
    const edges = [...G.model.edges.values()];
    for (const [direction, endpoint] of [['Outgoing connections', 'a'], ['Incoming connections', 'b']]) {
      const connections = edges.filter(edge => edge[endpoint] === sp.id);
      const section = sec(direction, connections.length);
      if (connections.length) {
        const list = h('ul', 'conn');
        const lastPage = Math.ceil(connections.length / PAGE_SIZE) - 1;
        const page = inspectorPage[endpoint] = Math.min(inspectorPage[endpoint], lastPage);
        for (const edge of pageItems(connections, page)) list.append(relationRow(edge, G.model));
        section.append(list);
        if (lastPage > 0) {
          const buttons = h('div', 'actions');
          const first = page * PAGE_SIZE + 1;
          const last = Math.min(first + PAGE_SIZE - 1, connections.length);
          section.append(h('p', 'meta', first + '–' + last + ' of ' + connections.length));
          for (const [step, action] of [[-1, 'Previous'], [1, 'Next']]) {
            const button = h('button', null, action + ' ' + direction.toLowerCase());
            const target = page + step;
            button.setAttribute('aria-disabled', String(target < 0 || target > lastPage));
            button.onclick = () => {
              if (target < 0 || target > lastPage) return;
              inspectorPage[endpoint] = target;
              renderInspector();
              announce(direction + ' page ' + (target + 1) + ' of ' + (lastPage + 1) + '.');
            };
            buttons.append(button);
          }
          section.append(buttons);
        }
      } else section.append(h('p', 'empty', 'No connections.'));
      frag.append(section);
    }
  }

  function renderInspector() {
    const board = G.model?.board || {};
    const selected = G.model?.nodes.get(G.selected);
    const title = $('inspectorTitle');
    const active = document.activeElement;
    const actions = [$('overview'), $('backToGraph')];
    setText(title, selected ? nodeLabel(selected) : 'Overview');
    for (const action of actions) action.hidden = !selected;
    if (!selected && actions.includes(active)) title.focus();
    const fragment = document.createDocumentFragment();
    if (selected) renderNode(selected, board, fragment);
    else if (G.model) renderOverview(board, fragment);
    else fragment.append(mergeQueueSection(board));
    patchChildren($('inspectorBody'), fragment, $('inspectorTitle'));
  }

  /* ---------- alerts and connection ---------- */
  let alertPage = 0;
  const ALERTS_PER_PAGE = 8;
  function renderAlerts(board) {
    const alerts = new Map();
    function add(key, role, label, text, target, icon) {
      alerts.set(key, { key, role, label, text, target, icon });
    }
    for (const lock of arr(board.locks).map(obj)) {
      const freeze = lock.lock === 'main-freeze';
      add('lock:' + lock.lock, freeze ? 'danger' : 'warning', freeze ? 'Urgent' : 'Warning',
        (freeze ? 'Merge freeze' : str(lock.lock)) + ' · held by ' + str(lock.owner), 'l:' + lock.lock, 'locked');
    }
    const seenAsks = new Set();
    for (const [index, ask] of arr(board.asks).map(obj).entries()) {
      if (ask.answered || !ask.from) continue;
      const key = JSON.stringify([ask.from, ask.text]);
      if (seenAsks.has(key)) continue;
      seenAsks.add(key);
      const id = askId(ask, index);
      add(id, 'ask', 'Ask', str(ask.from) + ' · ' + str(ask.text), id);
    }
    for (const node of G.model.nodes.values()) {
      if (node.type === 'ask' && !Array.isArray(board.asks)) {
        add(node.id, 'ask', 'Ask', nodeLabel(node) + ' · ' + str(obj(node.data).text), node.id);
      }
    }
    for (const { key, item } of G.model.attention) {
      if (item.kind === 'freeze' || item.kind === 'conflict' || item.kind === 'stale') continue;
      const urgent = item.sev === 'red';
      add(key, urgent ? 'danger' : 'warning',
        urgent ? 'Urgent' : 'Warning', str(item.text), item.slug ? 's:' + item.slug : null);
    }
    for (const session of G.model.sessions) {
      const hb = obj(session.hb);
      const health = str(hb.health);
      if (!health || health === 'ok') continue;
      const urgent = G.model.nodes.get('s:' + session.slug)?.health === 'red';
      add('heartbeat:' + session.slug, urgent ? 'danger' : 'warning', urgent ? 'Urgent' : 'Warning',
        session.slug + ' · heartbeat ' + health, 's:' + session.slug);
    }
    for (const item of arr(board.timeline).map(obj)) {
      const at = parseT(item.atUtc);
      if (at === null) continue;
      const overdue = at < nowMs();
      add(JSON.stringify(['timeline', item.slug, item.text]), overdue ? 'danger' : 'warning',
        overdue ? 'Urgent' : 'Warning', str(item.slug) + ' · ' + str(item.text) + ' · ' + hhmm(at),
        item.slug ? 's:' + item.slug : null);
    }
    const conflicts = new Map();
    for (const pair of arr(obj(board.conflicts).pairs).map(obj)) {
      if (pair.error || pair.clean === true || pair.viaMain === true || pair.kind !== 'cross-session') continue;
      const a = str(obj(pair.a).owner), b = str(obj(pair.b).owner);
      if (!a || !b) continue;
      const key = [a, b].sort().join(' ↔ ');
      const group = conflicts.get(key) || { count: 0, files: new Set(), owner: a };
      group.count++;
      for (const file of arr(pair.files)) group.files.add(baseName(file));
      conflicts.set(key, group);
    }
    for (const [name, group] of conflicts) {
      const files = [...group.files];
      add('conflict:' + name, 'danger', 'Urgent', name + ' · merge conflicts across ' + group.count +
        (group.count === 1 ? ' branch pair' : ' branch pairs') + (files.length ? ' · ' + files.slice(0, 2).join(', ') : ''),
        's:' + group.owner);
    }
    const counts = { danger: 0, warning: 0, ask: 0 };
    const entries = [...alerts.values()];
    for (const entry of entries) counts[entry.role]++;
    const order = ['danger', 'warning', 'ask'];
    entries.sort((a, b) => order.indexOf(a.role) - order.indexOf(b.role));
    const summary = [['danger', 'urgent'], ['warning', 'warning'], ['ask', 'ask']]
      .filter(([role]) => counts[role]).map(([role, label]) => counts[role] + ' ' + label +
        (counts[role] > 1 && role !== 'danger' ? 's' : '')).join(' · ');
    setText($('chipTog'), summary ? 'Alerts · ' + summary : 'Alerts');
    alertPage = Math.min(alertPage, Math.max(0, Math.ceil(entries.length / ALERTS_PER_PAGE) - 1));
    if (!$('chips').hidden) {
      const fragment = document.createDocumentFragment();
      const start = alertPage * ALERTS_PER_PAGE;
      for (const entry of entries.slice(start, start + ALERTS_PER_PAGE)) {
        const row = h('li');
        row.dataset.key = entry.key;
        row.append(statusChip(entry.role, entry.label, entry.icon), h('span', null, entry.text));
        if (G.model.nodes.has(entry.target)) {
          const node = G.model.nodes.get(entry.target);
          row.append(inspectButton(entry.target, 'Open ' + nodeLabel(node)));
        }
        fragment.append(row);
      }
      if (!entries.length) fragment.append(h('li', null, 'No active alerts.'));
      patchChildren($('chips'), fragment, $('chipTog'));
      const pages = $('alertPages');
      pages.hidden = entries.length <= ALERTS_PER_PAGE && !pages.contains(document.activeElement);
      $('alertPrev').setAttribute('aria-disabled', String(alertPage === 0));
      $('alertNext').setAttribute('aria-disabled', String(start + ALERTS_PER_PAGE >= entries.length));
    }
  }

  const standalone = window.parent === window;
  const shellBoard = window.frameElement?.dataset.boardSource === 'shell' ? window.parent.zm : null;
  const PAUSE_KEY = 'zm.paused';
  let connection = 'loading';
  let snapshotAt = null;
  let pendingBoard = null;
  let pollTimer = 0;
  let requestInFlight = false;

  function isPaused() {
    try { return localStorage.getItem(PAUSE_KEY) === '1'; }
    catch { return $('pauseUpdates').getAttribute('aria-pressed') === 'true'; }
  }

  function announce(message) {
    if (!standalone) {
      try {
        if (typeof window.parent.zm?.announce === 'function') {
          window.parent.zm.announce(message);
          return;
        }
      } catch { /* Cross-origin frames can use their own view status. */ }
    }
    setText($('graphAnnouncements'), message);
  }

  function connectionText() {
    if (isPaused()) return snapshotAt === null ? 'Live updates paused' : 'Live updates paused · data from ' + hhmm(snapshotAt);
    if (connection === 'loading') return 'Connecting to the board…';
    if (connection === 'live') return 'Live · updated ' + hhmm(snapshotAt);
    if (connection === 'stale') return 'Showing a saved copy from ' + hhmm(snapshotAt);
    return snapshotAt === null ? "Couldn't load the board." : 'Offline · showing data from ' + hhmm(snapshotAt);
  }

  function updateConnection(next = connection) {
    const previous = connection;
    connection = next;
    const text = connectionText();
    setText($('pollstat'), text);
    const retry = $('retry');
    const available = next === 'offline' || next === 'stale';
    retry.hidden = !available && document.activeElement !== retry;
    retry.setAttribute('aria-disabled', String(requestInFlight || isPaused()));
    if (standalone && previous !== next) {
      const problem = next === 'offline';
      if (!problem) setText($('graphErrors'), '');
      setText($(problem ? 'graphErrors' : 'graphAnnouncements'), text);
    }
  }

  function renderAll(board) {
    const model = buildModel(board, G.model?.identity);
    model.attention = attentionEntries(board, G.model?.attention);
    const time = parseT(board.now);
    if (time !== null) skew = time - Date.now();
    const meta = obj(board.meta);
    const stale = meta.stale === true;
    snapshotAt = (stale ? parseT(meta.cachedAt) : time) ?? time ?? Date.now();
    updateConnection(stale ? 'stale' : 'live');
    G.model = model;
    $('graphEmpty').hidden = Boolean(model.sessions.length);
    if (G.selected && !G.model.nodes.has(G.selected)) {
      G.selected = null;
      announce('The selected node is no longer on the board.');
    }
    if (!$('mapPanel').hidden) reconcile(mapModel(G.model, G.selected));
    renderNetworkList();
    renderAlerts(board);
    renderInspector();
  }

  function applyPause() {
    const paused = isPaused();
    const button = $('pauseUpdates');
    button.setAttribute('aria-pressed', String(paused));
    setText(button, paused ? 'Resume live updates' : 'Pause live updates');
    updateConnection();
    if (paused) {
      clearTimeout(pollTimer);
      return;
    }
    if (pendingBoard) {
      const board = pendingBoard;
      pendingBoard = null;
      renderAll(board);
    }
    poll();
  }

  async function poll(manual = false) {
    if (shellBoard) {
      if (manual) return shellBoard.refreshBoard();
      return;
    }
    if (document.hidden || requestInFlight || isPaused()) return;
    clearTimeout(pollTimer);
    requestInFlight = true;
    updateConnection();
    try {
      const response = await fetch('/api/board', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
      if (!response.ok) throw new Error('Board request failed');
      const board = obj(await response.json());
      if (!Array.isArray(board.sessions) || parseT(board.now) === null) throw new Error('Invalid board response');
      if (isPaused()) pendingBoard = board;
      else renderAll(board);
    } catch {
      if (!isPaused()) {
        updateConnection('offline');
        renderInspector();
      }
    } finally {
      requestInFlight = false;
      updateConnection();
      if (!isPaused()) pollTimer = setTimeout(poll, 5000);
    }
  }

  function initLiveUpdates() {
    const pause = $('pauseUpdates');
    pause.hidden = !standalone;
    pause.onclick = () => {
      const next = !isPaused();
      try {
        if (next) localStorage.setItem(PAUSE_KEY, '1');
        else localStorage.removeItem(PAUSE_KEY);
      } catch { pause.setAttribute('aria-pressed', String(next)); }
      applyPause();
      announce(connectionText());
    };
    addEventListener('storage', event => { if (event.key === PAUSE_KEY || event.key === null) applyPause(); });
    $('retry').onclick = () => poll(true);
    $('retry').addEventListener('blur', () => updateConnection());
    const alerts = $('chips');
    bindDisclosure($('chipTog'), alerts, open => {
      if (!open) $('alertPages').hidden = true;
      else if (G.model) renderAlerts(G.model.board);
    });
    for (const [id, step] of [['alertPrev', -1], ['alertNext', 1]]) {
      $(id).onclick = () => {
        if ($(id).getAttribute('aria-disabled') === 'true' || !G.model) return;
        alertPage += step;
        renderAlerts(G.model.board);
      };
    }
    setInterval(() => {
      if (isPaused()) return;
      for (const element of document.querySelectorAll('[data-graph-clock]')) {
        const clock = clocks.get(element);
        if (clock) updLive(clock);
      }
    }, 1000);
    if (shellBoard) {
      window.addEventListener('zm-board', ({ detail: { board, connection } }) => {
        if (board && board !== G.model?.board) renderAll(board);
        if (connection === 'error' || connection === 'offline') {
          updateConnection('offline');
          renderInspector();
        }
      });
    } else {
      window.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
    }
    applyPause();
  }

  initSvg();
  buildLegend();
  initBrowse();
  renderInspector();
  initLiveUpdates();
})();

</script>
</body>
</html>
