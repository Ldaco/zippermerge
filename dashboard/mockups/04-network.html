<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 Dependency Graph</title>
<style>
:root{
  --bg:#e4e9ee; --panel:#f6f8fa; --panel2:#ffffff; --line:#cdd6de; --ink:#1d2935; --muted:#5a6a7a;
  --red:#d3262f; --red-bg:#ffe6e6; --amber:#b97800; --amber-bg:#fff2d6; --green:#2a8a4f; --green-bg:#e3f4e9;
  --violet:#6a3fd6; --violet-bg:#eee7ff; --blue:#2563c9;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
body{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr) clamp(460px,25vw,680px);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#top{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 18px;background:var(--panel2);border-bottom:1px solid var(--line)}
#top .brand{font-weight:700;font-size:17px;margin-right:8px;letter-spacing:.01em}
#top .brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.3}
.chip{display:inline-flex;align-items:baseline;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;line-height:1.45;max-width:46vw;text-align:left}
.chip b{font-weight:700;letter-spacing:.04em;font-size:11.5px;text-transform:uppercase}
.chip.red{background:var(--red-bg);border-color:#f0a3a8;color:#8a1219;animation:chipPulse 1.8s ease-in-out infinite}
.chip.amber{background:var(--amber-bg);border-color:#e6c27a;color:#6d4700}
.chip.violet{background:var(--violet-bg);border-color:#c4b0f5;color:#3f1fa0}
.chip.green{background:var(--green-bg);border-color:#a6d7b8;color:#1d6a3b}
.chip .t{font-variant-numeric:tabular-nums;font-weight:600}
@keyframes chipPulse{0%,100%{box-shadow:0 0 0 0 rgba(211,38,47,.35)}50%{box-shadow:0 0 0 6px rgba(211,38,47,0)}}
#pollstat{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
#pollstat.bad{color:var(--red);font-weight:700}

#graphPane{position:relative;min-width:0;min-height:0;overflow:hidden;background:
  radial-gradient(circle at 50% 45%,#f9fbfc 0%,#eef2f6 70%,#e6ebf0 100%)}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#svg.panning{cursor:grabbing}
.ovl{position:absolute;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.5;backdrop-filter:blur(3px)}
#legend{left:14px;bottom:14px;max-width:560px}
#legend h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#legend .grid{display:grid;grid-template-columns:repeat(2,auto);gap:3px 20px}
#legend .it{display:flex;align-items:center;gap:8px;white-space:nowrap}
#legend svg{flex:none}
#ctrl{right:14px;top:14px;display:flex;gap:6px;align-items:center;padding:6px 8px}
#ctrl button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 10px;font-size:13px}
#ctrl button:hover{background:#eef3f8}
#gstat{font-size:12px;color:var(--muted);padding:0 6px;min-width:112px}
#gstat i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:6px}
#gstat.settled i{background:var(--green)}

/* graph elements */
.e{fill:none;stroke:#8fa0b1;stroke-width:1.2;stroke-opacity:.75;vector-effect:non-scaling-stroke}
.e-owns{stroke:#7f93a6}
.e-touches{stroke:#6f7f8f;stroke-dasharray:5 4}
.e-avoids{stroke:#9aa7b4;stroke-dasharray:2 5;stroke-opacity:.6}
.e-claims{stroke:#3b6ea8;stroke-dasharray:1.5 4;stroke-width:1.6}
.e-holds{stroke:#c08a14;stroke-width:1.6}
.e-freezes{stroke:var(--red);stroke-width:2;animation:freezeEdge 1.6s ease-in-out infinite}
.e-refs{stroke:#9aa7b4;stroke-opacity:.6}
.e-mentions{stroke:#b9c3cd;stroke-dasharray:3 6;stroke-opacity:.8}
.e-asks{stroke:var(--violet);stroke-width:2.4;stroke-opacity:1;stroke-dasharray:10 8;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes freezeEdge{0%,100%{stroke-opacity:.95}50%{stroke-opacity:.35}}
.has-sel .e.dim{opacity:.08}
.has-sel .node.dim{opacity:.2}
.has-sel .e.hl{stroke-width:2.4;stroke-opacity:1}
.node{cursor:pointer}
.node text{pointer-events:none;text-anchor:middle;font-family:var(--sans)}
.node .lab{font-size:13px;font-weight:600;fill:#1d2935;paint-order:stroke;stroke:#f3f6f9;stroke-width:4px;stroke-linejoin:round}
.node .sub{font-size:11.5px;fill:#566677;paint-order:stroke;stroke:#f3f6f9;stroke-width:3.5px;stroke-linejoin:round}
.node .inner{font-size:11.5px;font-weight:700;fill:#1d2935;dominant-baseline:central}
.node .inner2{font-size:11px;fill:rgba(255,255,255,.9);dominant-baseline:central}
.node .body{stroke-width:2;transition:stroke-width .15s}
.node:hover .body{stroke-width:3.2}
.node.sel .body{stroke-width:4.5;stroke:#111c27 !important}
.node .halo{fill:none;stroke-width:5;opacity:0;pointer-events:none}
.node .ring{fill:none;stroke-width:2.5;stroke-dasharray:6 5;opacity:0;pointer-events:none}
.node .fold{fill:none;stroke-width:1.6}
.t-session .body{fill:var(--c);stroke:#fff;stroke-width:3}
.t-session .inner{font-size:22px;fill:#fff;letter-spacing:.01em}
.t-session .lab{font-size:14.5px}
.t-main .body{fill:#3f5468;stroke:#22313f}
.t-main .inner{font-size:24px;fill:#fff}
.t-worktree .body{fill:#fff;stroke:var(--c);stroke-width:2.6}
.t-file .body{fill:#fff;stroke:#6f7f8f}
.t-file .fold{stroke:#6f7f8f}
.t-migration .body{fill:#eaf1fa;stroke:var(--c)}
.t-migration .inner{font-size:12px}
.t-lock .body{fill:var(--amber-bg);stroke:#c08a14}
.t-lock.k-freeze .body{fill:var(--red-bg);stroke:var(--red)}
.t-pr .body{fill:#fff;stroke:#6b7a8a}
.t-pr.merged .body{fill:var(--green-bg);stroke:var(--green)}
.t-ask .body{fill:var(--violet-bg);stroke:var(--violet)}
.t-ask .inner{fill:var(--violet);font-size:15px}
.c-red .body{stroke:var(--red);fill:var(--red-bg)}
.c-red .halo{stroke:var(--red);animation:pulse 1.5s ease-out infinite}
.c-red .fold{stroke:var(--red)}
.c-warn .body{stroke:var(--amber)}
.c-warn .halo{stroke:#e0a020;animation:pulse 2.4s ease-out infinite}
.c-ask .halo{stroke:var(--violet);animation:pulse 2s ease-out infinite}
.t-session.c-red .body{fill:var(--c)}
.t-main.c-red .body{fill:#3f5468}
.h-warn .ring{opacity:1;stroke:#e0a020}
.h-red .ring{opacity:1;stroke:var(--red);animation:ringspin 6s linear infinite}
.node .ring,.node .halo{transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes ringspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.e-asks,.e-freezes,.c-red .halo,.c-warn .halo,.c-ask .halo,.h-red .ring,.chip.red{animation:none}.c-red .halo,.c-warn .halo,.c-ask .halo{opacity:.5}}

/* inspector */
#inspector{grid-row:2;grid-column:2;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:0 0 64px}
.ihead{position:sticky;top:0;z-index:3;background:rgba(246,248,250,.96);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ihead button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 12px;font-size:13px}
.ihead button.on{background:#27384a;color:#fff;border-color:#27384a}
.ihead .cur{font-weight:700}
.sec{padding:14px 20px 6px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .n{background:#dbe3ea;border-radius:999px;padding:0 8px;font-size:11px;letter-spacing:0;color:#33424f}
.card{background:var(--panel2);border:1px solid var(--line);border-left-width:5px;border-radius:9px;padding:9px 14px;margin:0 0 9px}
.card.red{border-left-color:var(--red);background:#fff8f8}
.card.amber{border-left-color:#d9a22a}
.card.info{border-left-color:#7fa3cf}
.card.violet{border-left-color:var(--violet)}
.card .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .meta{font-size:12.5px;color:var(--muted)}
.card .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.cd{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.cd.late{color:var(--red)}
.tag{display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:#e3e9ef;color:#2f3e4c;line-height:1.6}
.tag.sess{color:#fff}
.tag.red{background:var(--red-bg);color:#8a1219}
.tag.amber{background:var(--amber-bg);color:#6d4700}
.tag.green{background:var(--green-bg);color:#1d6a3b}
.tag.violet{background:var(--violet-bg);color:#3f1fa0}
a.tag,button.tag{border:0;cursor:pointer}
.sess-card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;margin:0 0 14px;overflow:hidden}
.sess-card>.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;color:#fff;background:var(--c)}
.sess-card>.hd .nm{font-weight:700;font-size:16px}
.sess-card>.hd .ti{opacity:.92}
.sess-card .hb{padding:6px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid #e7ecf0;display:flex;gap:6px 16px;flex-wrap:wrap}
.fld{padding:7px 14px;border-bottom:1px solid #eef2f5}
.fld:last-child{border-bottom:0}
.fld .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld .v{white-space:pre-wrap;overflow-wrap:anywhere}
.fld ul{margin:2px 0 0;padding-left:20px}
.fld li{margin:1px 0;overflow-wrap:anywhere}
.fld.none .v{color:#8a97a4}
.fld.hot{background:var(--violet-bg)}
.fld.lockf{background:var(--amber-bg)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:0 0 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.mono{font-family:var(--mono);font-size:13px}
.conn{display:flex;flex-wrap:wrap;gap:6px}
.conn button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 10px;font-size:13px;text-align:left}
.conn button:hover{background:#eef3f8}
.conn .kind{color:var(--muted);font-size:11.5px;margin-right:6px}
.log{padding:7px 12px;border-bottom:1px solid #e2e8ee}
.log .lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.log .lb{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.logbox{background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.logbox .log:last-child{border-bottom:0}
.empty{color:var(--muted);font-style:italic;margin:0 0 10px}
#corner{position:fixed;right:12px;bottom:10px;z-index:20;background:#27384a;color:#fff;font-size:12px;padding:4px 12px;border-radius:999px;text-decoration:none;opacity:.92}
#corner:hover{opacity:1;text-decoration:underline}
@media (max-width:2100px){html,body{font-size:14px}body{grid-template-columns:minmax(0,1fr) clamp(420px,27vw,560px)}#legend{max-width:440px}}
@media (max-width:1200px){body{grid-template-columns:minmax(0,1fr) 380px}}
</style>
</head>
<body>
<header id="top">
  <div class="brand">Zippermerge network<small id="subtitle">sessions, work and conflicts as one dependency graph</small></div>
  <div id="chips" style="display:contents"></div>
  <div id="pollstat">connecting...</div>
</header>
<main id="graphPane">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dependency graph of agent sessions, worktrees, files, migrations, locks and pull requests"></svg>
  <div id="legend" class="ovl"></div>
  <div id="ctrl" class="ovl">
    <span id="gstat"><i></i><span>starting</span></span>
    <button id="bZoomOut" title="Zoom out">-</button>
    <button id="bZoomIn" title="Zoom in">+</button>
    <button id="bFit" title="Fit all nodes in view">Fit</button>
    <button id="bHeat" title="Re-run the layout from the current positions">Re-layout</button>
  </div>
</main>
<aside id="inspector" aria-label="Inspector"></aside>
<a id="corner" href="/mockups/">Mockup 04 &middot; Dependency Graph</a>

<script>
'use strict';
(function () {
  var SVGNS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function sv(tag, attrs, cls) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (cls) e.setAttribute('class', cls);
    return e;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return (x === null || x === undefined) ? '' : String(x); }
  function obj(x) { return (x && typeof x === 'object' && !Array.isArray(x)) ? x : {}; }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  function isNone(t) { return /^none\b/i.test(str(t).trim()) || !str(t).trim(); }

  /* ---------- colours and time ---------- */
  var PALETTE = ['#c8641a', '#6a4bc4', '#0f8a88', '#2563c9', '#b83a82', '#6f8514', '#a0522d', '#3c7a3c'];
  var KNOWN = {};
  function slugColor(sl) {
    if (KNOWN[sl]) return KNOWN[sl];
    var hh = 0;
    for (var i = 0; i < sl.length; i++) hh = (hh * 31 + sl.charCodeAt(i)) >>> 0;
    return PALETTE[hh % PALETTE.length];
  }
  var skew = 0;
  function nowMs() { return Date.now() + skew; }
  function fmtDur(min) {
    min = Math.round(Number(min));
    if (!isFinite(min)) return '?';
    if (min < 60) return min + 'm';
    return Math.floor(min / 60) + 'h ' + String(min % 60).padStart(2, '0') + 'm';
  }
  function fmtSec(ms) {
    var sec = Math.floor(Math.abs(ms) / 1000);
    var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
    var out = '';
    if (hh) out += hh + 'h ';
    if (hh || mm) out += (hh ? String(mm).padStart(2, '0') : mm) + 'm ';
    return out + String(ss).padStart(2, '0') + 's';
  }
  function parseT(x) {
    if (x === null || x === undefined || x === '') return null;
    if (/^\d{9,11}$/.test(str(x))) return Number(x) * 1000;
    var t = Date.parse(str(x));
    return isFinite(t) ? t : null;
  }

  var live = [];
  function liveSpan(cls, t, mode) {
    var el = h('span', cls, '');
    live.push({ el: el, t: t, mode: mode });
    updLive(live[live.length - 1]);
    return el;
  }
  function updLive(o) {
    var d = o.t - nowMs();
    if (o.mode === 'until') {
      o.el.textContent = d >= 0 ? 'in ' + fmtSec(d) : 'overdue ' + fmtSec(d);
      if (d < 0) o.el.classList.add('late'); else o.el.classList.remove('late');
    } else {
      o.el.textContent = 'held ' + fmtSec(-d);
    }
  }
  setInterval(function () { for (var i = 0; i < live.length; i++) updLive(live[i]); }, 1000);

  /* ---------- model ---------- */
  var NEG = /\b(not touch|will not|won't|never|avoid|stay out|do not|don't)\b/i;
  var PRRE = /#(\d{3,5})\b/g;

  function fieldList(ss) {
    var f = obj(ss.fields);
    var keys = arr(ss.order).map(str);
    Object.keys(f).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    return keys.map(function (k) {
      var fv = obj(f[k]);
      var items = arr(fv.items).map(str).filter(function (x) { return x.trim(); });
      return { key: k, value: str(fv.value).trim(), items: items };
    });
  }
  function fieldTexts(fl) {
    var t = [];
    if (fl.value) t.push(fl.value);
    fl.items.forEach(function (i) { t.push(i.trim()); });
    return t;
  }
  function fileTokens(text) {
    var out = [];
    text.split(/\s+/).forEach(function (raw) {
      var tok = raw.replace(/^[(\[`'"]+/, '').replace(/[)\],;:`'".]+$/, '');
      if (!tok || tok.indexOf('->') >= 0 || /^https?:/i.test(tok) || tok.indexOf('=') >= 0) return;
      if (!(/[\/\\]/.test(tok) || /\.[A-Za-z]{1,5}$/.test(tok))) return;
      var segs = tok.split(/[\/\\]/).filter(Boolean);
      var base = segs.pop() || '';
      if (/^\*+$/.test(base) && segs.length) base = segs.pop() + '/**';
      if (base.length < 2 || !/[A-Za-z0-9]/.test(base)) return;
      if (out.indexOf(base) < 0) out.push(base);
    });
    return out;
  }

  function buildModel(b) {
    var nodes = new Map(), pending = [];
    var sessions = arr(b.sessions).map(obj).filter(function (x) { return str(x.slug); });
    var slugs = sessions.map(function (x) { return str(x.slug); });

    function node(id, type, label, extra) {
      var n = nodes.get(id);
      if (!n) {
        n = { id: id, type: type, label: label, sub: '', conflict: '', why: [], data: {}, color: null, merged: false, mentions: [], flavor: '' };
        nodes.set(id, n);
      }
      if (extra) Object.keys(extra).forEach(function (k) { n[k] = extra[k]; });
      return n;
    }
    function edge(a, c, kind, note) { pending.push({ a: a, b: c, kind: kind, note: note || '' }); }
    function flag(n, level, why) {
      if (level === 'red') n.conflict = 'red'; else if (!n.conflict) n.conflict = 'warn';
      if (why) n.why.push(why);
    }

    node('main', 'main', 'main', { sub: '', color: '#3f5468' });

    /* sessions */
    sessions.forEach(function (ss) {
      var sl = str(ss.slug), hb = obj(ss.hb);
      var n = node('s:' + sl, 'session', sl, { color: slugColor(sl), data: ss });
      n.sub = str(ss.title);
      var hl = str(hb.health || 'ok').toLowerCase();
      n.health = hl === 'ok' ? '' : (/stale|dead|down|red|crit|overdue/.test(hl) ? 'red' : 'warn');
      n.healthText = hl;
      var bits = [];
      if (hb.statusAgeMin !== undefined && hb.statusAgeMin !== null) bits.push('status ' + fmtDur(hb.statusAgeMin));
      if (hb.lastPostAgeMin !== undefined && hb.lastPostAgeMin !== null) bits.push('post ' + fmtDur(hb.lastPostAgeMin));
      n.sub2 = bits.join(' · ');
      n.state = str(ss.state);
    });

    /* worktrees */
    var ownerByWt = {}, fieldWts = [];
    sessions.forEach(function (ss) {
      var sl = str(ss.slug);
      fieldList(ss).forEach(function (fl) {
        if (!/worktree/i.test(fl.key)) return;
        fieldTexts(fl).forEach(function (t) {
          var m = /([A-Za-z0-9_.\-]+)\s*->\s*(\S+)/.exec(t);
          if (m) { ownerByWt[m[1]] = sl; fieldWts.push({ name: m[1], branch: m[2], owner: sl, text: t }); }
        });
      });
    });
    function wtNode(name, data, own) {
      var n = node('w:' + name, 'worktree', name, { data: data, owner: own || null, color: own ? slugColor(own) : '#7b8794' });
      if (own) edge('s:' + own, n.id, 'owns');
      return n;
    }
    arr(obj(b.worktrees).items).map(obj).forEach(function (w) {
      var name = str(w.name);
      if (!name) return;
      var own = str(w.owner) || ownerByWt[name] || '';
      var n = wtNode(name, w, own);
      var bits = [];
      if (w.ahead !== undefined && w.ahead !== null) bits.push('↑' + w.ahead);
      if (w.behind !== undefined && w.behind !== null) bits.push('↓' + w.behind);
      var s1 = bits.join(' ');
      if (Number(w.dirty) > 0) s1 += (s1 ? ' · ' : '') + w.dirty + ' dirty';
      if (w.op) { s1 += (s1 ? ' · ' : '') + str(w.op); flag(n, 'warn', 'operation in progress: ' + str(w.op)); }
      n.sub = s1;
      if (str(w.branch) === 'main') edge(n.id, 'main', 'touches');
    });
    fieldWts.forEach(function (fw) {
      if (!nodes.has('w:' + fw.name)) {
        var n = wtNode(fw.name, { name: fw.name, branch: fw.branch, note: fw.text }, fw.owner);
        n.sub = fw.branch;
      }
    });

    /* hot files */
    var files = new Map();
    function fileRec(base) {
      var id = 'f:' + base.toLowerCase();

    cons.forEach(function (c) {
      var o = G.nodes.get(c[1]); if (!o) return;
      var bt = h('button'); bt.appendChild(h('span', 'kind', c[0]));
      bt.appendChild(document.createTextNode(o.spec.type + ' ' + (o.spec.type === 'ask' ? 'ask by ' + str(obj(o.spec.data).slug) : o.spec.label)));
      bt.addEventListener('click', function () { select(c[1]); });
      box.appendChild(bt);
    });
    if (!cons.length) box.appendChild(h('span', 'empty', 'no connections'));
    sc.appendChild(box); frag.appendChild(sc);
  }

  function renderInspector() {
    var b = obj(G.model ? G.model.board : {});
    var top = insp.scrollTop;
    live = [];
    var frag = document.createDocumentFragment();
    var hd = h('div', 'ihead');
    var ov = h('button', G.selected ? '' : 'on', 'Overview');
    ov.addEventListener('click', function () { select(null); });
    hd.appendChild(ov);
    var sp = G.selected && G.model ? G.model.nodes.get(G.selected) : null;
    if (sp) hd.appendChild(h('span', 'cur', 'Selected: ' + sp.type + ' ' + (sp.type === 'ask' ? '(ask by ' + str(obj(sp.data).slug) + ')' : sp.label)));
    else hd.appendChild(h('span', 'meta', 'click a node for full detail'));
    frag.appendChild(hd);
    if (sp) renderNode(sp, b, frag); else renderOverview(b, frag);
    insp.replaceChildren(frag);
    insp.scrollTop = top;
  }
  var lastSel = null;
  var origRender = renderInspector;
  renderInspector = function () {
    var selChanged = lastSel !== G.selected;
    lastSel = G.selected;
    origRender();
    if (selChanged) insp.scrollTop = 0;
  };

  /* ---------- header chips ---------- */
  function chip(cls, label, text, target, liveT, liveMode) {
    var c = h('button', 'chip ' + cls);
    c.appendChild(h('b', null, label));
    if (text) c.appendChild(h('span', null, text));
    if (liveT) c.appendChild(liveSpan('t', liveT, liveMode));
    if (target) c.addEventListener('click', function () { select(target); });
    return c;
  }
  function renderChips(b) {
    var box = $('chips'), frag = document.createDocumentFragment(), n = 0;
    arr(b.locks).map(obj).forEach(function (l) {
      var frz = str(l.lock) === 'main-freeze';
      frag.appendChild(chip(frz ? 'red' : 'amber', 'lock', str(l.lock) + ' held by ' + str(l.owner), 'l:' + str(l.lock), parseT(l.since_epoch) || parseT(l.since), 'since')); n++;
    });
    arr(b.sessions).map(obj).forEach(function (ss) {
      var sl = str(ss.slug), fl = fieldList(ss);
      fl.forEach(function (f) {
        if (!/^asks?$/i.test(f.key)) return;
        fieldTexts(f).forEach(function (t, i) { if (!isNone(t)) { frag.appendChild(chip('violet', 'ask ' + sl, t, 'a:' + sl + ':' + i)); n++; } });
      });
      var hb = obj(ss.hb), hl = str(hb.health || 'ok').toLowerCase();
      if (hl !== 'ok') { frag.appendChild(chip('amber', 'stale', sl + ' heartbeat ' + hl + ', status ' + fmtDur(hb.statusAgeMin) + ' old', 's:' + sl)); n++; }
    });
    var tl = arr(b.timeline).map(obj).filter(function (t) { return parseT(t.atUtc) !== null; }).sort(function (x, y) { return parseT(x.atUtc) - parseT(y.atUtc); });
    tl.slice(0, 3).forEach(function (t) {
      var at = parseT(t.atUtc);
      frag.appendChild(chip(at < nowMs() ? 'red' : 'amber', 'risky', str(t.slug) + ': ' + str(t.text), t.slug ? 's:' + str(t.slug) : null, at, 'until')); n++;
    });
    var reds = arr(b.attention).map(obj).filter(function (a) { return a.sev === 'red' && a.kind !== 'freeze'; });
    reds.forEach(function (a) { frag.appendChild(chip('red', str(a.kind) || 'alert', str(a.text), a.slug ? 's:' + str(a.slug) : null)); n++; });
    if (!n) frag.appendChild(chip('green', 'all clear', 'no locks, asks or stale sessions', null));
    box.replaceChildren(frag);
  }

  /* ---------- polling ---------- */
  var failures = 0;
  function renderAll(b) {
    live = [];
    var model = buildModel(b);
    renderChips(b);
    reconcile(model);
    renderInspector();
  }
  function poll() {
    var done = function () { setTimeout(poll, 5000); };
    fetch('/api/board', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (b) {
      b = obj(b);
      var t = parseT(b.now); if (t !== null) skew = t - Date.now();
      failures = 0;
      renderAll(b);
      var ps = $('pollstat'); ps.className = ''; ps.textContent = 'live · updated ' + new Date().toLocaleTimeString();
      done();
    }).catch(function (e) {
      failures++;
      var ps = $('pollstat'); ps.className = 'bad';
      ps.textContent = 'offline (' + str(e && e.message) + '), retry #' + failures + ' · showing last data';
      done();
    });
  }

  initSvg();
  buildLegend();
  renderInspector();
  poll();
})();
</script>
</body>
</html>
