<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 Live Timeline</title>
<style>
:root{
  --bg:#e8ecf0; --panel:#f4f6f8; --ink:#1c2631; --ink2:#4a5866; --ink3:#7a8794;
  --hair:#c2cad3; --hair2:#d6dce2;
  --red:#b83227; --amber:#a86a0a; --blue:#2d6a99; --green:#2c7a57;
  --red-t:rgba(184,50,39,.13); --amber-t:rgba(168,106,10,.14); --blue-t:rgba(45,106,153,.10);
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",Calibri,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
body{padding:28px 44px 90px}
.sc{font-variant:small-caps;letter-spacing:.09em;text-transform:lowercase;color:var(--ink3);font-weight:600}
h1{font-size:26px;font-weight:300;letter-spacing:.01em;margin:0}
h2{margin:0 0 10px;font-size:13px}
header{display:flex;align-items:baseline;gap:28px;border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:18px}
header .clock{font-family:var(--mono);font-size:15px;color:var(--ink2)}
header .poll{margin-left:auto;font-size:13px;color:var(--ink3)}
header .poll.bad{color:var(--red);font-weight:600}
#banners{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:12px;margin-bottom:14px}
.banner{border:1px solid var(--hair);border-left:5px solid var(--blue);background:var(--panel);padding:10px 16px}
.banner.red{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-t),var(--panel) 60%)}
.banner.amber{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-t),var(--panel) 60%)}
.banner .t{font-size:16px;font-weight:600}
.banner .m{color:var(--ink2);font-size:14px}
#vitals{display:flex;gap:56px;margin:6px 0 18px;flex-wrap:wrap}
.vital .n{font-size:38px;font-weight:200;line-height:1.1;font-variant-numeric:tabular-nums}
.vital .n.red{color:var(--red)} .vital .n.amber{color:var(--amber)}
.tlwrap{background:var(--panel);border:1px solid var(--hair);padding:6px 0 4px;overflow:hidden}
#legend{display:flex;gap:22px;flex-wrap:wrap;padding:6px 20px 2px;font-size:12.5px;color:var(--ink2);align-items:center}
#legend span{display:inline-flex;gap:6px;align-items:center}
svg text{font-family:var(--sans)}
.mk{cursor:pointer}
.mk:hover .hit,.mk.hl .hit{fill:rgba(45,106,153,.18);stroke:var(--blue)}
.hit{fill:transparent;stroke:transparent}
#inspector{margin:10px 0 26px;border:1px solid var(--hair);background:var(--panel);padding:10px 18px;min-height:64px}
#inspector .k{font-size:12px}
#inspector .b{white-space:pre-wrap;overflow-wrap:anywhere}
#inspector.pinned{border-color:var(--blue)}
.grid{display:grid;gap:18px;align-items:start}
.sessions{grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
.panels{grid-template-columns:repeat(auto-fit,minmax(600px,1fr));margin-top:18px}
.card{background:var(--panel);border:1px solid var(--hair);padding:16px 20px}
.card.hl,.hl{outline:2px solid var(--blue);outline-offset:-2px;background-color:#e9f1f8}
.card header{border:0;padding:0;margin:0 0 8px;gap:14px;flex-wrap:wrap}
.card .slug{font-size:22px;font-weight:600}
.pill{font-size:12px;padding:0 8px;border:1px solid var(--hair);border-radius:10px;color:var(--ink2);background:#fff}
.pill.red{border-color:var(--red);color:var(--red)} .pill.amber{border-color:var(--amber);color:var(--amber)} .pill.green{border-color:var(--green);color:var(--green)}
.fresh{font-size:13px;color:var(--ink2);border-top:1px solid var(--hair2);border-bottom:1px solid var(--hair2);padding:6px 0;margin-bottom:10px;display:flex;gap:22px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.f{margin:0 0 10px;padding-left:10px;border-left:2px solid var(--hair2)}
.f.locks{border-left-color:var(--red)} .f.asks{border-left-color:var(--amber)} .f.risky{border-left-color:var(--blue)}
.f.none{opacity:.55}
.f .v{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.f ul{margin:2px 0 0;padding-left:18px}
.f li{margin:1px 0;overflow-wrap:anywhere;font-size:14px}
.mono{font-family:var(--mono);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--hair);font-variant:small-caps;letter-spacing:.08em;color:var(--ink3);font-weight:600}
td{padding:5px 10px 5px 0;border-bottom:1px solid var(--hair2);vertical-align:top;overflow-wrap:anywhere}
tr.hl td{background:#e9f1f8}
.row{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--hair2);align-items:baseline}
.row .g{flex:0 0 18px;text-align:center}
.row .body{flex:1;overflow-wrap:anywhere;white-space:pre-wrap}
.row .meta{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.red{color:var(--red)} .amber{color:var(--amber)} .blue{color:var(--blue)} .green{color:var(--green)}
.empty{color:var(--ink3);font-style:italic}
.corner{position:fixed;right:14px;bottom:12px;z-index:9;background:rgba(244,246,248,.94);border:1px solid var(--hair);padding:4px 12px;font-size:12px;font-variant:small-caps;letter-spacing:.08em}
.corner a{color:var(--blue);text-decoration:none;margin-left:8px}
@media (max-width:2100px){ body{padding:22px 28px 90px} .sessions{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))} .panels{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))} }
</style>
</head>
<body>
<header>
  <h1>Live Timeline</h1>
  <span class="sc">zippermerge</span>
  <span class="clock" id="clock"></span>
  <span class="poll" id="poll">connecting</span>
</header>
<div id="banners"></div>
<div id="vitals"></div>
<div id="legend"></div>
<div class="tlwrap" id="tlwrap"></div>
<div id="inspector"><span class="sc k">inspector</span><div class="b">Hover or click any marker, band, bar or arrow. The matching detail below is highlighted and its full text appears here.</div></div>
<div class="grid sessions" id="sessions"></div>
<div class="grid panels" id="panels"></div>
<div class="corner">Mockup 03 &middot; Live Timeline <a href="/mockups/">all mockups</a></div>

<script>
'use strict';
var NS = 'http://www.w3.org/2000/svg';
var MIN = 60000, HOUR = 3600000;
var data = null, offset = 0, lastSig = '', pinned = null, hover = null, pollOk = true;

function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, String(attrs[k]));
  add(e, kids);
  return e;
}
function add(e, kids) {
  if (kids === undefined || kids === null) return;
  if (!Array.isArray(kids)) kids = [kids];
  kids.forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
}
function sv(tag, attrs, text) {
  var e = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, String(attrs[k]));
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function arr(v) { return Array.isArray(v) ? v : []; }
function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
function str(v) { return v === null || v === undefined ? '' : String(v); }
function now() { return Date.now() + offset; }
function ts(v) { var t = Date.parse(str(v)); return isNaN(t) ? null : t; }
function hhmm(t) { var d = new Date(t); return ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
function dur(min) {
  if (min === null || min === undefined || isNaN(min)) return '?';
  var m = Math.round(Math.abs(min));
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + ('0' + (m % 60)).slice(-2) + 'm';
}
function isNone(s) { return /^\s*none\b/i.test(str(s)); }

/* ---------- derived data ---------- */
function laneList(d) {
  var lanes = [], seen = {};
  arr(d.sessions).forEach(function (s) { if (s && s.slug && !seen[s.slug]) { seen[s.slug] = 1; lanes.push({ slug: s.slug, s: s }); } });
  arr(d.log).forEach(function (l) { if (l && l.slug && !seen[l.slug]) { seen[l.slug] = 1; lanes.push({ slug: l.slug, s: null }); } });
  lanes.push({ slug: 'repo', repo: true });
  return lanes;
}
function mentions(text) {
  var out = [], m, re = /@([a-z0-9_-]+)/gi;
  while ((m = re.exec(str(text)))) { var s = m[1].toLowerCase(); if (out.indexOf(s) < 0) out.push(s); }
  return out;
}
function buildAsks(d) {
  var out = [], seen = {}, logs = arr(d.log), slugs = {};
  arr(d.sessions).forEach(function (s) { slugs[s.slug] = 1; });
  function byName(n) { for (var i = 0; i < logs.length; i++) if (logs[i].name === n) return logs[i]; return null; }
  function push(srcSlug, t, targets, key, body, kind, forceOpen, logName) {
    targets.forEach(function (to) {
      if (to === srcSlug || !t) return;
      var k = key + '>' + to; if (seen[k]) return; seen[k] = 1;
      var answered = false;
      if (!forceOpen) answered = logs.some(function (l) { return l.slug === to && ts(l.timestamp) > t; });
      out.push({ from: srcSlug, to: to, t: t, answered: answered, body: body, kind: kind, key: logName ? 'a:' + logName : 'a:' + key, logName: logName });
    });
  }
  logs.forEach(function (l) {
    if (l.kind === 'ask') push(l.slug, ts(l.timestamp), mentions(l.body), l.name, l.body, 'ask post', false, l.name);
  });
  arr(d.attention).forEach(function (a) {
    if (a.kind === 'ask') { var l = byName(a.ref); if (l) push(l.slug, ts(l.timestamp), [a.slug], l.name, l.body, 'unanswered ask', true, l.name); }
  });
  arr(d.sessions).forEach(function (s) {
    var a = obj(obj(s.fields).Asks), txt = str(a.value) + ' ' + arr(a.items).join(' ');
    if (isNone(a.value) && !arr(a.items).length) return;
    var t = ts(s.updated) || ts(s.mtime);
    push(s.slug, t, mentions(txt).filter(function (x) { return slugs[x]; }), 'status:' + s.slug, txt, 'ask in status', true, null);
  });
  return out;
}
function riskyBars(d) {
  return arr(d.timeline).map(function (e, i) { return { e: e, i: i, t: ts(e.atUtc) }; });
}
function lockEnd(d, lock) {
  var best = null;
  arr(d.timeline).forEach(function (e) {
    if (e.source === 'lock' && e.slug === lock.owner && str(e.text).indexOf(lock.lock) >= 0 && ts(e.atUtc)) best = ts(e.atUtc);
  });
  return best;
}
function lockStart(l) {
  var e = Number(l.since_epoch); if (e > 0) return e * 1000;
  return ts(l.since);
}

/* ---------- timeline ---------- */
var KIND_LABEL = { status: 'status post', note: 'note', lock: 'lock taken', unlock: 'lock released', claim: 'migration claim', hello: 'hello', ask: 'ask' };
function glyph(kind, x, y, extra) {
  var g = sv('g', null), c = 'var(--ink)';
  var k = str(kind);
  if (k === 'status') g.appendChild(sv('circle', { cx: x, cy: y, r: 4, fill: c }));
  else if (k === 'note') g.appendChild(sv('rect', { x: x - 3.5, y: y - 3.5, width: 7, height: 7, fill: 'none', stroke: c, 'stroke-width': 1.3, transform: 'rotate(45 ' + x + ' ' + y + ')' }));
  else if (k === 'lock') g.appendChild(sv('path', { d: 'M' + x + ' ' + (y - 5.5) + 'L' + (x + 5) + ' ' + (y + 4) + 'L' + (x - 5) + ' ' + (y + 4) + 'Z', fill: 'var(--red)' }));
  else if (k === 'unlock') g.appendChild(sv('path', { d: 'M' + x + ' ' + (y - 5.5) + 'L' + (x + 5) + ' ' + (y + 4) + 'L' + (x - 5) + ' ' + (y + 4) + 'Z', fill: 'none', stroke: 'var(--green)', 'stroke-width': 1.5 }));
  else if (k === 'claim') { g.appendChild(sv('rect', { x: x - 4, y: y - 4, width: 8, height: 8, fill: 'var(--blue)' })); }
  else if (k === 'hello') g.appendChild(sv('circle', { cx: x, cy: y, r: 4, fill: 'none', stroke: c, 'stroke-width': 1.3 }));
  else if (k === 'ask') g.appendChild(sv('path', { d: 'M' + (x - 4) + ' ' + (y - 5) + 'L' + (x + 6) + ' ' + y + 'L' + (x - 4) + ' ' + (y + 5) + 'Z', fill: 'var(--amber)' }));
  else { g.appendChild(sv('path', { d: 'M' + (x - 4) + ' ' + (y - 4) + 'L' + (x + 4) + ' ' + (y + 4) + 'M' + (x + 4) + ' ' + (y - 4) + 'L' + (x - 4) + ' ' + (y + 4), stroke: c, 'stroke-width': 1.4 })); }
  return g;
}
function legendRow() {
  var box = document.getElementById('legend');
  box.replaceChildren();
  ['status', 'note', 'lock', 'unlock', 'claim', 'hello', 'ask', 'other'].forEach(function (k) {
    var s = h('span'); var svg = sv('svg', { width: 16, height: 14, viewBox: '0 0 16 14' });
    svg.appendChild(glyph(k, 8, 7)); s.appendChild(svg); add(s, KIND_LABEL[k] || 'other kind'); box.appendChild(s);
  });
  var items = [['main-freeze band spans all lanes', 'var(--red)'], ['other lock: owner lane only', 'var(--amber)']];
  items.forEach(function (it) {
    var s = h('span'), svg = sv('svg', { width: 22, height: 12, viewBox: '0 0 22 12' });
    svg.appendChild(sv('rect', { x: 0, y: 1, width: 22, height: 10, fill: it[1], 'fill-opacity': .22, stroke: it[1], 'stroke-width': .8 }));
    s.appendChild(svg); add(s, it[0]); box.appendChild(s);
  });
  var s2 = h('span'), svg2 = sv('svg', { width: 30, height: 12, viewBox: '0 0 30 12' });
  svg2.appendChild(sv('rect', { x: 0, y: 2, width: 30, height: 8, fill: 'var(--blue)', 'fill-opacity': .25, stroke: 'var(--blue)', 'stroke-width': .8 }));
  s2.appendChild(svg2); add(s2, 'risky action ahead (red when overdue)'); box.appendChild(s2);
  var s3 = h('span'), svg3 = sv('svg', { width: 34, height: 12, viewBox: '0 0 34 12' });
  svg3.appendChild(sv('path', { d: 'M1 10C14 10 18 2 30 2', fill: 'none', stroke: 'var(--amber)', 'stroke-width': 1.4, 'stroke-dasharray': '4 3' }));
  s3.appendChild(svg3); add(s3, 'ask arrow (dashed: unanswered; solid: answered)'); box.appendChild(s3);
  add(box, h('span', null, 'faint ticks: heartbeat check times'));
}

function renderTimeline() {
  var wrap = document.getElementById('tlwrap');
  if (!data) { return; }
  var d = data, W = Math.max(900, wrap.clientWidth), GX = W > 2000 ? 330 : 270, PAD = 44, TOP = 38;
  var n = now(), t0 = n - 3 * HOUR, t1 = n + 2 * HOUR;
  function X(t) { return GX + (t - t0) / (t1 - t0) * (W - GX - PAD); }
  function inRange(t) { return t !== null && t >= t0 && t <= t1; }
  function cl(t) { return Math.max(t0, Math.min(t1, t)); }
  var lanes = laneList(d), asks = buildAsks(d), bars = riskyBars(d), claims = arr(d.claims);
  var locks = arr(d.locks).map(function (l) { return { l: l, a: lockStart(l), end: null }; });
  locks.forEach(function (o) { o.end = lockEnd(d, o.l); });

  /* label items per lane */
  lanes.forEach(function (ln) {
    ln.items = [];
    if (ln.repo) {
      claims.forEach(function (c) {
        var t = ts(c.claimed); if (!inRange(t)) return;
        ln.items.push({ t: t, kind: 'claim', label: '#' + str(c.number) + ' ' + str(c.name) + ' (' + str(c.owner) + ')', key: 'c:' + str(c.number),
          title: 'Migration claim #' + str(c.number) + ' ' + str(c.name) + ' - ' + str(c.owner) + ' - ' + hhmm(t) + 'Z', body: str(c.ref) });
      });
    } else {
      arr(d.log).forEach(function (l) {
        if (l.slug !== ln.slug) return; var t = ts(l.timestamp); if (!inRange(t)) return;
        ln.items.push({ t: t, kind: l.kind, label: str(l.kind || 'post') + ' ' + hhmm(t), key: 'l:' + str(l.name),
          title: str(l.slug) + ' / ' + str(l.kind) + ' / ' + hhmm(t) + 'Z', body: str(l.body) });
      });
    }
    ln.items.sort(function (a, b) { return a.t - b.t; });
    var ends = [];
    ln.items.forEach(function (it) {
      var x = X(it.t), w = it.label.length * 6.3 + 12, left = x + w > W - PAD, x0 = left ? x - w : x - 4, x1 = left ? x + 6 : x + w, r = -1;
      for (var i = 0; i < ends.length; i++) if (x0 > ends[i] + 4) { r = i; break; }
      if (r < 0) { r = ends.length; ends.push(-1e9); }
      ends[r] = x1; it.row = r; it.left = left; it.x = x;
    });
    ln.rows = Math.max(1, ends.length);
    ln.h = 26 + ln.rows * 14 + 8 + 20 + 22 + 16;
    if (ln.repo) ln.h += 10;
  });
  var y = TOP; lanes.forEach(function (ln) { ln.top = y; ln.mY = y + 26 + ln.rows * 14 + 8; y += ln.h; });
  var H = y + 6;
  var svg = sv('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  var defs = sv('defs');
  function hatch(id, col) {
    var p = sv('pattern', { id: id, width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    p.appendChild(sv('rect', { width: 7, height: 7, fill: col, 'fill-opacity': .06 }));
    p.appendChild(sv('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: col, 'stroke-opacity': .5, 'stroke-width': 1.6 }));
    defs.appendChild(p);
  }
  hatch('hRed', '#b83227'); hatch('hAmber', '#a86a0a'); hatch('hBlue', '#2d6a99');
  [['arAmber', '#a86a0a'], ['arGreen', '#2c7a57']].forEach(function (a) {
    var m = sv('marker', { id: a[0], viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
    m.appendChild(sv('path', { d: 'M0 0L10 5L0 10Z', fill: a[1] })); defs.appendChild(m);
  });
  svg.appendChild(defs);

  /* grid + axis */
  var gridLayer = sv('g'), first = Math.ceil(t0 / (30 * MIN)) * 30 * MIN;
  for (var t = first; t <= t1; t += 30 * MIN) {
    var x = X(t), major = (new Date(t).getUTCMinutes() === 0);
    gridLayer.appendChild(sv('line', { x1: x, y1: TOP - 4, x2: x, y2: H - 4, stroke: major ? '#b4bec9' : '#d9dfe5', 'stroke-width': major ? .9 : .6 }));
    gridLayer.appendChild(sv('text', { x: x, y: 16, 'text-anchor': 'middle', 'font-size': major ? 12.5 : 11, fill: major ? '#4a5866' : '#7a8794', 'font-family': 'Cascadia Mono, Consolas, monospace' }, hhmm(t)));
  }
  gridLayer.appendChild(sv('text', { x: GX - 10, y: 16, 'text-anchor': 'end', 'font-size': 11, fill: '#7a8794', 'letter-spacing': '1.2' }, 'UTC  − 3 h'));
  gridLayer.appendChild(sv('text', { x: W - PAD, y: 30, 'text-anchor': 'end', 'font-size': 11, fill: '#7a8794' }, '+ 2 h'));
  gridLayer.appendChild(sv('text', { x: X(n - 3 * HOUR), y: 30, 'font-size': 11, fill: '#7a8794' }, ''));
  svg.appendChild(gridLayer);
  var laneLayer = sv('g');
  lanes.forEach(function (ln, i) {
    laneLayer.appendChild(sv('line', { x1: 24, y1: ln.top - 2, x2: W - 24, y2: ln.top - 2, stroke: '#c2cad3', 'stroke-width': .8 }));
    if (!ln.repo && ln.s) {
      var hb = obj(ln.s.hb), mins = arr(hb.minutes);
      for (var hr = Math.floor(t0 / HOUR) * HOUR; hr <= t1; hr += HOUR) mins.forEach(function (m) {
        var tt = hr + m * MIN; if (tt < t0 || tt > t1) return;
        var next = ts(hb.nextAt) === tt;
        laneLayer.appendChild(sv('line', { x1: X(tt), y1: ln.top + ln.h - 18, x2: X(tt), y2: ln.top + ln.h - 6, stroke: next ? '#2d6a99' : '#9aa6b2', 'stroke-width': next ? 1.8 : 1, 'stroke-opacity': next ? 1 : .55 }));
      });
    }
  });
  svg.appendChild(laneLayer);

  /* locks */
  var bandLayer = sv('g');
  locks.forEach(function (o) {
    var l = o.l, a = o.a; if (a === null) return;
    var end = o.end && o.end > n ? o.end : n, isFreeze = l.lock === 'main-freeze', col = isFreeze ? '#b83227' : '#a86a0a';
    var tgt = isFreeze ? lanes : lanes.filter(function (ln) { return ln.slug === l.owner; });
    if (!tgt.length) return;
    var yA = tgt[0].top - 2, yB = tgt[tgt.length - 1].top + tgt[tgt.length - 1].h - 2;
    var xa = X(cl(a)), xn = X(cl(n)), xe = X(cl(end));
    var key = 'k:' + str(l.lock);

    mt.appendChild(h('tr', { 'data-k': 'c:' + str(f.n) }, [h('td', { 'class': 'mono' }, str(f.n)), h('td', { 'class': 'mono' }, str(f.name)), h('td', null, arr(f.where).join(', ')), h('td', { 'class': f.onMain ? 'green' : 'amber' }, f.onMain ? 'yes' : 'no'), h('td', null, f.claimOwner ? str(f.claimOwner) : '')]));
  });
  mb.appendChild(mt);
  var cl = arr(d.claims);
  if (cl.length) {
    mb.appendChild(h('div', { 'class': 'sc', 'style': 'margin-top:12px' }, 'claims'));
    cl.forEach(function (c) { mb.appendChild(h('div', { 'class': 'row', 'data-k': 'c:' + str(c.number) }, [h('span', { 'class': 'g blue' }, '■'), h('span', { 'class': 'body' }, '#' + str(c.number) + ' ' + str(c.name) + ' · ' + str(c.owner) + ' — ' + str(c.ref)), h('span', { 'class': 'meta' }, str(c.claimed))])); });
  }
  pn.appendChild(panel('migrations', mb));
  /* hot files */
  var hb2 = h('div'); var ov = arr(d.hotFileOverlaps);
  if (!ov.length) hb2.appendChild(h('div', { 'class': 'empty' }, 'No hot-file overlaps.'));
  ov.forEach(function (o) {
    var blk = h('div', { 'style': 'margin-bottom:12px' }, h('div', { 'class': 'mono amber', 'style': 'font-weight:600' }, str(o.file)));
    arr(o.sessions).forEach(function (s) {
      blk.appendChild(h('div', { 'class': 'row', 'data-k': 's:' + str(s.slug) }, [h('span', { 'class': 'g' }, '·'), h('span', { 'class': 'body' }, str(s.slug) + ': ' + arr(s.lines).join('\n'))]));
    });
    hb2.appendChild(blk);
  });
  pn.appendChild(panel('hot-file overlaps', hb2));
  /* worktrees */
  var wt = obj(d.worktrees), wb = h('div'), items = arr(wt.items);
  if (wt.error) wb.appendChild(h('div', { 'class': 'red' }, 'error: ' + str(wt.error)));
  if (!items.length) wb.appendChild(h('div', { 'class': 'empty' }, 'No worktree data.'));
  else {
    var tb = h('table'); tb.appendChild(h('tr', null, ['worktree', 'branch', 'ahead / behind', 'dirty', 'last commit', 'owner', 'op'].map(function (x) { return h('th', null, x); })));
    items.forEach(function (w) {
      tb.appendChild(h('tr', { 'data-k': w.owner ? 's:' + str(w.owner) : null }, [
        h('td', { 'class': 'mono' }, str(w.name)), h('td', { 'class': 'mono' }, str(w.branch)),
        h('td', null, '+' + str(w.ahead) + ' / −' + str(w.behind)),
        h('td', { 'class': w.dirty ? 'amber' : '' }, w.dirty ? str(w.dirty) + ' files' : 'clean'),
        h('td', null, dur(w.lastCommitAgeMin) + ' ago — ' + str(w.lastSubject)),
        h('td', null, str(w.owner || '')), h('td', { 'class': w.op ? 'red' : '' }, str(w.op || ''))]));
    });
    wb.appendChild(tb);
  }
  pn.appendChild(panel('worktrees', wb));
  /* log */
  var gb = h('div'); var lg = arr(d.log);
  if (!lg.length) gb.appendChild(h('div', { 'class': 'empty' }, 'Log is empty.'));
  lg.forEach(function (l) {
    var svgi = sv('svg', { width: 14, height: 14, viewBox: '0 0 14 14' }); svgi.appendChild(glyph(l.kind, 7, 7));
    gb.appendChild(h('div', { 'class': 'row', 'data-k': 'l:' + str(l.name) + (l.kind === 'ask' ? ' a:' + str(l.name) : '') + ' a:' + str(l.name) }, [h('span', { 'class': 'g' }, svgi),
      h('span', { 'class': 'body' }, str(l.slug) + ' · ' + str(l.kind) + ' — ' + str(l.body)), h('span', { 'class': 'meta' }, str(l.timestamp))]));
  });
  pn.appendChild(panel('log (newest first)', gb));
  applyHL();
}

/* ---------- loop ---------- */
function sigOf(d) {
  var c = JSON.parse(JSON.stringify(d));
  delete c.now; delete c.caches;
  if (c.migrations) { delete c.migrations.ranAt; delete c.migrations.ageSec; delete c.migrations.mainFetchedAt; }
  if (c.worktrees) { delete c.worktrees.ranAt; delete c.worktrees.ageSec; delete c.worktrees.mainFetchedAt; }
  return JSON.stringify(c);
}
function setPoll(ok, msg) {
  var p = document.getElementById('poll'); p.textContent = msg; p.className = 'poll' + (ok ? '' : ' bad');
}
function poll() {
  fetch('/api/board', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (j) {
    var t = ts(j && j.now); if (t !== null) offset = t - Date.now();
    var first = !data;
    data = obj(j);
    var sig = sigOf(data);
    if (sig !== lastSig || first) {
      lastSig = sig;
      var y = window.scrollY;
      renderDetail(); renderTimeline();
      window.scrollTo(window.scrollX, y);
    }
    setPoll(true, 'live · updated ' + hhmm(now()) + 'Z · polling every 5 s');
  }).catch(function (e) {
    setPoll(false, 'offline: ' + (e && e.message ? e.message : 'fetch failed') + ' · showing last data');
  });
}
function tick() {
  document.getElementById('clock').textContent = new Date(now()).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  if (data) renderTimeline();
}
legendRow();
poll();
setInterval(poll, 5000);
setInterval(tick, 1000);
tick();
var rzT = null;
window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(renderTimeline, 120); });
</script>
