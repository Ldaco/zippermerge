<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippermerge · Workspace</title>
<link rel="stylesheet" href="/dashboard.css">
<style>
[hidden] { display: none !important; }
.app {
  display: grid;
  grid-template-columns: minmax(0, 16rem) minmax(0, 1fr);
  block-size: 100dvh;
}
.side, .main { min-inline-size: 0; overflow: auto; }
.side {
  padding: var(--space-3);
  background: var(--surface-subtle);
  border-inline-end: 1px solid var(--divider);
}
.main {
  --workspace-toolbar: 4rem;
  scroll-padding-block-start: calc(var(--workspace-toolbar) + var(--space-2));
}
.brand { margin: 0 0 var(--space-3); font-weight: 650; }
#navToggle { display: none; }
.nav { display: grid; gap: var(--space-1); }
.nav details { margin-block-start: var(--space-2); }
.nav summary { padding-inline: var(--space-2); }
.ni {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-2);
  min-block-size: var(--control-size);
  padding: var(--space-1) var(--space-2);
  border-inline-start: 3px solid transparent;
  border-radius: var(--radius-control);
  overflow-wrap: anywhere;
}
.ni:hover { background: var(--surface-hover); }
.ni[aria-current="page"] {
  background: var(--surface-selected);
  border-inline-start-color: var(--accent);
  color: var(--text);
  font-weight: 650;
}
.session-nav { display: grid; gap: var(--space-1); margin-block-start: var(--space-1); }
.page-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-block: var(--space-2); }
.top {
  position: sticky;
  inset-block-start: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-2) var(--page-inset);
  background: var(--surface);
  border-block-end: 1px solid var(--divider);
}
.top h1 {
  flex: 1 1 10rem;
  margin: 0;
  overflow-wrap: anywhere;
}
.content { padding: var(--page-inset); overflow-wrap: anywhere; }
.state > p { margin: 0; }
.state > .btn { margin-block-start: var(--space-2); }
#connection { margin: 0 0 var(--space-3); }
#connection:empty { display: none; }
.page, .ov-main, .ov-side, .stack, .sessions, .banners, .feed, .pb {
  display: grid;
  min-inline-size: 0;
  align-content: start;
  gap: var(--space-4);
}
.pb, .feed, .banners { gap: var(--space-2); }
.two, .row2 { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1fr); }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
  gap: var(--space-3);
}
.stat, .panel, .sc, .row { min-inline-size: 0; }
.ph, .fh, .mt, .hd, .sc-meta, .sc-u, .filter-options, .pr-actions, .dialog-heading {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  flex-wrap: wrap;
}
.ph { margin-block-end: var(--space-3); }
.ph h2, .ph h3, .sc h2, .sc h3, .sc h4, .dialog h2, .mq-phase { margin: 0; }
.ph .btn, .dialog-heading .btn { margin-inline-start: auto; }
.cnt, .tm, .hint, .dim, .sl, .ss, .k, .pr-meta, .sb, .ty, .ax {
  color: var(--text-muted);
}
.tm, .hint, .cnt, .ty, .ax { font-size: var(--text-xs); line-height: var(--line-xs); }
.tm { font-family: var(--font-mono); }
.sv { margin-block: var(--space-1); font-size: var(--text-metric); line-height: var(--line-metric); font-weight: 650; }
.sv .tm { font: inherit; color: inherit; }
.r.behind { color: var(--danger); }
.r.dirty, .cd.over .tm { color: var(--warning); }
.r.ahead { color: var(--success); }
.banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: var(--radius-card);
  padding: var(--space-3);
}
.banner.red, .att.red { border-inline-start: 3px solid var(--danger); }
.banner.amber, .att.amber { border-inline-start: 3px solid var(--warning); }
.inbox-list, .pr-list, .session-cards { display: grid; gap: var(--space-2); padding: 0; margin: 0; list-style: none; }
.session-cards { gap: var(--space-4); }
.att {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--divider);
  border-radius: var(--radius-control);
  align-items: start;
}
.att .mt { align-self: center; }
.att .btn { justify-self: start; }
.kind { justify-self: start; }
.nx, .fi, .ov-line, .prr, .kv, .prob { padding-block: var(--space-2); border-block-end: 1px solid var(--divider); }
.nx, .fi, .prob { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-2); }
.nx { grid-template-columns: minmax(0, 8rem) minmax(0, 1fr); }
.nowline { color: var(--accent); font-weight: 600; }
.dialog-heading { min-inline-size: 0; }
.fields { margin-block-start: var(--space-3); }
.fields dl, .fields dd { margin: 0; }
.k { font-weight: 600; }
.kv .items { margin-block: var(--space-1); padding-inline-start: var(--space-5); }
.sc-meta, .sc-u { font-size: var(--text-sm); }
.sc-meta dt, .sc-meta dd { display: inline; }
.fh, .pr-actions { margin-block-end: var(--space-1); }
.prr {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-1) var(--space-2);
  align-items: start;
}
.pr-meta, .pr-actions { grid-column: 1 / -1; }
.pr-meta > * + * { margin-inline-start: var(--space-2); }
.pr-status { justify-self: end; }
.pr-status .chip { max-inline-size: 10rem; }
.ttl a, .sc h3 a, .sess a, a.chip.session-link {
  min-inline-size: 1.5rem;
  min-block-size: var(--control-size);
}
.ttl a, .sc h3 a { display: inline-flex; align-items: center; font-weight: 600; }
.rich, .fi .bd { white-space: pre-wrap; }
.token {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-inline-size: 1.5rem;
  min-block-size: 1.5rem;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
}
.path, .sha, .code { font-family: var(--font-mono); }
.hl, .focus, .hl-n { background: var(--surface-selected); color: var(--text); }
.av {
  display: inline-grid;
  place-items: center;
  min-inline-size: 1.75rem;
  min-block-size: 1.75rem;
  padding: var(--space-1);
  border-radius: var(--radius-sm);
  background: var(--identity-fallback);
  color: var(--on-identity);
  font-weight: 650;
  font-size: var(--text-xs);
}
.nl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: var(--space-2); }
.nt { padding: var(--space-2); border: 1px solid var(--divider); border-radius: var(--radius-control); }
.nt .n { font-variant-numeric: tabular-nums; font-weight: 650; }
.wh, .sess { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-1); }
.sess { padding-block-start: var(--space-1); }
.tbl-scroll { margin-block-start: var(--space-2); }
.tbl { overflow-wrap: anywhere; }
.tbl .r { text-align: end; font-variant-numeric: tabular-nums; }
.tbl th .btn { font-size: inherit; }
.tbl .z { color: var(--text-muted); }
.worktree-table { min-inline-size: 40rem; table-layout: fixed; }
.worktree-table th:nth-child(3), .worktree-table th:last-child { inline-size: 20%; }
.filter { min-inline-size: 0; margin: 0 0 var(--space-2); padding: 0; border: 0; }
.filter legend { font-weight: 650; margin-block-end: var(--space-1); }
.filter label {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  min-block-size: var(--control-size);
  padding-inline: var(--space-2);
  border: 1px solid var(--control-border);
  border-radius: var(--radius-control);
  cursor: pointer;
}
.filter input {
  flex: none;
  inline-size: 1.5rem;
  block-size: 1.5rem;
  margin: 0;
  accent-color: var(--accent);
}
.filter label:has(:checked) { background: var(--surface-selected); }
summary { min-block-size: var(--control-size); padding-block: var(--space-2); cursor: pointer; }
.hist { margin: 0; color: var(--accent); }
.hist svg { display: block; max-inline-size: 100%; inline-size: 100%; block-size: 5rem; fill: currentColor; }
.ax { display: flex; justify-content: space-between; }
.dialog-heading h2 { min-inline-size: 0; }
#palIn { inline-size: 100%; }
.pal-l { display: grid; gap: var(--space-1); margin-block-start: var(--space-2); }
.pi {
  display: grid;
  grid-template-columns: minmax(0, 5rem) minmax(0, 1fr);
  align-items: baseline;
  gap: var(--space-2);
  min-block-size: var(--control-size);
  padding: var(--space-2);
  border-inline-start: 3px solid transparent;
  border-radius: var(--radius-control);
  overflow-wrap: anywhere;
  cursor: pointer;
}
.pi[aria-selected="true"] { background: var(--surface-selected); border-inline-start-color: var(--accent); }
.pi .lb { font-weight: 600; }
.shortcuts { display: grid; gap: var(--space-2); margin: var(--space-3) 0; }
.shortcut { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--space-2); }
.shortcut dd { margin: 0; }
@media (min-width: 64rem) {
  .row2, .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .att { grid-template-columns: minmax(0, 1fr) auto; }
  .att .kind, .att .txt { grid-column: 1 / -1; }
}
@media (min-width: 90rem) {
  .ov { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
}
@media (max-width: 48rem) {
  .app { display: block; block-size: auto; }
  .side { padding: var(--space-2) var(--page-inset); border-inline-end: 0; border-block-end: 1px solid var(--divider); }
  .side, .main { overflow: visible; }
  .brand { display: none; }
  #navToggle { display: inline-flex; }
  .nav { margin-block-start: var(--space-2); }
  #navToggle[aria-expanded="false"] + .nav { display: none; }
  .top { position: static; }
}
@media (max-width: 40rem) {
  .top h1 { flex-basis: 100%; }
  .prr, .nx { grid-template-columns: minmax(0, 1fr); }
  .pr-status { justify-self: start; }
}
@media (max-height: 30rem) {
  .top { position: static; }
  .main { scroll-padding-block-start: var(--space-2); }
}
@media (forced-colors: active) {
  .ni[aria-current="page"] { border-inline-start-color: Highlight; }
  .pi { border-inline-start-color: Canvas; }
  .pi[aria-selected="true"] {
    border-inline-start-color: Highlight;
    outline: 2px solid Highlight;
    outline-offset: -2px;
  }
  .filter label:has(:checked) { border-color: Highlight; }
  .hist svg, .av { color: CanvasText; }
  .av, .banner, .att, .nt { border: 1px solid CanvasText; }
  .att:is(.red, .amber), .banner:is(.red, .amber) { border-inline-start-width: 3px; }
}
@media print {
  .app { display: block; block-size: auto; }
  .top { position: static; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to Workspace content</a>
<div class="app">
  <aside class="side dashboard-chrome" aria-label="Workspace sidebar">
    <p class="brand">Zippermerge</p>
    <button type="button" class="btn" id="navToggle" aria-controls="workspace-nav" aria-expanded="false">Workspace navigation</button>
    <nav class="nav print-scroll" id="workspace-nav" aria-label="Workspace">
      <div class="nav" id="views"></div>
      <details id="sessionNav" open>
        <summary>Sessions</summary>
        <div class="page-controls no-print" id="sessionPages" hidden>
          <button class="btn" type="button" id="prevSessionPage">Previous sessions</button>
          <span class="dim" id="sessionCount"></span>
          <button class="btn" type="button" id="nextSessionPage">Next sessions</button>
        </div>
        <div class="session-nav" id="sessionLinks"></div>
      </details>
    </nav>
  </aside>
  <main class="main print-scroll" id="main" tabindex="-1">
    <div class="top">
      <h1 id="view-title" tabindex="-1">Overview</h1>
      <button type="button" class="btn no-print" id="jump" aria-keyshortcuts="Control+k Meta+k">Jump to</button>
      <button type="button" class="btn no-print" id="shortcuts">Shortcuts</button>
      <button type="button" class="btn no-print" id="pause" aria-pressed="false" hidden>Pause live updates</button>
      <button type="button" class="btn no-print" id="refresh" hidden>Refresh now</button>
    </div>
    <div class="content">
      <div id="connection"></div>
      <div id="content" aria-busy="true">
        <p class="state" data-state="loading">Connecting to the board…</p>
      </div>
    </div>
    <div class="sr-only" id="status" role="status" aria-atomic="true"></div>
    <div class="sr-only" id="error" role="alert"></div>
  </main>
</div>
<dialog class="dialog" id="palBack" aria-labelledby="palTitle">
  <div class="dialog-heading">
    <h2 id="palTitle">Jump to</h2>
    <button type="button" class="btn" data-close>Close</button>
  </div>
  <div class="dialog-body">
    <label for="palIn" class="field-label">Search sessions, pull requests and views</label>
    <input id="palIn" class="field focus-inset" type="text" role="combobox" aria-controls="palList" aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" autocomplete="off" spellcheck="false" autofocus>
    <p id="palFeedback" hidden></p>
    <div class="pal-l" id="palList" role="listbox" aria-label="Search results" hidden></div>
  </div>
</dialog>
<dialog class="dialog" id="helpBack" aria-labelledby="helpTitle">
  <div class="dialog-heading">
    <h2 id="helpTitle" tabindex="-1">Keyboard shortcuts</h2>
    <button type="button" class="btn" data-close>Close</button>
  </div>
  <div class="dialog-body" id="helpBox">
    <button type="button" class="btn" id="singleKeys" aria-pressed="true">Single-key shortcuts</button>
    <dl class="shortcuts" id="shortcutList"></dl>
  </div>
</dialog>
<script>
(function () {
'use strict';
var POLL = 5000;
var BOARD_PAGE_SIZE = 50, pages = new Map(), sessionPage = 0;
var standalone = window.parent === window;
var shellBoard = window.frameElement?.dataset.boardSource === 'shell' ? window.parent.zm : null;
var S = {
  data: null, sig: '', offset: 0, view: 'overview', wtSort: { k: 'dirty', d: -1 },
  wtOwner: '', actSlug: '', actKind: '', hl: '', focus: '', scrollTo: false,
  snapshotAt: NaN, connection: 'loading', fetching: false, pollTimer: 0,
  dialog: null, opener: null, palQ: '', palSel: 0, palRes: [], chordAt: 0, hlTimer: 0
};
var $ = function (id) { return document.getElementById(id); };
var VIEWS = ['overview', 'inbox', 'timeline', 'mergequeue', 'migrations', 'worktrees', 'activity'];
var NAMES = { overview: 'Overview', inbox: 'Inbox', timeline: 'Timeline', mergequeue: 'Merge queue', migrations: 'Migrations', worktrees: 'Worktrees', activity: 'Activity' };
var TONES = {
  danger: 'urgent', warning: 'warning', success: 'success', info: 'info', neutral: 'neutral', ask: 'ask'
};
var SEVERITY = { red: ['Urgent', 'danger'], amber: ['Warning', 'warning'], info: ['Info', 'info'] };

function pref(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function setPref(key, value) {
  try { localStorage.setItem(key, value); } catch { /* Storage can be disabled. */ }
}
var shortcutsEnabled = pref('zm.keys') !== 'off';
var paused = pref('zm.paused') === '1';

function announce(message, urgent) {
  var live = $(urgent ? 'error' : 'status');
  if (live.textContent !== message) live.textContent = message;
}
function keyed(node, key) {
  node.dataset.focusKey = key;
  return node;
}
function button(text, key, action) {
  var node = keyed(h('button', 'btn', text), key);
  node.type = 'button';
  node.addEventListener('click', action);
  return node;
}
function routeLink(view, text, cls, key) {
  var link = keyed(h('a', cls, text), key || 'route:' + view);
  link.href = routeHash(view);
  link.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
    e.preventDefault();
    go(view);
  });
  return link;
}
function glyph(name) {
  var node = h('span', 'ic ic-' + name);
  node.setAttribute('aria-hidden', 'true');
  return node;
}
function statusChip(text, role, icon) {
  var node = h('span', 'chip', '', [glyph(icon || TONES[role]), h('span', '', text)]);
  node.dataset.role = role;
  return node;
}
function state(kind, message, action) {
  var node = h('div', 'state', '', [h('p', '', message), action]);
  node.dataset.state = kind;
  return node;
}
function tableFor(caption, columns) {
  var table = h('table', 'tbl'), label = h('caption', 'sr-only', caption);
  var head = h('tr');
  columns.forEach(function (name) {
    var header = h('th', '', name);
    header.scope = 'col';
    head.appendChild(header);
  });
  table.append(label, h('thead', '', '', [head]), h('tbody'));
  return table;
}
function tableRegion(table, label) {
  var wrap = keyed(h('div', 'tbl-scroll print-scroll', '', [table]), 'table:' + label);
  wrap.setAttribute('role', 'region');
  wrap.setAttribute('aria-label', label);
  wrap.tabIndex = 0;
  return wrap;
}
function rowHeader(text) {
  var node = h('th', 'mono', text);
  node.scope = 'row';
  return node;
}

/* ---------- helpers ---------- */
function h(tag, cls, text, kids) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null && text !== '') e.textContent = String(text);
  if (kids) for (var i = 0; i < kids.length; i++) if (kids[i]) e.appendChild(kids[i]);
  return e;
}
function arr(x) { return Array.isArray(x) ? x : []; }
function obj(x) { return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }
function str(x) { return x === undefined || x === null ? '' : String(x); }
function num(x, d) { var n = Number(x); return isFinite(n) && x !== null && x !== '' ? n : d; }
function tms(iso) { var t = Date.parse(iso); return isFinite(t) ? t : NaN; }
function nowMs() { return Date.now() + S.offset; }
function hashStr(s) { var x = 7; s = str(s); for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function hhmmZ(t) { var d = new Date(t); return pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) + ' UTC'; }
function cap(s) { s = str(s); return s.charAt(0).toUpperCase() + s.slice(1); }
function sevOf(x) { x = str(x).toLowerCase(); return x === 'red' || x === 'amber' ? x : 'info'; }
var SEVRANK = { red: 0, amber: 1, info: 2 };
function sessions() { return arr(S.data && S.data.sessions).filter(function (s) { return s && typeof s === 'object'; }); }
function sessionBySlug(slug) { var l = sessions(); for (var i = 0; i < l.length; i++) if (l[i].slug === slug) return l[i]; return null; }
function safe(name, fn) {
  try { return fn(); } catch (err) { console.error(err); return state('error', 'Could not display ' + name + '.', retryButton('render:' + name)); }
}

/* ---------- time ---------- */
function fmtDur(sec) {
  sec = Math.abs(Math.round(sec));
  if (sec < 60) return sec + 's';
  var m = Math.floor(sec / 60);
  if (m < 60) return m + 'm' + (sec < 300 ? ' ' + (sec % 60) + 's' : '');
  var hr = Math.floor(m / 60);
  if (hr < 24) return hr + 'h ' + (m % 60) + 'm';
  return Math.floor(hr / 24) + 'd ' + (hr % 24) + 'h';
}
function relText(t, mode) {
  var diff = (t - nowMs()) / 1000;
  if (mode === 'count') return diff >= 0 ? 'in ' + fmtDur(diff) : fmtDur(diff) + ' overdue';
  if (diff > -10) return 'just now';
  return fmtDur(diff) + ' ago';
}
function absText(t) { return new Date(t).toISOString().slice(0, 10) + ' ' + hhmmZ(t); }
function tm(iso, mode, fallbackMin) {
  var t = tms(iso);
  if (isNaN(t) && fallbackMin !== undefined && fallbackMin !== null && isFinite(Number(fallbackMin))) {
    t = nowMs() - Number(fallbackMin) * 60000;
  }
  return isNaN(t) ? h('span', 'tm', '—') : tmAt(t, mode);
}
function tmAt(t, mode) {
  var node = h('time', 'tm', relText(t, mode));
  node.dateTime = new Date(t).toISOString();
  node.dataset.t = String(t);
  node.dataset.m = mode || 'ago';
  node.title = absText(t);
  return node;
}

/* ---------- rich text ---------- */
var RX = /(`[^`]+`)|(\s->\s)|(#\d{2,5}\b)|(@[A-Za-z][\w-]*)|((?:[A-Za-z]:)?[\w.()\[\]{}*,\-]+(?:[\\\/][\w.()\[\]{}*,\-]+)+)|(\b[0-9a-f]{7,8}\b)/g;
function addText(parent, txt) {
  var hl = S.hl ? S.hl.toLowerCase() : '';
  if (!hl || !txt) { if (txt) parent.appendChild(document.createTextNode(txt)); return; }
  var low = txt.toLowerCase(), i = 0, j;
  while ((j = low.indexOf(hl, i)) !== -1) {
    if (j > i) parent.appendChild(document.createTextNode(txt.slice(i, j)));
    parent.appendChild(h('mark', 'hl', txt.slice(j, j + hl.length)));
    i = j + hl.length;
  }
  if (i < txt.length) parent.appendChild(document.createTextNode(txt.slice(i)));
}
function searchToken(tok) {
  var node = button('', 'search:' + tok, function () { openPal(tok, node); });
  node.className = 'token';
  node.setAttribute('aria-label', 'Search for ' + tok);
  addText(node, tok);
  return node;
}
function rich(text, cls) {
  var root = h('span', cls ? 'rich ' + cls : 'rich');

    return;
  }

    e.preventDefault();

    links[next].scrollIntoView({ block: 'nearest', behavior: 'instant' });
  }
});

/* ---------- data ---------- */
function stable(board) {
  return JSON.stringify(board, function (key, value) {
    return ['now', 'ageSec', 'ranAt', 'mainFetchedAt', 'generatedAt'].includes(key) ? undefined : value;
  });
}
function retryButton(key) {
  return button('Retry', 'retry:' + key, function () { poll(true); });
}
function connectionText() {
  var snapshot = isNaN(S.snapshotAt) ? '' : hhmmZ(S.snapshotAt);
  if (paused && snapshot) return 'Paused · showing data from ' + snapshot;
  if (S.connection === 'saved') return 'Showing a saved copy from ' + snapshot;
  if (S.connection === 'live') return 'Live · updated ' + snapshot;
  if (S.connection === 'offline') return 'Offline · showing data from ' + snapshot;
  if (S.connection === 'error') return "Couldn't load the board.";

}
function renderConnection(previous) {
  var node = $('connection'), message = connectionText(), mode = S.connection;
  if (mode === 'live' && !standalone && !paused) message = '';
  var current = node.firstElementChild;
  var hadFocus = current?.contains(document.activeElement);
  var description = current?.matches('p') ? current : current?.querySelector('p');
  var nextState = mode === 'offline' || mode === 'saved' ? 'stale' : paused ? 'paused' : 'status';
  if (!message || mode === 'loading' || mode === 'error') {
    if (current) node.replaceChildren();
  } else if (current?.dataset.state === nextState) {
    if (description.textContent !== message) description.textContent = message;
  } else {
    var status = mode === 'live' && !paused ? h('p', 'dim', message)
      : state(nextState, message, nextState === 'stale' ? retryButton('connection') : null);
    status.dataset.state = nextState;
    node.replaceChildren(status);
  }
  if (hadFocus && !current.isConnected) $('view-title').focus({ preventScroll: true });
  if (mode === 'error' && previous !== 'error') {
    $('content').setAttribute('aria-busy', 'false');
    $('content').replaceChildren(state('error', message, retryButton('first-load')));
  }
  if (standalone && mode !== previous && !S.dialog) {
    if (mode === 'error') announce(message + ' Retry.', true);
    else {
      $('error').textContent = '';
      announce(message);
    }
  }
}
function syncPause() {
  var control = $('pause');
  control.setAttribute('aria-pressed', String(paused));
  control.textContent = paused ? 'Resume live updates' : 'Pause live updates';
}
function updateTimeLabels() {
  document.querySelectorAll('time[data-t]').forEach(function (node) {
    var text = relText(Number(node.dataset.t), node.dataset.m);
    if (node.textContent !== text) node.textContent = text;

}
function ingest(board) {
  if (!board || !Array.isArray(board.sessions) || isNaN(tms(board.now))) throw new Error('Invalid board');
  var previous = S.connection, meta = obj(board.meta);
  S.connection = meta.stale === true ? 'saved' : 'live';
  var first = !S.data;
  S.snapshotAt = (S.connection === 'saved' ? tms(meta.cachedAt) : NaN);
  if (isNaN(S.snapshotAt)) S.snapshotAt = tms(board.now);

  S.data = board;
  $('content').setAttribute('aria-busy', 'false');
  renderConnection(previous);

    renderAll(first);

}
async function poll(force) {
  if (shellBoard) {
    if (force) return shellBoard.refreshBoard();
    return;
  }
  if (document.hidden || S.fetching) return;
  paused = pref('zm.paused') === '1' || (paused && pref('zm.paused') === null);
  if (paused && S.data && !force) return;

  var controller = new AbortController();
  var timeout = setTimeout(function () { controller.abort(); }, 20000);
  try {
    var response = await fetch('/api/board', { cache: 'no-store', signal: controller.signal });
    if (!response.ok) throw new Error('Board unavailable');
    var board = await response.json();
    if (!paused || !S.data || force) ingest(board);
  } catch {
    if (!paused || !S.data || force) {
      var previous = S.connection;
      S.connection = S.data ? 'offline' : 'error';

function setPaused(next) {

}
window.addEventListener('storage', function (event) {
  if (event.key === 'zm.keys' || event.key === null) {

$('pause').addEventListener('click', function () {

$('refresh').addEventListener('click', function () { poll(true); });
setInterval(function () { if (!paused) updateTimeLabels(); }, 1000);

S.view = parseHash();
[['prevSessionPage', -1], ['nextSessionPage', 1]].forEach(function (entry) {

VIEWS.forEach(function (view) {

updateTitle();
renderSide(S.view.startsWith('session:') ? S.view : '');
