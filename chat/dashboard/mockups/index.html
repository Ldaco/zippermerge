<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Gallery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232361ad'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23fff'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%23fff'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%23fff'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#e3e7eb;--card:#f8f9fb;--border:#cdd4db;--text:#1c2630;--text-2:#44515d;--text-3:#687583;--accent:#2361ad;--shadow:0 1px 2px rgba(30,45,60,.08),0 4px 14px rgba(30,45,60,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.6 "Segoe UI Variable","Segoe UI",system-ui,sans-serif}
header{padding:28px 32px 8px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font:650 26px/1.3 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
header p{margin:0;color:var(--text-2)}
header a{color:var(--accent)}
main{padding:16px 32px 40px;display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr))}
.m{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.m:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(30,45,60,.1),0 10px 28px rgba(30,45,60,.12)}
.thumb{position:relative;width:100%;aspect-ratio:2560/1250;overflow:hidden;background:#fff;border-bottom:1px solid var(--border)}
.thumb iframe{position:absolute;top:0;left:0;width:2560px;height:1250px;border:0;transform-origin:0 0;pointer-events:none}
.thumb a{position:absolute;inset:0;z-index:1}
.info{padding:14px 18px 16px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:baseline;gap:10px}
.num{font:700 13px/1 "Cascadia Mono",Consolas,monospace;color:var(--accent);background:#e2ecf8;border-radius:6px;padding:4px 7px}
.name{font:650 17px/1.35 "Segoe UI Variable","Segoe UI",system-ui,sans-serif}
.open{margin-left:auto;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.open:hover{text-decoration:underline}
.idea{color:var(--text-2);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>Dashboard mockups</h1>
  <p>Ten directions plus the previous dashboard, all running on the same live data. Click a thumbnail to open it full screen. The live dashboard (04 Dependency Graph, chosen 2026-11-04) is at <a href="/">localhost:4747</a>.</p>
</header>
<main id="grid"></main>
<script>
// Static gallery: the list below is authored here (not API data), so building it with textContent is plenty.
(function () {
  var MOCKS = [
    ['01', 'subway-map', 'Subway Map', 'Each session is a transit line on a live time axis. Posts are stations, locks are closed segments, shared files are interchanges.'],
    ['02', 'radar', 'Air Traffic Control', 'A daylight radar scope: sessions fly closer to the center as their next risky action approaches. Locks are restricted airspace.'],
    ['03', 'timeline', 'Live Timeline', 'A Tufte-style swimlane timeline, 3 hours back to 2 ahead, with a moving NOW line. Ask arrows, lock bands and countdown bars.'],
    ['04', 'network', 'Dependency Graph', 'A force-directed graph of sessions, worktrees, files, migrations, locks and PRs. Conflicts glow red, with an inspector panel.'],
    ['05', 'newsroom', 'Morning Edition', 'A broadsheet front page that writes itself: lead story, a story per session, a Breaking ticker, Letters (asks) and The Wire.'],
    ['06', 'chatroom', 'Team Chat', 'The log as a refined chat app: avatars, answered and unanswered asks, channels as filters, a presence panel with full status.'],
    ['07', 'bento', 'Bento Control', 'Apple-style widget tiles: a countdown ring, lock gauges, a migration bead line, sparklines and a big tile per session.'],
    ['08', 'kanban', 'Intent Board', 'Kanban by state of work across all sessions: Doing now, Up next, Waiting on someone, Holding, Watch out, Recently done.'],
    ['09', 'departures', 'Departures Board', 'A station display with an analog clock: Departures are upcoming actions, Arrivals are posts, gates per session, split-flap updates.'],
    ['10', 'workspace', 'Workspace', 'The polished conventional baseline: a Linear-style app shell, sidebar views, an inbox, rich session rows and a Ctrl+K palette.'],
    ['11', 'classic', 'Classic (previous dashboard)', 'The card-based dashboard this replaced: Steel theme, attention strip, session cards, a dock row of panels and the right-hand activity column.']
  ];
  var grid = document.getElementById('grid');
  MOCKS.forEach(function (m) {
    var href = '/mockups/' + m[0] + '-' + m[1] + '.html';
    var card = document.createElement('article'); card.className = 'm';
    var thumb = document.createElement('div'); thumb.className = 'thumb';
    var fr = document.createElement('iframe'); fr.src = href; fr.loading = 'lazy'; fr.title = m[2]; fr.tabIndex = -1;
    var cover = document.createElement('a'); cover.href = href; cover.setAttribute('aria-label', 'Open ' + m[2]);
    thumb.appendChild(fr); thumb.appendChild(cover);
    var info = document.createElement('div'); info.className = 'info';
    var row = document.createElement('div'); row.className = 'row';
    var num = document.createElement('span'); num.className = 'num'; num.textContent = m[0];
    var name = document.createElement('span'); name.className = 'name'; name.textContent = m[2];
    var open = document.createElement('a'); open.className = 'open'; open.href = href; open.textContent = 'Open →';
    row.appendChild(num); row.appendChild(name); row.appendChild(open);
    var idea = document.createElement('div'); idea.className = 'idea'; idea.textContent = m[3];
    info.appendChild(row); info.appendChild(idea);
    card.appendChild(thumb); card.appendChild(info);
    grid.appendChild(card);
  });
  // Scale each 2560px-wide iframe to its thumbnail width.
  function fit() {
    document.querySelectorAll('.thumb').forEach(function (t) {
      var f = t.querySelector('iframe');
      if (f) f.style.transform = 'scale(' + (t.clientWidth / 2560) + ')';
    });
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
